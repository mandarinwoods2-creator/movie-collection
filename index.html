<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

// ---------------------------------------------------------------
// JSONBin.io 기반 storage shim (v2: 키마다 개별 bin + 작은 인덱스 bin)
// Claude 아티팩트의 window.storage와 동일한 인터페이스를 흉내내되,
// 실제로는 클라우드(JSONBin)에 저장해서 아이패드/맥미니/맥북에어 등
// 어느 기기에서 이 페이지를 열어도 같은 데이터를 보게 한다.
//
// 예전엔 모든 영화를 하나의 큰 bin에 몰아넣었는데, JSONBin 무료 플랜은
// bin 하나당 100KB까지만 허용해서 컬렉션이 커지면 저장이 조용히(또는
// 에러와 함께) 실패했다. 이제는 영화 한 편당 자기만의 작은 bin을 따로
// 갖고, 'key → binId' 매핑만 담은 작은 인덱스 bin 하나로 찾아간다.
// 이러면 저장할 때마다 오가는 데이터가 항상 작아서 100KB에 걸릴 일이
// 거의 없다.
//
// 저장/조회는 Cloudflare Worker를 통해 처리합니다.
// Master Key는 Worker 내부에서만 사용하므로 이 페이지에는 넣지 않습니다.
// ---------------------------------------------------------------
const JSONBIN_INDEX_ID = '6aa9a8e5ac6210605ad1f72d';
const JSONBIN_BASE = 'https://shrill-moon-5ad5.mandarinwoods2.workers.dev/v3/b';

let _index = null; // { [key]: binId }
let _indexLoadPromise = null;
let _indexMutationQueue = Promise.resolve();

// ---------------------------------------------------------------
// 자동 백업
// 최근 10개의 백업을 JSONBin에 별도로 보관한다. 백업은 현재 영화 bin을
// 재사용하지 않고 각 영화의 내용을 별도 bin으로 복제하므로, 이후 영화가
// 수정/삭제되어도 과거 백업이 영향을 받지 않는다.
// ---------------------------------------------------------------
const BACKUP_PREFIX = 'backup:';
const BACKUP_LIMIT = 10;
let _backupQueue = Promise.resolve();

function makeBackupId() {
  return `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
}

async function createAutomaticBackup({ movies, customFormats, settings, reason = '저장' }) {
  const job = _backupQueue.then(async () => {
    const id = makeBackupId();
    const createdAt = new Date().toISOString();

    // 백업 1개를 1개의 bin으로 저장해 요청 수를 최소화한다.
    // 영화가 많아져 100KB를 넘는 경우에는 기존의 영화별 백업 방식으로
    // 자동 전환한다.
    const snapshot = {
      id,
      createdAt,
      reason,
      count: movies.length,
      customFormats: Array.isArray(customFormats) ? customFormats : [],
      settings: settings || DEFAULT_SETTINGS,
      movies,
    };

    let metaBinId;
    try {
      metaBinId = await createBin(snapshot, { report: false });
    } catch (firstError) {
      // 큰 컬렉션은 영화별 복사 방식으로 백업한다.
      const movieBins = {};
      await runInBatches(movies, async movie => {
        movieBins[movie.id] = await createBin(JSON.stringify(movie));
      }, 2);
      metaBinId = await createBin({
        id,
        createdAt,
        reason,
        count: movies.length,
        customFormats: Array.isArray(customFormats) ? customFormats : [],
        settings: settings || DEFAULT_SETTINGS,
        movieBins,
      });
    }

    await queueIndexMutation(
      idx => { idx[`${BACKUP_PREFIX}${id}`] = metaBinId; },
      idx => idx[`${BACKUP_PREFIX}${id}`] === metaBinId
    );

    const index = await fetchIndexFromCloud();
    const backupEntries = Object.entries(index || {})
      .filter(([key]) => key.startsWith(BACKUP_PREFIX))
      .sort((a, b) => a[0].slice(BACKUP_PREFIX.length).localeCompare(b[0].slice(BACKUP_PREFIX.length)));

    const old = backupEntries.slice(0, Math.max(0, backupEntries.length - BACKUP_LIMIT));
    for (const [key, metaId] of old) {
      try {
        const oldMeta = await readBin(metaId);
        const oldMovieBins = oldMeta?.movieBins ? Object.values(oldMeta.movieBins) : [];
        await queueIndexMutation(
          idx => { delete idx[key]; },
          idx => !Object.prototype.hasOwnProperty.call(idx, key)
        );
        try { await jsonbinFetch(`${JSONBIN_BASE}/${metaId}`, { method: 'DELETE', headers: jsonbinHeaders() }); } catch (_) {}
        await Promise.all(oldMovieBins.map(binId => jsonbinFetch(`${JSONBIN_BASE}/${binId}`, { method: 'DELETE', headers: jsonbinHeaders() }).catch(() => null)));
      } catch (_) {
        // 오래된 백업 정리는 best-effort
      }
    }

    return { id, createdAt, count: movies.length, reason };
  });
  _backupQueue = job.catch(() => {});
  return job;
}
async function listAutomaticBackups() {
  const index = await fetchIndexFromCloud();
  const entries = Object.entries(index || {}).filter(([key]) => key.startsWith(BACKUP_PREFIX));
  const result = [];
  for (const [key, metaBinId] of entries) {
    try {
      const meta = await readBin(metaBinId);
      if (meta?.id) result.push({ ...meta, metaBinId });
    } catch (_) {}
  }
  return result.sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt))).slice(0, BACKUP_LIMIT);
}

async function restoreAutomaticBackup(backup) {
  let restored = [];

  if (Array.isArray(backup?.movies)) {
    restored = backup.movies;
  } else {
    const movieBins = backup?.movieBins || {};
    const ids = Object.keys(movieBins);
    await runInBatches(ids, async id => {
      const raw = await readBin(movieBins[id]);
      const movie = typeof raw === 'string' ? JSON.parse(raw) : raw;
      if (movie?.id) restored.push(movie);
    }, 2);
  }

  const currentIndex = await fetchIndexFromCloud();
  const currentMovieKeys = Object.keys(currentIndex || {}).filter(k => k.startsWith('movie:'));
  for (const key of currentMovieKeys) await window.storage.delete(key);
  for (const movie of restored) await window.storage.set(`movie:${movie.id}`, JSON.stringify(movie));
  await window.storage.set('custom-formats', JSON.stringify(backup.customFormats || []));
  await window.storage.set('settings', JSON.stringify(backup.settings || DEFAULT_SETTINGS));
  return restored;
}
function jsonbinHeaders(extra) {
  return { 'Content-Type': 'application/json', ...(extra || {}) };
}

// JSONBin 무료 플랜의 429(rate limit)에 대응한다.
// 여러 영화의 요청이 한꺼번에 몰려도 잠시 기다렸다가 자동 재시도하고,
// 일반적인 오류는 그대로 반환한다. 최대 5회, 점점 간격을 늘린다.
async function jsonbinFetch(url, options = {}) {
  let lastResponse = null;
  for (let attempt = 0; attempt < 5; attempt++) {
    const res = await fetch(url, options);
    if (res.status !== 429) return res;
    lastResponse = res;
    const retryAfter = Number(res.headers.get('Retry-After'));
    const waitMs = Number.isFinite(retryAfter) && retryAfter > 0
      ? Math.min(retryAfter * 1000, 8000)
      : Math.min(1000 * Math.pow(2, attempt), 8000);
    await new Promise(resolve => setTimeout(resolve, waitMs));
  }
  return lastResponse;
}

function reportSaveFailure(status, body) {
  let msg = `클라우드 저장 실패 (${status})`;
  if (body && body.message) msg += `: ${body.message}`;
  window.alert('⚠️ ' + msg + '\n변경사항을 저장하지 못했어요. 기존 데이터는 그대로 유지됩니다.');
}

async function createBin(value, options = {}) {
  const res = await jsonbinFetch(JSONBIN_BASE, {
    method: 'POST',
    headers: jsonbinHeaders({ 'X-Bin-Private': 'true' }),
    body: JSON.stringify({ value }),
  });
  const data = await res.json().catch(() => null);
  if (!res.ok || !data?.metadata?.id) {
    if (options.report !== false) reportSaveFailure(res.status, data);
    throw new Error('bin 생성 실패');
  }
  return data.metadata.id;
}

async function updateBin(binId, value) {
  const res = await jsonbinFetch(`${JSONBIN_BASE}/${binId}`, {
    method: 'PUT',
    headers: jsonbinHeaders(),
    body: JSON.stringify({ value }),
  });
  if (!res.ok) {
    const body = await res.json().catch(() => null);
    reportSaveFailure(res.status, body);
    throw new Error('bin 갱신 실패');
  }
}

async function readBin(binId) {
  const res = await jsonbinFetch(`${JSONBIN_BASE}/${binId}/latest`, { headers: jsonbinHeaders() });
  if (!res.ok) throw new Error(`bin 읽기 실패 (${res.status})`);
  const data = await res.json();
  return data?.record?.value;
}

async function fetchIndexFromCloud() {
  const res = await jsonbinFetch(`${JSONBIN_BASE}/${JSONBIN_INDEX_ID}/latest`, {
    headers: jsonbinHeaders(),
    cache: 'no-store',
  });
  if (!res.ok) throw new Error(`인덱스 읽기 실패 (${res.status})`);
  const data = await res.json();
  const record = (data && data.record && typeof data.record === 'object') ? data.record : {};
  if (record.index && typeof record.index === 'object') return { ...record.index };
  return null;
}

async function saveIndex(indexToSave) {
  const res = await jsonbinFetch(`${JSONBIN_BASE}/${JSONBIN_INDEX_ID}`, {
    method: 'PUT',
    headers: jsonbinHeaders(),
    body: JSON.stringify({ index: indexToSave }),
  });
  if (!res.ok) {
    const body = await res.json().catch(() => null);
    reportSaveFailure(res.status, body);
    throw new Error('인덱스 저장 실패');
  }
}

// 동시 요청이 너무 많으면 요율 제한에 걸릴 수 있어 일정 개수씩 나눠 처리한다.
async function runInBatches(items, worker, batchSize = 2) {
  const results = [];
  for (let i = 0; i < items.length; i += batchSize) {
    const batch = items.slice(i, i + batchSize);
    const done = await Promise.all(batch.map(worker));
    results.push(...done);
  }
  return results;
}

async function loadIndex() {
  if (_index) return _index;
  if (_indexLoadPromise) return _indexLoadPromise;

  _indexLoadPromise = (async () => {
    const res = await jsonbinFetch(`${JSONBIN_BASE}/${JSONBIN_INDEX_ID}/latest`, {
      headers: jsonbinHeaders(),
      cache: 'no-store',
    });
    if (!res.ok) throw new Error(`인덱스 읽기 실패 (${res.status})`);
    const data = await res.json();
    const record = (data && data.record && typeof data.record === 'object') ? data.record : {};

    if (record.index && typeof record.index === 'object') {
      _index = { ...record.index };
    } else if (record.kv && typeof record.kv === 'object') {
      // 구버전(통짜 bin) 데이터 마이그레이션: 각 항목을 개별 bin으로 분리
      const entries = Object.entries(record.kv);
      const newIndex = {};
      await runInBatches(entries, async ([k, v]) => {
        const binId = await createBin(v);
        newIndex[k] = binId;
      });
      await saveIndex(newIndex);
      _index = newIndex;
    } else {
      // 정상적으로 읽었고 실제로 비어 있는 경우에만 빈 인덱스로 시작한다.
      _index = {};
    }
    return _index;
  })();

  try {
    return await _indexLoadPromise;
  } catch (e) {
    // 핵심: 네트워크/서버 오류를 절대로 '빈 데이터'로 바꾸지 않는다.
    _indexLoadPromise = null;
    throw e;
  }
}

// 인덱스 변경은 한 탭 안에서는 반드시 직렬화하고, 저장 뒤 다시 읽어서
// 이번 변경이 실제 클라우드 인덱스에 남아 있는지 확인한다.
// 다른 기기/탭이 거의 동시에 저장해 덮어쓴 경우 최신 인덱스 위에 다시 적용한다.
function queueIndexMutation(mutator, verify) {
  const job = _indexMutationQueue.then(async () => {
    let lastError = null;
    for (let attempt = 0; attempt < 5; attempt++) {
      try {
        const fresh = await fetchIndexFromCloud();
        if (fresh === null) throw new Error('클라우드 인덱스 형식이 올바르지 않음');
        mutator(fresh);
        await saveIndex(fresh);

        const confirmed = await fetchIndexFromCloud();
        if (confirmed !== null && verify(confirmed)) {
          _index = confirmed;
          return confirmed;
        }
        lastError = new Error('동시 저장 충돌 감지');
      } catch (e) {
        lastError = e;
      }
      await new Promise(resolve => setTimeout(resolve, 120 * (attempt + 1)));
    }
    throw lastError || new Error('인덱스 저장 실패');
  });
  _indexMutationQueue = job.catch(() => {});
  return job;
}

window.storage = {
  async get(key) {
    const index = await loadIndex();
    const binId = index[key];
    if (!binId) throw new Error('not found');
    const value = await readBin(binId);
    return { key, value, shared: false };
  },

  async set(key, value) {
    const index = await loadIndex();
    const existingBinId = index[key];

    if (existingBinId) {
      await updateBin(existingBinId, value);
    } else {
      const binId = await createBin(value);
      try {
        await queueIndexMutation(
          idx => { idx[key] = binId; },
          idx => idx[key] === binId
        );
      } catch (e) {
        // 인덱스 연결에 실패한 고아 bin은 정리 시도. 실패해도 기존 데이터에는 영향 없음.
        try { await jsonbinFetch(`${JSONBIN_BASE}/${binId}`, { method: 'DELETE', headers: jsonbinHeaders() }); } catch (_) {}
        throw e;
      }
    }
    return { key, value, shared: false };
  },

  async delete(key) {
    const index = await loadIndex();
    const binId = index[key];
    if (!binId) return { key, deleted: true, shared: false };

    // 먼저 인덱스에서 제거를 확정한 뒤 실제 bin을 삭제한다.
    await queueIndexMutation(
      idx => { delete idx[key]; },
      idx => !Object.prototype.hasOwnProperty.call(idx, key)
    );
    try { await jsonbinFetch(`${JSONBIN_BASE}/${binId}`, { method: 'DELETE', headers: jsonbinHeaders() }); } catch (_) {}
    return { key, deleted: true, shared: false };
  },

  async list(prefix = '') {
    const index = await loadIndex();
    const keys = Object.keys(index).filter(k => k.indexOf(prefix) === 0);
    return { keys, prefix, shared: false };
  },
};

    { id: 'c3', section: '시대별', number: 3, name: '근세' },
    { id: 'c4', section: '시대별', number: 4, name: '현대' },
  ],
};

function migrateSettings(raw) {
  if (!raw) return DEFAULT_SETTINGS;

  // 이미 최신 구조 (섹션이 {id, number, name} 객체 배열)
  if (raw.sections && Array.isArray(raw.categories) && raw.sections.length && typeof raw.sections[0] === 'object' && 'number' in raw.sections[0]) {
    return raw;
  }

  let sectionNames = [];
  let categories = [];

  if (raw.sections && Array.isArray(raw.categories)) {
    // 섹션에 번호가 붙기 전 버전 (섹션이 문자열 배열)
    sectionNames = raw.sections;
    categories = raw.categories;
  } else if (raw.sections && raw.categoriesBySection) {
    // 그 이전 버전: categoriesBySection 중첩 객체 구조
    sectionNames = raw.sections;
    for (const section of raw.sections) {
      for (const c of raw.categoriesBySection[section] || []) {
        categories.push({ id: c.id || uid(), section, number: c.number, name: c.name });
      }
    }
  } else if (raw.zoneName) {
    // 가장 이전 버전: zoneName + 문자열 배열 categories
    sectionNames = [raw.zoneName];
    categories = (raw.categories || []).map((name, i) => ({ id: uid(), section: raw.zoneName, number: i + 1, name }));
  } else {
    return DEFAULT_SETTINGS;
  }

  const sections = sectionNames.map((name, i) => ({ id: uid(), number: i + 1, name }));
  return { themeId: raw.themeId || 'filmCatalog', sections, categories };
  return DEFAULT_SETTINGS;
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function stripVodPrefix(f) {
  return f.startsWith('VOD-') ? f.slice(4) : f;
}

// 시리즈 표시는 시리즈마다 다른 색을 쓰지 않고, 테마의 포인트 컬러(gold)로 통일한다.
// 랜덤 색상은 가끔 테마와 안 어울리는 탁한 색이 나올 수 있어서, 항상 조화로운 테마색을 쓴다.
function seriesColor() {
  return 'var(--gold)';
}

// 같은 이름을 쓰는 다른 영화가 있으면 그 시리즈 id를 재사용하고, 없으면 기존 id를 유지하거나 새로 발급한다.
function resolveSeriesId(existingId, name, ownId, movies) {
  const trimmed = name.trim();
  if (!trimmed) return null;
  const match = movies.find(m => m.id !== ownId && m.seriesName === trimmed && m.seriesId);
  if (match) return match.seriesId;
  return existingId || uid();
}

// 카드형/진열장 공용: 현재 필터/정렬을 거친 목록의 순서는 최대한 유지하되,
// 같은 시리즈에 속한 영화는 항상 한데 묶어서 배치한다.
// expandedSeries에 없는 시리즈는 'series-bundle' 항목 하나로 접혀서 표시되고,
// expandedSeries에 있는 시리즈는 'series-header' + 개별 'movie' 항목들로 펼쳐진다.
function buildDisplayEntries(list, expandedSeries) {
  const seen = new Set();
  const entries = [];
  for (const m of list) {
    if (seen.has(m.id)) continue;
    if (m.seriesId) {
      const group = list
        .filter(x => x.seriesId === m.seriesId)
        .sort((a, b) => (Number(a.seriesOrder) || 0) - (Number(b.seriesOrder) || 0));
      group.forEach(g => seen.add(g.id));
      if (expandedSeries.has(m.seriesId)) {
        // 펼친 시리즈는 하나의 독립 블록으로 묶는다.
        // 뒤의 일반 영화가 같은 줄에 끼어들지 않게 하기 위함이다.
        entries.push({
          type: 'series-expanded',
          seriesId: m.seriesId,
          seriesName: m.seriesName,
          count: group.length,
          movies: group,
        });
      } else {
        entries.push({ type: 'series-bundle', seriesId: m.seriesId, seriesName: m.seriesName, movies: group });
      }
    } else {
      seen.add(m.id);
      entries.push({ type: 'movie', movie: m });
    }
  }
  return entries;
}

function clamp(n, min, max) {
  const v = parseInt(n, 10);
  if (isNaN(v)) return '';
  return Math.min(max, Math.max(min, v));
}

function parseBulkLine(raw) {
  const line = raw.trim();
  if (!line) return null;
  const re = /^(?:\d+\.\s*)?(.+?)\(([^)]+)\)_([^_]+)_([^_]+)_(\d{4})_([^_]+)_([^#]+?)\s*(#.*)?$/;
  const m = line.match(re);
  if (!m) return { error: line };
  const [, titleKr, titleOriginal, country, genre, year, director, actorsRaw, tagsRaw] = m;
  const actors = actorsRaw.split(',').map(s => s.trim()).filter(Boolean);
  const hashtags = tagsRaw ? Array.from(tagsRaw.matchAll(/#(\S+)/g)).map(x => x[1]) : [];
  return {
    ok: true,
    data: {
      id: uid(),
      titleKr: titleKr.trim(),
      titleOriginal: titleOriginal.trim(),
      countries: country.trim() ? [country.trim()] : [],
      genres: genre.trim() ? [genre.trim()] : [],
      year: year.trim(),
      runtime: '',
      ageRating: '',
      synopsis: '',
      director: director.trim(),
      actors,
      hashtags,
      status: 'owned',
      formats: [],
      physicalLocation: null,
      posterUrl: '',
      rating: null,
      seriesId: null,
      seriesName: '',
      seriesOrder: '',
      seriesUnofficial: false,
      notes: '',
      createdAt: Date.now(),
    },
  };
}

function parseListInput(raw, splitOnHash) {
  if (!raw) return [];
  const parts = splitOnHash ? raw.split(/[,#]+/) : raw.split(',');
  return parts.map(s => s.trim()).filter(Boolean);
}

const IMGBB_API_KEY = 'c5dd68399246ec0708ba5b531e9b5078';

// 이미지를 imgbb에 실제로 업로드해서 영구 호스팅 URL을 받아온다.
// source가 문자열(URL)이면 imgbb 서버가 직접 그 주소에서 가져가 호스팅하고,
// File/Blob이면 그대로 업로드한다. 반환되는 건 imgbb의 짧고 영구적인 이미지 주소라서
// JSONBin에는 이 짧은 URL만 저장되고, 원본 출처 사이트가 나중에 사라져도 안전하다.
async function uploadToImgbb(source) {
  const formData = new FormData();
  formData.append('image', source);
  const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
    method: 'POST',
    body: formData,
  });
  const data = await res.json();
  if (!data || !data.success) {
    throw new Error(data?.error?.message || '이미지 업로드에 실패했어요');
  }
  return data.data.url || data.data.display_url;
}

function Poster({ url, size = 'card' }) {
  const [broken, setBroken] = useState(false);
  useEffect(() => { setBroken(false); }, [url]);
  if (!url || broken) {
    return (
      <div className={`poster poster--${size} poster--empty`}>
        <Film size={size === 'card' ? 18 : 22} />
      </div>
    );
  }
  return (
    <div className={`poster poster--${size}`}>
      <img src={url} alt="" onError={() => setBroken(true)} />
    </div>
  );
}

// 반개 단위 별점. value가 null/undefined면 미감상 상태로 다섯 개가 전부 빈 별(테두리)로만 보인다.
// readOnly=false면 별을 반쪽씩 클릭해 0.5 단위로 평점을 매길 수 있다.
function StarRating({ value, onChange, size = 15, readOnly = false }) {
  const [hover, setHover] = useState(null);
  const display = hover != null ? hover : (value || 0);
  const pct = Math.max(0, Math.min(100, (display / 5) * 100));

  if (readOnly) {
    return (
      <span className="star-rating" style={{ fontSize: size }}>
        <span className="star-rating__bg">☆☆☆☆☆</span>
        <span className="star-rating__fill" style={{ width: `${pct}%` }}>★★★★★</span>
      </span>
    );
  }

  return (
    <span className="star-rating star-rating--editable" style={{ fontSize: size }} onMouseLeave={() => setHover(null)}>
      <span className="star-rating__bg">☆☆☆☆☆</span>
      <span className="star-rating__fill" style={{ width: `${pct}%` }}>★★★★★</span>
      <span className="star-rating__hits">
        {[0, 1, 2, 3, 4].map(i => (
          <span key={i} className="star-rating__hit-star">
            <button type="button" onMouseEnter={() => setHover(i + 0.5)} onClick={() => onChange(i + 0.5)} />
            <button type="button" onMouseEnter={() => setHover(i + 1)} onClick={() => onChange(i + 1)} />
          </span>
        ))}
      </span>
    </span>
  );
}

  );

  const [locSection, setLocSection] = useState(initial?.physicalLocation?.section || settings.sections[0]?.name || '');
  const [locCategoryName, setLocCategoryName] = useState(initial?.physicalLocation?.categoryName || '');
  const [locCategoryNumber, setLocCategoryNumber] = useState(initial?.physicalLocation?.categoryNumber || '');
  const [locItemNumber, setLocItemNumber] = useState(initial?.physicalLocation?.itemNumber || '');
  const [newSectionMode, setNewSectionMode] = useState(false);
  const [newSectionText, setNewSectionText] = useState('');
  const [newCategoryMode, setNewCategoryMode] = useState(false);
  const [newCategoryName, setNewCategoryName] = useState('');
  const [newCategoryNumber, setNewCategoryNumber] = useState('');

  const [hashtagsRaw, setHashtagsRaw] = useState((initial?.hashtags || []).join(', '));
  const [notes, setNotes] = useState(initial?.notes || '');
  const [rating, setRating] = useState(initial?.rating ?? null);
  const [seriesName, setSeriesName] = useState(initial?.seriesName || seed?.seriesName || '');
  const [seriesOrder, setSeriesOrder] = useState(initial?.seriesOrder ?? seed?.seriesOrder ?? '');
  const [seriesUnofficial, setSeriesUnofficial] = useState(initial?.seriesUnofficial ?? seed?.seriesUnofficial ?? false);
  const [posterUrl, setPosterUrl] = useState(initial?.posterUrl || '');
  const [manualUrlDraft, setManualUrlDraft] = useState('');
  const [posterBusy, setPosterBusy] = useState(false);
  const [posterError, setPosterError] = useState('');
  const [confirmDelete, setConfirmDelete] = useState(false);

  const existingSeriesNames = useMemo(() => {
    const set = new Set();
    movies.forEach(m => { if (m.seriesName) set.add(m.seriesName); });
    return Array.from(set);
  }, [movies]);

  const hasPhysical = selectedFormats.some(f => PHYSICAL_FORMATS.includes(f)) || !!customText.trim();
  const categoriesForSection = settings.categories.filter(c => c.section === locSection);

  useEffect(() => {
    if (locSection && !settings.sections.some(s => s.name === locSection)) {
      setLocSection(settings.sections[0]?.name || '');
      setLocCategoryName('');
      setLocCategoryNumber('');
    } else if (locCategoryName && !settings.categories.some(c => c.section === locSection && c.name === locCategoryName)) {
      setLocCategoryName('');
      setLocCategoryNumber('');
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [settings]);

  const suggestedCategoryNumber = useMemo(() => {
    const used = new Set(categoriesForSection.map(c => c.number));
    for (let i = 1; i <= 20; i++) if (!used.has(i)) return i;
    return '';
  }, [categoriesForSection]);

  const suggestedItemNumber = useMemo(() => {
    if (!locSection || !locCategoryName) return null;
    const count = movies.filter(m =>
      m.id !== initial?.id &&
      m.physicalLocation?.section === locSection &&
      m.physicalLocation?.categoryName === locCategoryName
    ).length;
    return Math.min(24, count + 1);
  }, [locSection, locCategoryName, movies, initial]);

  function toggleFormat(f) {
    setSelectedFormats(prev => prev.includes(f) ? prev.filter(x => x !== f) : [...prev, f]);
  }

  async function handleApplyManualUrl() {
    const url = manualUrlDraft.trim();
    if (!url) return;
    setPosterBusy(true);
    setPosterError('');
    try {
      const hostedUrl = await uploadToImgbb(url);
      setPosterUrl(hostedUrl);
      setManualUrlDraft('');
    } catch (e) {
      setPosterError('이미지를 저장하지 못했어요. URL이 맞는지 확인하거나 다른 이미지로 시도해보세요.');
    } finally {
      setPosterBusy(false);
    }
  }

  async function handleFileUpload(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    setPosterBusy(true);
    setPosterError('');
    try {
      const hostedUrl = await uploadToImgbb(file);
      setPosterUrl(hostedUrl);
    } catch (e) {
      setPosterError('이미지를 저장하지 못했어요. 다른 파일로 시도해보세요.');
    } finally {
      setPosterBusy(false);
      e.target.value = '';
    }
  }

  function confirmNewSection() {
    const val = newSectionText.trim();
    if (!val) { setNewSectionMode(false); return; }
    onAddSection(val);
    setLocSection(val);
    setLocCategoryName('');
    setLocCategoryNumber('');
    setNewSectionMode(false);
    setNewSectionText('');
  }

  function confirmNewCategory() {
    const name = newCategoryName.trim();
    const number = clamp(newCategoryNumber || suggestedCategoryNumber, 1, 20);
    if (!name || !number) { setNewCategoryMode(false); return; }
    onAddCategory(locSection, number, name);
    setLocCategoryName(name);
    setLocCategoryNumber(number);
    setNewCategoryMode(false);
    setNewCategoryName('');
    setNewCategoryNumber('');
  }

  function handleSave() {
    if (!titleKr.trim()) return;
    let formats = [...selectedFormats];
    const custom = customText.trim();
    if (custom) {
      formats.push(custom);
      onAddCustomFormat(custom);
    }
    const physicalLocation = !hasPhysical ? null
      : locMode === 'individual' ? { individual: true }
      : (locSection && locCategoryName) ? { section: locSection, categoryName: locCategoryName, categoryNumber: locCategoryNumber, itemNumber: locItemNumber }
      : null;
    const trimmedSeriesName = seriesName.trim();
    const seriesId = resolveSeriesId(initial?.seriesId || seed?.seriesId || null, trimmedSeriesName, initial?.id, movies);
    onSave({
      id: initial?.id || uid(),
      titleKr: titleKr.trim(),
      titleOriginal: titleOriginal.trim(),
      countries: parseListInput(countryRaw, false),
      genres: parseListInput(genresRaw, false),
      year: year.trim(),
      runtime: runtime,
      ageRating: ageRating.trim(),
      synopsis: synopsis.trim(),
      director: director.trim(),
      actors: parseListInput(actorsRaw, false),
      status,
      formats,
      physicalLocation,
      posterUrl,
      rating,
      seriesId,
      seriesName: trimmedSeriesName,
      seriesOrder: trimmedSeriesName ? seriesOrder : '',

      hashtags: parseListInput(hashtagsRaw, true),
      notes: notes.trim(),
      createdAt: initial?.createdAt || Date.now(),

  return (
    <div className="drawer-backdrop" onClick={onCancel}>
      <div className="drawer" onClick={e => e.stopPropagation()}>

              <div className="segmented">
                <button type="button" className={locMode === 'section' ? 'is-active' : ''} onClick={() => setLocMode('section')}>섹션에 정리</button>

                    <input

                      value={newSectionText}
                      onChange={e => setNewSectionText(e.target.value)}
                      onKeyDown={e => e.key === 'Enter' && confirmNewSection()}

                    <select value={locSection} onChange={e => {

                      else { setLocSection(e.target.value); setLocCategoryName(''); setLocCategoryNumber(''); }
                    }}>

                        max={20}
                        value={newCategoryNumber}

                      <input
                        autoFocus
                        value={newCategoryName}
                        onChange={e => setNewCategoryName(e.target.value)}
                        onKeyDown={e => e.key === 'Enter' && confirmNewCategory()}
                        placeholder="새 카테고리 이름 (예: 80년대 영화)"
                      />
                      <button type="button" className="btn btn--ghost btn--sm" onClick={confirmNewCategory}>추가</button>
                    </div>
                  ) : (
                    <select value={locCategoryName} onChange={e => {
                      if (e.target.value === '__new__') { setNewCategoryMode(true); return; }
                      const cat = categoriesForSection.find(c => c.name === e.target.value);
                      setLocCategoryName(e.target.value);
                      setLocCategoryNumber(cat ? cat.number : '');
                    }}>
                      <option value="">카테고리 선택</option>
                      {categoriesForSection.sort((a, b) => a.number - b.number).map(c => (
                        <option key={c.id} value={c.name}>({c.number}) {c.name}</option>
                      ))}
                      <option value="__new__">+ 새 카테고리 추가</option>
                    </select>
                  )}

                  <span className="sub-label">번호 (최대 24)</span>
                  <input
                    className="field--small"
                    type="number"
                    min={1}
                    max={24}
                    value={locItemNumber}
                    onChange={e => setLocItemNumber(e.target.value)}
                    onBlur={e => e.target.value && setLocItemNumber(clamp(e.target.value, 1, 24))}
                    placeholder={suggestedItemNumber ? `추천 ${suggestedItemNumber}번` : '번호'}
                  />
                  <p className="hint-text-small">섹션·카테고리·번호는 한 번 등록해두면 다음부터 목록에서 선택할 수 있어요. 이름을 고치거나 삭제하려면 위의 "편집" 버튼을 눌러주세요.</p>
                </>
              )}
            </div>
          )}

          <label className="field">
            <span>비고 해시태그 (쉼표로 구분, # 생략 가능)</span>
            <input value={hashtagsRaw} onChange={e => setHashtagsRaw(e.target.value)} placeholder="2010년대이탈리아베네치아, 인터폴추격, 신분위장" />
          </label>

          <label className="field">
            <span>메모</span>
            <textarea value={notes} onChange={e => setNotes(e.target.value)} rows={3} placeholder="추가로 남기고 싶은 내용" />
          </label>
        </div>

        <div className="drawer__foot">
          {isEdit && (
            confirmDelete ? (
              <div className="confirm-delete">
                <span>정말 삭제할까요?</span>
                <button type="button" className="btn btn--danger" onClick={() => onDelete(initial.id)} disabled={saving}>삭제</button>
                <button type="button" className="btn btn--ghost" onClick={() => setConfirmDelete(false)}>취소</button>
              </div>
            ) : (
              <button type="button" className="btn btn--ghost btn--danger-text" onClick={() => setConfirmDelete(true)}>
                <Trash2 size={15} /> 삭제
              </button>
            )
          )}
          <div className="drawer__foot-actions">
            <button type="button" className="btn btn--ghost" onClick={onCancel} disabled={saving}>취소</button>
            <button type="button" className="btn btn--primary" onClick={handleSave} disabled={!titleKr.trim() || saving}>{saving ? <><Loader2 size={14} className="spin" /> 저장 중...</> : '저장'}</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function BulkImportModal({ onCancel, onConfirm, saving }) {
  const [text, setText] = useState('');
  const [parsed, setParsed] = useState(null);

  function handlePreview() {
    const lines = text.split('\n');
    const ok = [];
    const errors = [];
    for (const line of lines) {
      const result = parseBulkLine(line);
      if (!result) continue;
      if (result.ok) ok.push(result.data);
      else errors.push(result.error);
    }
    setParsed({ ok, errors });
  }

  return (
    <div className="drawer-backdrop" onClick={onCancel}>
      <div className="drawer" onClick={e => e.stopPropagation()}>
        <div className="drawer__head">
          <h2>목록 붙여넣기로 추가</h2>
          <button type="button" className="icon-btn" onClick={onCancel}><X size={18} /></button>
        </div>
        <div className="drawer__body">
          <p className="hint-text">
            기존에 쓰던 형식 그대로 붙여넣으세요.<br />
            제목(원제)_국가_장르_년도_감독_배우1, 배우2 #태그1 #태그2
          </p>
          <textarea
            className="bulk-textarea"
            rows={10}
            value={text}
            onChange={e => { setText(e.target.value); setParsed(null); }}
            placeholder={'1. 투어리스트(The Tourist)_미국_액션 스릴러_2010_플로리안 헨켈 폰 도너스마르크_안젤리나 졸리, 조니 뎁 #2010년대이탈리아베네치아 #인터폴추격'}
          />
          <button type="button" className="btn btn--ghost" onClick={handlePreview} disabled={!text.trim()}>미리보기</button>

          {parsed && (
            <div className="preview-box">
              <p className="preview-summary">인식됨 {parsed.ok.length}건{parsed.errors.length > 0 ? ` · 인식 실패 ${parsed.errors.length}건` : ''}</p>
              {parsed.ok.length > 0 && (
                <ul className="preview-list">
                  {parsed.ok.map(m => (
                    <li key={m.id}>{m.titleKr} <span className="preview-meta">({m.year} · {m.director})</span></li>
                  ))}
                </ul>
              )}
              {parsed.errors.length > 0 && (
                <div className="preview-errors">
                  <p>형식을 인식하지 못한 줄이에요. 직접 추가하거나 형식을 맞춰 다시 붙여넣어 주세요.</p>
                  <ul>
                    {parsed.errors.map((e, i) => <li key={i}>{e}</li>)}
                  </ul>
                </div>
              )}
            </div>
          )}

          <div className="field backup-section">
            <span>자동 백업</span>
            <p className="hint-text-small">저장에 성공할 때마다 현재 영화 목록과 설정을 별도 백업하고, 최근 10개를 유지해요. 복구해도 백업 자체는 삭제되지 않아요.</p>
            <div className="backup-actions">
              <button type="button" className="btn btn--ghost btn--sm" onClick={onRefreshBackups} disabled={backupBusy}>
                {backupBusy ? <><Loader2 size={13} className="spin" /> 확인 중...</> : '백업 새로고침'}
              </button>
            </div>
            <div className="backup-list">
              {backups.length === 0 ? <div className="hint-text-small">아직 자동 백업이 없어요. 다음 저장부터 자동으로 만들어집니다.</div> : backups.map(b => (
                <div className="backup-row" key={b.id}>
                  <div>
                    <div className="backup-row__date">{new Date(b.createdAt).toLocaleString('ko-KR')}</div>
                    <div className="backup-row__meta">{b.count}편 · {b.reason || '저장'}</div>
                  </div>
                  <button type="button" className="btn btn--ghost btn--sm" onClick={() => onRestoreBackup(b)} disabled={backupBusy}>
                    <RotateCcw size={13} /> 복구
                  </button>
                </div>
              ))}
            </div>
          </div>
        </div>
        <div className="drawer__foot">
          <div />
          <div className="drawer__foot-actions">
            <button type="button" className="btn btn--ghost" onClick={onCancel} disabled={saving}>취소</button>
            <button
              type="button"
              className="btn btn--primary"
              disabled={!parsed || parsed.ok.length === 0 || saving}
              onClick={() => onConfirm(parsed.ok)}
            >
              {saving ? <><Loader2 size={14} className="spin" /> 저장 중...</> : (parsed ? `${parsed.ok.length}건 추가하기` : '추가하기')}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

function SettingsModal({ settings, initialSection, onCancel, onChangeTheme, onAddSection, onUpdateSection, onRemoveSection, onAddCategory, onUpdateCategory, onRemoveCategory, onResetSettings, backups, onRefreshBackups, onRestoreBackup, backupBusy }) {
  const [activeSection, setActiveSection] = useState(initialSection || settings.sections[0]?.name || '');
  const [newSection, setNewSection] = useState('');
  const [newCatName, setNewCatName] = useState('');
  const [newCatNumber, setNewCatNumber] = useState('');
  const [resetConfirm, setResetConfirm] = useState(false);

  const categories = settings.categories.filter(c => c.section === activeSection).sort((a, b) => a.number - b.number);

  function handleAddSectionClick() {
    const v = newSection.trim();
    if (!v) return;
    onAddSection(v);
    setActiveSection(v);
    setNewSection('');
  }

  function handleAddCategoryClick() {
    const name = newCatName.trim();
    const usedNumbers = new Set(categories.map(c => c.number));
    let suggested = 1;
    while (usedNumbers.has(suggested) && suggested <= 20) suggested++;
    const number = clamp(newCatNumber || suggested, 1, 20);
    if (!name || !number) return;
    onAddCategory(activeSection, number, name);
    setNewCatName('');
    setNewCatNumber('');
  }

  return (
    <div className="drawer-backdrop" onClick={onCancel}>
      <div className="drawer" onClick={e => e.stopPropagation()}>
        <div className="drawer__head">
          <h2>설정</h2>
          <button type="button" className="icon-btn" onClick={onCancel}><X size={18} /></button>
        </div>
        <div className="drawer__body">
          <div className="field">
            <span>색감 테마</span>
            <div className="theme-grid">
              {Object.entries(THEMES).map(([id, t]) => (
                <button
                  type="button"
                  key={id}
                  className={`theme-swatch${settings.themeId === id ? ' is-active' : ''}`}
                  onClick={() => onChangeTheme(id)}
                >
                  <span className="theme-swatch__dots">
                    <i style={{ background: t.vars['--bg-panel'] }} />
                    <i style={{ background: t.vars['--paper'] }} />
                    <i style={{ background: t.vars['--accent'] }} />
                  </span>
                  {t.name}
                </button>
              ))}
            </div>
          </div>

          <div className="field">
            <span>섹션 (예: 판타지, 시대별, 고전, 로맨틱 코미디) — 번호 1~50</span>
            <div className="category-edit-list">
              {settings.sections.length === 0 && <p className="hint-text-small">아직 섹션이 없어요.</p>}
              {settings.sections.slice().sort((a, b) => a.number - b.number).map(s => (
                <div key={s.id} className={`category-edit-row${s.name === activeSection ? ' is-active-row' : ''}`}>
                  <button
                    type="button"
                    className="section-select-btn"
                    title="이 섹션의 카테고리 관리하기"
                    onClick={() => setActiveSection(s.name)}
                  >
                    {s.name === activeSection ? '●' : '○'}
                  </button>
                  <input
                    type="number" min={1} max={50}
                    className="field--small"
                    value={s.number}
                    onChange={e => {
                      const raw = e.target.value;
                      onUpdateSection(s.id, { number: raw === '' ? '' : clamp(raw, 1, 50) });
                    }}
                  />
                  <input
                    value={s.name}
                    onChange={e => {
                      const v = e.target.value;
                      if (!v.trim()) return;
                      onUpdateSection(s.id, { name: v });
                      if (activeSection === s.name) setActiveSection(v);
                    }}
                  />
                  <button
                    type="button"
                    className="icon-btn"
                    onClick={() => {
                      onRemoveSection(s.id);
                      if (activeSection === s.name) {
                        const next = settings.sections.find(x => x.id !== s.id);
                        setActiveSection(next ? next.name : '');
                      }
                    }}
                  >
                    <Trash2 size={14} />
                  </button>
                </div>
              ))}
            </div>
            <p className="hint-text-small">번호와 이름을 바로 고쳐 쓸 수 있어요. 동그라미를 누르면 아래에서 그 섹션의 카테고리를 관리할 수 있어요.</p>
            <div className="field-row">
              <input value={newSection} onChange={e => setNewSection(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleAddSectionClick()} placeholder="새 섹션 이름" />
              <button type="button" className="btn btn--ghost btn--sm" onClick={handleAddSectionClick}>추가</button>
            </div>
          </div>

          {activeSection && (
            <div className="field">
              <span>「{activeSection}」의 카테고리 (번호 1~20)</span>
              <div className="category-edit-list">
                {categories.length === 0 && <p className="hint-text-small">아직 카테고리가 없어요.</p>}
                {categories.map(c => (
                  <div key={c.id} className="category-edit-row">
                    <input
                      type="number" min={1} max={20}
                      value={c.number}
                      onChange={e => {
                        const raw = e.target.value;
                        onUpdateCategory(c.id, { number: raw === '' ? '' : clamp(raw, 1, 20) });
                      }}
                    />
                    <input
                      value={c.name}
                      onChange={e => onUpdateCategory(c.id, { name: e.target.value })}
                    />
                    <button type="button" className="icon-btn" onClick={() => onRemoveCategory(c.id)}><Trash2 size={14} /></button>
                  </div>
                ))}
              </div>
              <div className="field-row">
                <input className="field--small" type="number" min={1} max={20} value={newCatNumber} onChange={e => setNewCatNumber(e.target.value)} placeholder="번호" />
                <input value={newCatName} onChange={e => setNewCatName(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleAddCategoryClick()} placeholder="새 카테고리 이름 (예: 80년대 영화, 뮤지컬)" />
                <button type="button" className="btn btn--ghost btn--sm" onClick={handleAddCategoryClick}>추가</button>
              </div>
            </div>
          )}
        </div>
        <div className="drawer__foot">
          {resetConfirm ? (
            <div className="confirm-delete">
              <span>섹션·카테고리·테마를 모두 초기 상태로 되돌릴까요?</span>
              <button type="button" className="btn btn--danger" onClick={() => { onResetSettings(); setResetConfirm(false); }}>초기화</button>
              <button type="button" className="btn btn--ghost" onClick={() => setResetConfirm(false)}>취소</button>
            </div>
          ) : (
            <button type="button" className="btn btn--ghost btn--danger-text" onClick={() => setResetConfirm(true)}>설정 초기화</button>
          )}
          <div className="drawer__foot-actions">
            <button type="button" className="btn btn--primary" onClick={onCancel}>완료</button>
          </div>
        </div>
      </div>
    </div>
  );
}

// 진열장 뷰에서 시리즈가 접혀 있을 때 보여주는 '묶음' 타일. 대표(첫 번째 순번) 포스터에
// 편수 배지만 깔끔하게 붙여서 여러 편이 묶여있음을 알려준다. 누르면 그 시리즈가 펼쳐진다.
function SeriesBundleTile({ entry, onToggle }) {
  const rep = entry.movies[0];
  return (
    <button type="button" className="poster-tile poster-bundle-tile" onClick={() => onToggle(entry.seriesId)} title={`${entry.seriesName} (${entry.movies.length}편) 펼치기`}>
      <div className="poster-tile__frame" style={{ borderTopColor: 'var(--gold)' }}>
        <Poster url={rep?.posterUrl} size="gallery" />
        <span className="poster-bundle-tile__count">{entry.movies.length}편</span>
        <div className="poster-tile__overlay">
          <span className="poster-tile__title">{entry.seriesName}</span>
        </div>
      </div>
    </button>
  );
}

// 펼쳐진 시리즈 위에 붙는 얇은 구분줄. 누르면 다시 접힌다. 그리드/진열장 폭 전체를 차지한다.
function SeriesHeaderBar({ entry, onToggle }) {
  return (
    <button type="button" className="series-header-bar" onClick={() => onToggle(entry.seriesId)}>
      <Link2 size={13} />
      <span>{entry.seriesName} · {entry.count}편</span>
      <span className="series-header-bar__collapse">접기 ▴</span>
    </button>
  );
}

// 포스터만 촘촘히 진열한 '진열장' 뷰. 시리즈는 항상 이어서 배치되고,
// 접혀있으면 묶음 타일 하나로, 펼쳐져 있으면 구분줄 + 개별 포스터로 보인다.
function PosterMovieTile({ movie, onEdit }) {
  const sColor = movie.seriesId ? seriesColor(movie.seriesId) : null;
  return (
    <button
      type="button"
      className="poster-tile"
      onClick={() => onEdit(movie)}
      title={movie.titleKr}
    >
      <div
        className="poster-tile__frame"
        style={sColor ? { borderTopColor: sColor, borderTopStyle: movie.seriesUnofficial ? 'dashed' : 'solid' } : undefined}
      >
        <Poster url={movie.posterUrl} size="gallery" />
        {movie.status === 'wishlist' && <span className="poster-tile__wishlist-dot" title="미보유" />}
        <div className="poster-tile__overlay">
          <span className="poster-tile__title">{movie.titleKr}</span>
          <StarRating value={movie.rating} readOnly size={10} />
        </div>
      </div>
    </button>
  );
}

function SeriesExpandedGalleryBlock({ entry, onEdit, onToggle }) {
  return (
    <div className="series-expanded-gallery-block">
      <SeriesHeaderBar entry={entry} onToggle={onToggle} />
      <div className="series-expanded-gallery-row">
        {entry.movies.map(m => <PosterMovieTile key={m.id} movie={m} onEdit={onEdit} />)}
      </div>
    </div>
  );
}

function PosterGallery({ entries, onEdit, onToggleSeries }) {
  return (
    <div className="poster-gallery">
      {entries.map(entry => {
        if (entry.type === 'series-bundle') {
          return <SeriesBundleTile key={entry.seriesId} entry={entry} onToggle={onToggleSeries} />;
        }
        if (entry.type === 'series-expanded') {
          return <SeriesExpandedGalleryBlock key={`expanded-${entry.seriesId}`} entry={entry} onEdit={onEdit} onToggle={onToggleSeries} />;
        }
        return <PosterMovieTile key={entry.movie.id} movie={entry.movie} onEdit={onEdit} />;
      })}
    </div>
  );
}

// 카드형 뷰에서 접힌 시리즈를 하나의 묶음 카드로 보여준다. 누르면 시리즈가 펼쳐진다.
function SeriesBundleCard({ entry, onToggle }) {
  const rep = entry.movies[0];
  const years = entry.movies.map(m => m.year).filter(Boolean);
  return (
    <button type="button" className="card series-bundle-card" onClick={() => onToggle(entry.seriesId)}>
      <div className="series-bundle-card__poster-wrap">
        <Poster url={rep?.posterUrl} size="card" />
        <span className="series-bundle-card__count">{entry.movies.length}편</span>
      </div>
      <div className="card__body series-bundle-card__info">
        <span className="card__title-kr">{entry.seriesName}</span>
        {years.length > 0 && <span className="series-bundle-card__years">{years.join(' · ')}</span>}
      </div>
      <span className="series-bundle-card__chevron">▾</span>
    </button>
  );
}

function SeriesExpandedCardBlock({ entry, onToggle, onEdit, onFilter, onMoveToOwned, onAddSequel }) {
  return (
    <div className="series-expanded-card-block">
      <SeriesHeaderBar entry={entry} onToggle={onToggle} />
      <div className="series-expanded-card-grid">
        {entry.movies.map(m => (
          <MovieCard
            key={m.id}
            movie={m}
            onEdit={onEdit}
            onFilter={onFilter}
            onMoveToOwned={onMoveToOwned}
            onAddSequel={onAddSequel}
          />
        ))}
      </div>
    </div>
  );
}

function MovieCard({ movie, onEdit, onFilter, onMoveToOwned, onAddSequel }) {
  const [expanded, setExpanded] = useState(false);
  const sColor = movie.seriesId ? seriesColor(movie.seriesId) : null;
  const hasMoreInfo = !!(movie.synopsis || movie.notes);
  return (
    <div
      className="card"
      style={sColor ? { borderTop: `3px ${movie.seriesUnofficial ? 'dashed' : 'solid'} ${sColor}` } : undefined}
    >
      <Poster url={movie.posterUrl} size="card" />
      <div className="card__body">
        <div className="card__top">
          <div className="card__title">
            <span className="card__title-kr">{movie.titleKr}</span>
            {movie.titleOriginal && <span className="card__title-orig">{movie.titleOriginal}</span>}
          </div>
          <button type="button" className="icon-btn icon-btn--ghost" onClick={() => onEdit(movie)}>
            <Pencil size={15} />
          </button>
        </div>

        <StarRating value={movie.rating} readOnly size={14} />

        {movie.seriesId && (
          <div className="series-row">
            <button type="button" className="series-badge" style={{ '--series-color': sColor }} onClick={() => onFilter('series', movie.seriesId, movie.seriesName)}>
              <Link2 size={11} />
              {movie.seriesName}{movie.seriesOrder !== '' && movie.seriesOrder != null ? ` #${movie.seriesOrder}` : ''}
              {movie.seriesUnofficial && <span className="series-badge__unofficial">비공식</span>}
            </button>
            <button type="button" className="add-sequel-btn" onClick={() => onAddSequel(movie)} title="이 시리즈에 새 작품 추가">
              <PlusCircle size={12} /> 시리즈에 추가
            </button>
          </div>
        )}

        <div className="meta-line">
          {(movie.countries || (movie.country ? [movie.country] : [])).flatMap((c, i) => ([
            i > 0 ? <span className="dot" key={`dot-c-${c}`}>·</span> : null,
            <button type="button" className="meta-link" key={c} onClick={() => onFilter('country', c)}>{c}</button>,
          ]))}
          {movie.year && <><span className="dot">·</span><span>{movie.year}</span></>}
          {movie.runtime && <><span className="dot">·</span><span>{movie.runtime}분</span></>}
          {movie.ageRating && <><span className="dot">·</span><span>{movie.ageRating}</span></>}
          {movie.director && <><span className="dot">·</span><button type="button" className="meta-link" onClick={() => onFilter('person', movie.director)}>{movie.director}</button></>}
          {(movie.genres || (movie.genre ? [movie.genre] : [])).flatMap(g => ([
            <span className="dot" key={`dot-${g}`}>·</span>,
            <button type="button" className="meta-link" key={g} onClick={() => onFilter('genre', g)}>{g}</button>,
          ]))}
        </div>

        {movie.actors?.length > 0 && (
          <div className="people-row">
            {movie.actors.map(a => (
              <button type="button" key={a} className="person-link" onClick={() => onFilter('person', a)}>{a}</button>
            ))}
          </div>
        )}

        {movie.hashtags?.length > 0 && (
          <div className="tag-row">
            {movie.hashtags.map(t => (
              <button type="button" key={t} className="tag-link" onClick={() => onFilter('tag', t)}>#{t}</button>
            ))}
          </div>
        )}

        {hasMoreInfo && (
          <div className="more-info">
            <button
              type="button"
              className={`more-info__toggle${expanded ? ' is-open' : ''}`}
              onClick={() => setExpanded(v => !v)}
              aria-label={expanded ? '줄거리·메모 접기' : '줄거리·메모 보기'}
              title={expanded ? '접기' : '줄거리·메모 보기'}
            >
              ⌄
            </button>
            {expanded && (
              <div className="more-info__body">
                {movie.synopsis && (
                  <div className="more-info__block">
                    <b>줄거리</b>
                    <p>{movie.synopsis}</p>
                  </div>
                )}
                {movie.notes && (
                  <div className="more-info__block">
                    <b>메모</b>
                    <p>{movie.notes}</p>
                  </div>
                )}
              </div>
            )}
          </div>
        )}

        <div className="card__bottom">
          {movie.status === 'wishlist' && (
            <span className="status-dot status-dot--wishlist">미보유</span>
          )}
          {movie.formats?.map(f => <span key={f} className="format-tag">{f}</span>)}
          {movie.physicalLocation?.categoryName && (
            <span className="location-tag">
              <MapPin size={12} />
              {movie.physicalLocation.section} · ({movie.physicalLocation.categoryNumber}) {movie.physicalLocation.categoryName}{movie.physicalLocation.itemNumber ? ` · ${movie.physicalLocation.itemNumber}번` : ''}
            </span>
          )}
          {movie.physicalLocation?.individual && (
            <span className="location-tag">
              <MapPin size={12} />
              개별 보관
            </span>
          )}
          {movie.status === 'wishlist' && (
            <button type="button" className="move-owned-btn" onClick={() => onMoveToOwned(movie)}>
              <PackageCheck size={12} /> 보유로 이동
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

function MovieCollectionApp() {
  const [loaded, setLoaded] = useState(false);
  const [movies, setMovies] = useState([]);
  const [customFormats, setCustomFormats] = useState([]);
  const [settings, setSettings] = useState(DEFAULT_SETTINGS);

  const [search, setSearch] = useState('');
  const [statusFilter, setStatusFilter] = useState('all');
  const [formatFilter, setFormatFilter] = useState([]);
  const [activeFilter, setActiveFilter] = useState(null);
  const [sortBy, setSortBy] = useState('recent');
  const [viewMode, setViewMode] = useState('card');
  const [expandedSeries, setExpandedSeries] = useState(() => new Set());
  const [page, setPage] = useState(1);
  const [pageSize, setPageSize] = useState(48);

  const [formOpen, setFormOpen] = useState(false);
  const [editingMovie, setEditingMovie] = useState(null);
  const [formSeed, setFormSeed] = useState(null);
  const [bulkOpen, setBulkOpen] = useState(false);
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [settingsInitialSection, setSettingsInitialSection] = useState('');
  const [savingCount, setSavingCount] = useState(0);
  const [backups, setBackups] = useState([]);
  const [backupBusy, setBackupBusy] = useState(false);
  const saving = savingCount > 0;

  function beginSaving() { setSavingCount(v => v + 1); }
  function endSaving() { setSavingCount(v => Math.max(0, v - 1)); }

  async function refreshBackups() {
    setBackupBusy(true);
    try { setBackups(await listAutomaticBackups()); }
    catch (e) { console.error(e); window.alert('⚠️ 백업 목록을 불러오지 못했어요.'); }
    finally { setBackupBusy(false); }
  }

  async function makeBackupAfterSave(nextMovies, reason, snapshot = {}) {
    try {
      const nextBackups = await createAutomaticBackup({ movies: nextMovies, customFormats: snapshot.customFormats ?? customFormats, settings: snapshot.settings ?? settings, reason });
      setBackups(prev => [{ ...nextBackups }, ...prev.filter(b => b.id !== nextBackups.id)].slice(0, BACKUP_LIMIT));
    } catch (e) {
      console.error('자동 백업 실패', e);
      // 원본 저장은 이미 성공했으므로 백업 실패 때문에 사용자의 저장을 되돌리지 않는다.
      window.alert('⚠️ 영화 저장은 완료됐지만 자동 백업을 만들지 못했어요. 다음 저장 때 다시 시도합니다.');
    }
  }

  async function handleRestoreBackup(backup) {
    const ok = window.confirm(`${new Date(backup.createdAt).toLocaleString('ko-KR')} 시점의 ${backup.count}편 데이터를 복구할까요?\n\n현재 영화 목록은 백업 시점의 목록으로 교체됩니다.`);
    if (!ok) return;
    beginSaving();
    try {
      const restored = await restoreAutomaticBackup(backup);
      setMovies(restored.sort((a, b) => String(b.addedAt || '').localeCompare(String(a.addedAt || ''))));
      setCustomFormats(backup.customFormats || []);
      setSettings(backup.settings || DEFAULT_SETTINGS);
      await refreshBackups();
      window.alert('백업 복구가 완료됐어요.');
    } catch (e) {
      console.error(e);
      window.alert('⚠️ 백업을 복구하지 못했어요. 현재 데이터는 그대로일 수 있습니다.');
    } finally { endSaving(); }
  }

  useEffect(() => {
    (async () => {
      try {
        const listRes = await window.storage.list('movie:', false);
        const keys = listRes?.keys || [];
        const values = [];
        await runInBatches(keys, async k => {
          try {
            const r = await window.storage.get(k, false);
            if (r?.value) values.push(JSON.parse(r.value));
          } catch (e) {
            console.warn('영화 불러오기 재시도 중:', k, e);
          }
        }, 1);
        const loadedMovies = values.filter(Boolean);
        // VOD- 접두어가 붙은 옛 매체명 정리 + 단일 genre/country 문자열을 배열로 이전 (변경된 영화만 다시 저장)
        const migrated = await Promise.all(loadedMovies.map(async m => {
          const needsFormatFix = m.formats?.some(f => f.startsWith('VOD-'));
          const needsGenreFix = !m.genres && m.genre;
          const needsCountryFix = !m.countries && m.country;
          if (!needsFormatFix && !needsGenreFix && !needsCountryFix) return m;
          const fixed = {
            ...m,
            formats: needsFormatFix ? m.formats.map(stripVodPrefix) : m.formats,
            genres: needsGenreFix ? [m.genre] : (m.genres || []),
            countries: needsCountryFix ? [m.country] : (m.countries || []),
          };
          try { await window.storage.set(`movie:${fixed.id}`, JSON.stringify(fixed), false); } catch (e) { /* noop */ }
          return fixed;
        }));
        setMovies(migrated);
      } catch (e) { setMovies([]); }

      try {
        const res2 = await window.storage.get('custom-formats', false);
        const raw = res2?.value ? JSON.parse(res2.value) : [];
        const fixed = raw.map(stripVodPrefix);
        setCustomFormats(fixed);
        if (JSON.stringify(fixed) !== JSON.stringify(raw)) {
          try { await window.storage.set('custom-formats', JSON.stringify(fixed), false); } catch (e) { /* noop */ }
        }
      } catch (e) { setCustomFormats([]); }

      try {
        const res3 = await window.storage.get('settings', false);
        setSettings(res3?.value ? migrateSettings(JSON.parse(res3.value)) : DEFAULT_SETTINGS);
      } catch (e) { setSettings(DEFAULT_SETTINGS); }

      setLoaded(true);
      try { setBackups(await listAutomaticBackups()); } catch (e) { console.error('백업 목록 불러오기 실패', e); }
    })();
  }, []);

  async function persistCustomFormats(next) {
    beginSaving();
    try {
      await window.storage.set('custom-formats', JSON.stringify(next), false);
      setCustomFormats(next);
      await makeBackupAfterSave(movies, '매체 목록 변경', { customFormats: next, settings });
    } catch (e) {
      console.error(e);
      window.alert('⚠️ 매체 목록을 저장하지 못했어요. 기존 데이터는 변경하지 않았습니다.');
    } finally {
      endSaving();
    }
  }

  async function persistSettings(next) {
    beginSaving();
    try {
      await window.storage.set('settings', JSON.stringify(next), false);
      setSettings(next);
      await makeBackupAfterSave(movies, '설정 변경', { customFormats, settings: next });
    } catch (e) {
      console.error(e);
      window.alert('⚠️ 설정을 저장하지 못했어요. 기존 설정은 변경하지 않았습니다.');
    } finally {
      endSaving();
    }
  }

  function handleAddCustomFormat(value) {
    if (!customFormats.includes(value)) persistCustomFormats([...customFormats, value]);
  }

  function handleChangeTheme(themeId) { persistSettings({ ...settings, themeId }); }

  function handleAddSection(name) {
    if (settings.sections.some(s => s.name === name)) return;
    const used = new Set(settings.sections.map(s => s.number));
    let suggested = 1;
    while (used.has(suggested) && suggested <= 50) suggested++;
    persistSettings({ ...settings, sections: [...settings.sections, { id: uid(), number: suggested, name }] });
  }

  function handleUpdateSection(id, patch) {
    const target = settings.sections.find(s => s.id === id);
    if (!target) return;
    const nextSections = settings.sections.map(s => s.id === id ? { ...s, ...patch } : s);
    const nextCategories = (patch.name && patch.name !== target.name)
      ? settings.categories.map(c => c.section === target.name ? { ...c, section: patch.name } : c)
      : settings.categories;
    persistSettings({ ...settings, sections: nextSections, categories: nextCategories });
  }

  function handleRemoveSection(id) {
    const target = settings.sections.find(s => s.id === id);
    if (!target) return;
    persistSettings({
      ...settings,
      sections: settings.sections.filter(s => s.id !== id),
      categories: settings.categories.filter(c => c.section !== target.name),
    });
  }

  function handleAddCategory(section, number, name) {
    if (settings.categories.some(c => c.section === section && c.name === name)) return;
    persistSettings({ ...settings, categories: [...settings.categories, { id: uid(), section, number, name }] });
  }

  function handleUpdateCategory(id, patch) {
    persistSettings({ ...settings, categories: settings.categories.map(c => c.id === id ? { ...c, ...patch } : c) });
  }

  function handleRemoveCategory(id) {
    persistSettings({ ...settings, categories: settings.categories.filter(c => c.id !== id) });
  }

  function handleResetSettings() {
    persistSettings(DEFAULT_SETTINGS);
  }

  function openSettingsForSection(section) {
    setSettingsInitialSection(section);
    setSettingsOpen(true);
  }

  async function handleSaveMovie(movieData) {
    beginSaving();
    try {
      await window.storage.set(`movie:${movieData.id}`, JSON.stringify(movieData), false);
      const nextMovies = movies.some(m => m.id === movieData.id)
        ? movies.map(m => m.id === movieData.id ? movieData : m)
        : [movieData, ...movies];
      setMovies(nextMovies);
      await makeBackupAfterSave(nextMovies, movies.some(m => m.id === movieData.id) ? '영화 수정' : '영화 추가');
      setFormOpen(false);
      setEditingMovie(null);
    } catch (e) {
      console.error(e);
      window.alert('⚠️ 영화를 저장하지 못했어요. 입력창은 그대로 두었습니다. 잠시 후 다시 저장해 주세요.');
    } finally {
      endSaving();
    }
  }

  async function handleDeleteMovie(id) {
    beginSaving();
    try {
      await window.storage.delete(`movie:${id}`, false);
      const nextMovies = movies.filter(m => m.id !== id);
      setMovies(nextMovies);
      await makeBackupAfterSave(nextMovies, '영화 삭제');
      setFormOpen(false);
      setEditingMovie(null);
    } catch (e) {
      console.error(e);
      window.alert('⚠️ 삭제를 완료하지 못했어요. 화면의 영화 정보는 그대로 유지했습니다.');
    } finally {
      endSaving();
    }
  }

  async function handleMoveToOwned(movie) {
    const updated = { ...movie, status: 'owned' };
    beginSaving();
    try {
      await window.storage.set(`movie:${updated.id}`, JSON.stringify(updated), false);
      const nextMovies = movies.map(m => m.id === updated.id ? updated : m);
      setMovies(nextMovies);
      await makeBackupAfterSave(nextMovies, '보유 상태 변경');
    } catch (e) {
      console.error(e);
      window.alert('⚠️ 보유 상태 변경을 저장하지 못했어요.');
    } finally {
      endSaving();
    }
  }

  function handleAddSequel(baseMovie) {
    const sameSeries = movies.filter(m => m.seriesId === baseMovie.seriesId);
    const maxOrder = Math.max(0, ...sameSeries.map(m => Number(m.seriesOrder) || 0));
    setEditingMovie(null);
    setFormSeed({ seriesId: baseMovie.seriesId, seriesName: baseMovie.seriesName, seriesOrder: maxOrder + 1, seriesUnofficial: false });
    setFormOpen(true);
  }

  async function handleBulkConfirm(newOnes) {
    beginSaving();
    const saved = [];
    try {
      for (const m of newOnes) {
        try {
          await window.storage.set(`movie:${m.id}`, JSON.stringify(m), false);
          saved.push(m);
        } catch (e) {
          console.error(e);
          break;
        }
      }
      if (saved.length) {
        const nextMovies = [...saved, ...movies];
        setMovies(nextMovies);
        await makeBackupAfterSave(nextMovies, '목록 일괄 등록');
      }
      if (saved.length === newOnes.length) {
        setBulkOpen(false);
      } else {
        window.alert(`⚠️ ${newOnes.length}편 중 ${saved.length}편만 저장됐어요. 저장되지 않은 항목은 다시 시도해 주세요.`);
      }
    } finally {
      endSaving();
    }
  }

  function openFilter(type, value, label) {
    setActiveFilter({ type, value, label: label ?? value });
    setSearch('');
  }

  const allFormatOptions = useMemo(() => {
    const extra = customFormats.filter(f => !DEFAULT_FORMATS.includes(f));
    return [...DEFAULT_FORMATS, ...extra];
  }, [customFormats]);

  const formatCounts = useMemo(() => {
    const counts = {};
    for (const f of allFormatOptions) counts[f] = 0;
    for (const m of movies) for (const f of m.formats || []) counts[f] = (counts[f] || 0) + 1;
    return counts;
  }, [movies, allFormatOptions]);

  const filteredMovies = useMemo(() => {
    let list = movies.filter(m => {
      if (statusFilter !== 'all' && m.status !== statusFilter) return false;
      if (formatFilter.length > 0 && !(m.formats || []).some(f => formatFilter.includes(f))) return false;
      if (activeFilter) {
        const { type, value } = activeFilter;
        if (type === 'person') { if (!(m.director === value || (m.actors || []).includes(value))) return false; }
        else if (type === 'genre' && !(m.genres || (m.genre ? [m.genre] : [])).includes(value)) return false;
        else if (type === 'country' && !(m.countries || (m.country ? [m.country] : [])).includes(value)) return false;
        else if (type === 'tag' && !(m.hashtags || []).includes(value)) return false;
        else if (type === 'series' && m.seriesId !== value) return false;
      }
      if (search.trim()) {
        const q = search.trim().toLowerCase();
        const haystack = [m.titleKr, m.titleOriginal, m.director, ...(m.countries || (m.country ? [m.country] : [])), ...(m.genres || (m.genre ? [m.genre] : [])), ...(m.actors || []), ...(m.hashtags || [])].join(' ').toLowerCase();
        if (!haystack.includes(q)) return false;
      }
      return true;
    });
    list = [...list].sort((a, b) => {
      if (activeFilter?.type === 'series') return (Number(a.seriesOrder) || 0) - (Number(b.seriesOrder) || 0);
      if (sortBy === 'year-asc') return (a.year || '').localeCompare(b.year || '');
      if (sortBy === 'year-desc') return (b.year || '').localeCompare(a.year || '');
      if (sortBy === 'title') return a.titleKr.localeCompare(b.titleKr, 'ko');
      return (b.createdAt || 0) - (a.createdAt || 0);
    });
    return list;
  }, [movies, statusFilter, formatFilter, activeFilter, search, sortBy]);

  const displayEntries = useMemo(() => buildDisplayEntries(filteredMovies, expandedSeries), [filteredMovies, expandedSeries]);
  const totalPages = Math.max(1, Math.ceil(displayEntries.length / pageSize));
  const pageEntries = useMemo(() => {
    const start = (page - 1) * pageSize;
    return displayEntries.slice(start, start + pageSize);
  }, [displayEntries, page, pageSize]);

  useEffect(() => {
    setPage(1);
  }, [statusFilter, formatFilter, activeFilter, search, sortBy, viewMode, pageSize]);

  useEffect(() => {
    if (page > totalPages) setPage(totalPages);
  }, [page, totalPages]);

  function handleToggleSeries(seriesId) {
    setExpandedSeries(prev => {
      const next = new Set(prev);
      if (next.has(seriesId)) next.delete(seriesId);
      else next.add(seriesId);
      return next;
    });
  }

  const ownedCount = movies.filter(m => m.status === 'owned').length;
  const wishlistCount = movies.filter(m => m.status === 'wishlist').length;
  const themeVars = THEMES[settings.themeId]?.vars || THEMES.filmCatalog.vars;

  if (!loaded) {
    return (
      <div style={{
        minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center',
        fontFamily: '-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif',
        color: '#8C8064', background: '#FAF8F4', fontSize: '14px',
      }}>
        불러오는 중이에요...
      </div>
    );
  }

  return (
    <div className="mc-app" style={themeVars}>
      <style>{APP_CSS}</style>

      <aside className="sidebar">
        <div className="sidebar-top">
          <div>
            <h1 className="brand-title">영화 컬렉션</h1>
            <div className="brand-stats">보유 {ownedCount}편 · 미보유 {wishlistCount}편</div>
          </div>
          <button type="button" className="icon-only-btn" onClick={() => setSettingsOpen(true)} title="설정">
            <SettingsIcon size={16} />
          </button>
        </div>
        <hr />
        <div className="sidebar-section">
          <h3>보유 상태</h3>
          <div className="segmented">
            <button type="button" className={statusFilter === 'all' ? 'is-active' : ''} onClick={() => setStatusFilter('all')}>전체</button>
            <button type="button" className={statusFilter === 'owned' ? 'is-active' : ''} onClick={() => setStatusFilter('owned')}>보유</button>
            <button type="button" className={statusFilter === 'wishlist' ? 'is-active' : ''} onClick={() => setStatusFilter('wishlist')}>미보유</button>
          </div>
        </div>
        <hr />
        <div className="sidebar-section">
          <h3>매체 / 플랫폼</h3>
          <div className="format-filter-list">
            {allFormatOptions.map(f => (
              <div key={f} className={`format-filter-item${formatFilter.includes(f) ? ' is-active' : ''}`}>
                <label>
                  <input type="checkbox" checked={formatFilter.includes(f)} onChange={() => setFormatFilter(prev => prev.includes(f) ? prev.filter(x => x !== f) : [...prev, f])} />
                  {f}
                </label>
                <span className="count">{formatCounts[f] || 0}</span>
              </div>
            ))}
          </div>
        </div>
      </aside>

      <main className="main">
        <div className="topbar">
          <div className="search-box">
            <Search size={16} />
            <input placeholder="제목, 감독, 배우, 태그로 검색" value={search} onChange={e => { setSearch(e.target.value); setActiveFilter(null); }} />
          </div>
          <SaveStatus saving={saving} />
          <div className="segmented segmented--view">
            <button type="button" className={viewMode === 'card' ? 'is-active' : ''} onClick={() => setViewMode('card')}>카드형</button>
            <button type="button" className={viewMode === 'gallery' ? 'is-active' : ''} onClick={() => setViewMode('gallery')}>진열장</button>
          </div>
          <select className="sort-select" value={sortBy} onChange={e => setSortBy(e.target.value)}>
            <option value="recent">최근 추가순</option>
            <option value="year-desc">연도 최신순</option>
            <option value="year-asc">연도 오래된순</option>
            <option value="title">제목 가나다순</option>
          </select>
          <button type="button" className="btn btn--ghost" onClick={() => setBulkOpen(true)}><Upload size={15} /> 목록 붙여넣기</button>
          <button type="button" className="btn btn--primary" onClick={() => { setEditingMovie(null); setFormSeed(null); setFormOpen(true); }}><Plus size={16} /> 새 영화</button>
        </div>

        {activeFilter && (
          <div className="filter-banner">
            <Film size={15} />
            <span>
              {activeFilter.type === 'person' && <>필모그래피: <b>{activeFilter.value}</b></>}
              {activeFilter.type === 'genre' && <>장르: <b>{activeFilter.value}</b></>}
              {activeFilter.type === 'country' && <>제작국가: <b>{activeFilter.value}</b></>}
              {activeFilter.type === 'tag' && <>태그: <b>#{activeFilter.value}</b></>}
              {activeFilter.type === 'series' && <>시리즈: <b>{activeFilter.label}</b></>}
              {' '}({filteredMovies.length}편)
            </span>
            <button type="button" onClick={() => setActiveFilter(null)}>필터 해제</button>
          </div>
        )}

        {!loaded ? (
          <div className="empty-state">불러오는 중이에요...</div>
        ) : filteredMovies.length === 0 ? (
          <div className="empty-state">
            <h3>{movies.length === 0 ? '아직 등록된 영화가 없어요' : '조건에 맞는 영화가 없어요'}</h3>
            <p>{movies.length === 0 ? '새 영화를 추가하거나 기존 목록을 붙여넣어 시작해보세요.' : '필터나 검색어를 바꿔보세요.'}</p>
          </div>
        ) : viewMode === 'gallery' ? (
          <PosterGallery
            entries={pageEntries}
            onEdit={mv => { setEditingMovie(mv); setFormSeed(null); setFormOpen(true); }}
            onToggleSeries={handleToggleSeries}
          />
        ) : (
          <div className="grid">
            {pageEntries.map(entry => {
              if (entry.type === 'series-bundle') {
                return <SeriesBundleCard key={entry.seriesId} entry={entry} onToggle={handleToggleSeries} />;
              }
              if (entry.type === 'series-expanded') {
                return (
                  <SeriesExpandedCardBlock
                    key={`expanded-${entry.seriesId}`}
                    entry={entry}
                    onToggle={handleToggleSeries}
                    onEdit={mv => { setEditingMovie(mv); setFormSeed(null); setFormOpen(true); }}
                    onFilter={openFilter}
                    onMoveToOwned={handleMoveToOwned}
                    onAddSequel={handleAddSequel}
                  />
                );
              }
              const m = entry.movie;
              return <MovieCard key={m.id} movie={m} onEdit={mv => { setEditingMovie(mv); setFormSeed(null); setFormOpen(true); }} onFilter={openFilter} onMoveToOwned={handleMoveToOwned} onAddSequel={handleAddSequel} />;
            })}
          </div>
        )}

        {loaded && filteredMovies.length > 0 && totalPages > 1 && (
          <div className="pagination">
            <button type="button" className="btn btn--ghost btn--sm" onClick={() => setPage(p => Math.max(1, p - 1))} disabled={page === 1}>이전</button>
            <span className="pagination__info">{page} / {totalPages} 페이지</span>
            <button type="button" className="btn btn--ghost btn--sm" onClick={() => setPage(p => Math.min(totalPages, p + 1))} disabled={page === totalPages}>다음</button>
            <select className="sort-select pagination__size" value={pageSize} onChange={e => setPageSize(Number(e.target.value))}>
              <option value={24}>24개씩</option>
              <option value={48}>48개씩</option>
              <option value={96}>96개씩</option>
              <option value={200}>200개씩</option>
            </select>
          </div>
        )}
      </main>

      {formOpen && (
        <MovieForm
          initial={editingMovie}
          seed={formSeed}
          formatOptions={allFormatOptions}
          settings={settings}
          movies={movies}
          onSave={handleSaveMovie}
          onCancel={() => { setFormOpen(false); setEditingMovie(null); setFormSeed(null); }}
          onDelete={handleDeleteMovie}
          onAddCustomFormat={handleAddCustomFormat}
          onAddSection={handleAddSection}
          onAddCategory={handleAddCategory}
          onManageSection={openSettingsForSection}
          saving={saving}
        />
      )}

      {bulkOpen && <BulkImportModal onCancel={() => setBulkOpen(false)} onConfirm={handleBulkConfirm} saving={saving} />}

      {settingsOpen && (
        <SettingsModal
          settings={settings}
          initialSection={settingsInitialSection}
          onCancel={() => setSettingsOpen(false)}
          onChangeTheme={handleChangeTheme}
          onAddSection={handleAddSection}
          onUpdateSection={handleUpdateSection}
          onRemoveSection={handleRemoveSection}
          onAddCategory={handleAddCategory}
          onUpdateCategory={handleUpdateCategory}
          onRemoveCategory={handleRemoveCategory}
          onResetSettings={handleResetSettings}
          backups={backups}
          onRefreshBackups={refreshBackups}
          onRestoreBackup={handleRestoreBackup}
          backupBusy={backupBusy}
        />
      )}
    </div>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(<MovieCollectionApp />);
</script>
</body>
</html>
