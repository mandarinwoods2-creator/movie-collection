// ---------------------------------------------------------------
// 로컬 캐시 (체감 로딩 속도 개선용)
// 클라우드가 항상 원본이고, 이건 그 사본을 브라우저에 잠깐 저장해두는
// 것뿐이다. 다음에 페이지를 열 때 이 캐시로 화면을 먼저 채워서 즉시
// 뭔가 보이게 하고, 그 사이 클라우드에서 최신 내용을 다시 받아와
// 조용히 갱신한다. 캐시가 없거나 읽기를 실패해도 기존처럼 클라우드에서
// 정상적으로 불러온다.
// ---------------------------------------------------------------
const LOCAL_CACHE_KEY = 'mc-cache-v1';

function loadLocalCache() {
  try {
    const raw = localStorage.getItem(LOCAL_CACHE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!parsed || !Array.isArray(parsed.movies)) return null;
    return parsed;
  } catch (e) {
    return null;
  }
}

function saveLocalCache(data) {
  try {
    localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify(data));
  } catch (e) {
    // 저장 공간 부족 등은 조용히 무시한다 (캐시는 있으면 좋고 없어도 그만).
  }
}

const SHELF_INDIVIDUAL = '__individual__';

// 물리 매체(DVD/블루레이 등)를 실제 보관함처럼 섹션 → 카테고리 → 진열번호(최대 24)
// 순으로 탐색하는 뷰. 빈 칸은 비어있는 상태 그대로 보여준다.
// 섹션에 묶이지 않은 '개별 보관' 항목은 별도 탭으로 모아서 보여준다.
function ShelfView({ movies, settings, viewMode, shelfRegion, setShelfRegion, shelfSection, setShelfSection, shelfCategoryId, setShelfCategoryId, onEdit, onOpenDetail, onAddToDisc, orphanCount, onOpenRepair, onFilter, onMoveToOwned, onAddSequel, onAddAtSlot }) {
  const [groupItems, setGroupItems] = useState(null);
  const physicalEntries = useMemo(
    () => movies.flatMap(m => getLocations(m).map(l => ({ m, l }))),
    [movies]
  );
  const regionCounts = useMemo(() => {
    const nameToRegion = new Map(settings.sections.map(sec => [sec.name, sectionRegion(sec)]));
    const slotSets = {};
    REGIONS.forEach(r => { slotSets[r] = new Set(); });
    const individualIds = new Set();
    physicalEntries.forEach(({ m, l }) => {
      if (l.individual) { individualIds.add(m.id); return; }
      const r = nameToRegion.get(l.section);
      const n = Number(l.itemNumber);
      if (!r || !(n >= 1 && n <= 24)) return;
      slotSets[r].add(`${l.section}|${l.categoryName}|${String(l.categoryNumber ?? '')}|${n}`);
    });
    const counts = {};
    REGIONS.forEach(r => { counts[r] = slotSets[r].size; });
    counts[SHELF_INDIVIDUAL] = individualIds.size;
    return counts;
  }, [physicalEntries, settings.sections]);
  const sectionCounts = useMemo(() => {
    const sets = new Map();
    physicalEntries.forEach(({ l }) => {
      if (l.individual) return;
      const n = Number(l.itemNumber);
      if (!(n >= 1 && n <= 24)) return;
      if (!sets.has(l.section)) sets.set(l.section, new Set());
      sets.get(l.section).add(`${l.categoryName}|${String(l.categoryNumber ?? '')}|${n}`);
    });
    const counts = new Map();
    sets.forEach((set, key) => counts.set(key, set.size));
    return counts;
  }, [physicalEntries]);
  const categoryFill = useMemo(() => {
    const map = new Map();
    physicalEntries.forEach(({ l }) => {
      if (l.individual) return;
      const n = Number(l.itemNumber);
      if (!(n >= 1 && n <= 24)) return;
      const key = `${l.section}|${l.categoryName}|${String(l.categoryNumber ?? '')}`;
      if (!map.has(key)) map.set(key, new Set());
      map.get(key).add(n);
    });
    return map;
  }, [physicalEntries]);
  const fillOf = c => (categoryFill.get(`${shelfSection}|${c.name}|${String(c.number ?? '')}`) || new Set()).size;
  const isIndividual = shelfRegion === SHELF_INDIVIDUAL;
  const sections = useMemo(() => (isIndividual ? [] : sectionsOfRegion(settings, shelfRegion)), [settings, shelfRegion, isIndividual]);
  const categoriesForSection = useMemo(() => {
    if (isIndividual || !shelfSection) return [];
    return settings.categories.filter(c => c.section === shelfSection).sort((a, b) => a.number - b.number);
  }, [settings.categories, shelfSection, isIndividual]);

  useEffect(() => {
    if (!isIndividual && !sections.some(sec => sec.name === shelfSection)) {
      setShelfSection(sections.length > 0 ? sections[0].name : '');
    }
  }, [sections, shelfSection, isIndividual]);

  useEffect(() => {
    if (!isIndividual && shelfSection && categoriesForSection.length > 0 && !categoriesForSection.some(c => c.id === shelfCategoryId)) {
      setShelfCategoryId(categoriesForSection[0].id);
    }
  }, [shelfSection, categoriesForSection, isIndividual]);

  const individualMovies = useMemo(() => {
    const seen = new Set();
    return physicalEntries.filter(e => e.l.individual && !seen.has(e.m.id) && seen.add(e.m.id)).map(e => e.m);
  }, [physicalEntries]);
  const selectedCategory = categoriesForSection.find(c => c.id === shelfCategoryId) || null;

  const slotMovies = useMemo(() => {
    if (isIndividual || !selectedCategory) return {};
    const map = {};
    physicalEntries.forEach(({ m, l: loc }) => {
      if (loc.individual) return;
      if (loc.section === shelfSection && loc.categoryName === selectedCategory.name && String(loc.categoryNumber) === String(selectedCategory.number)) {
        const n = Number(loc.itemNumber);
        if (n >= 1 && n <= 24) { (map[n] = map[n] || []).push({ m, loc }); }
      }
    });
    return map;
  }, [physicalEntries, shelfSection, selectedCategory, isIndividual]);

  const isGallery = viewMode === 'gallery';
  const slotNumbers = useMemo(() => Array.from({ length: 24 }, (_, i) => i + 1), []);

  return (
    <div className="shelf-view">
      {orphanCount > 0 && (
        <div className="shelf-orphan-banner">
          <span>⚠️ 위치 정보가 지금의 섹션·카테고리와 맞지 않아 진열장에 보이지 않는 영화가 {orphanCount}편 있어요.</span>
          <button type="button" className="btn btn--ghost btn--sm" onClick={onOpenRepair}>복구하기</button>
        </div>
      )}
      <div className="shelf-region-tabs">
        {[...REGIONS, SHELF_INDIVIDUAL].map(r => (
          <button
            key={r}
            type="button"
            className={`shelf-region${shelfRegion === r ? ' is-active' : ''}`}
            onClick={() => { setShelfRegion(r); setShelfSection(''); setShelfCategoryId(''); }}
          >
            {r === SHELF_INDIVIDUAL ? '개별 보관' : r}<span className="shelf-region__count">{regionCounts[r] || 0}{r === SHELF_INDIVIDUAL ? '편' : '장'}</span>
          </button>
        ))}
      </div>

      <div className="shelf-nav__sections" style={isIndividual ? { display: 'none' } : undefined}>
        {sections.map(s => (
          <button
            key={s.id}
            type="button"
            className={`shelf-tab${shelfSection === s.name ? ' is-active' : ''}`}
            onClick={() => { setShelfSection(s.name); setShelfCategoryId(''); }}
          >
            <span className="shelf-tab__num">{s.number}</span>
            {s.name}
            <span className="shelf-tab__count">{sectionCounts.get(s.name) || 0}</span>
          </button>
        ))}
      </div>

      {!isIndividual && (
        <div className="shelf-nav__categories">
          {categoriesForSection.length === 0 ? (
            <p className="hint-text-small">이 섹션엔 아직 카테고리가 없어요. 설정에서 추가해주세요.</p>
          ) : (
            categoriesForSection.map(c => (
              <button
                key={c.id}
                type="button"
                className={`shelf-chip${shelfCategoryId === c.id ? ' is-active' : ''}${fillOf(c) >= 24 ? ' is-full' : ''}`}
                data-tip={c.description || undefined}
                onClick={() => setShelfCategoryId(c.id)}
              >
                <span className={c.description ? 'shelf-chip__name--tip' : undefined}>({c.number}) {c.name}</span>
                <span className="shelf-chip__count">{fillOf(c) >= 24 ? '✓ 24/24' : `${fillOf(c)}/24`}</span>
              </button>
            ))
          )}
        </div>
      )}

      {groupItems && (
        <DiscContentsModal
          items={groupItems}
          onClose={() => setGroupItems(null)}
          onPick={mv => { setGroupItems(null); (onOpenDetail || onEdit)(mv); }}
          onAdd={() => {
            const l = groupItems[0].loc;
            setGroupItems(null);
            onAddToDisc({ section: l.section, categoryName: l.categoryName, categoryNumber: l.categoryNumber, itemNumber: l.itemNumber });
          }}
        />
      )}

      {!isIndividual && selectedCategory && (
        <div className="shelf-crumb">
          {shelfRegion} › {shelfSection} › ({selectedCategory.number}) {selectedCategory.name} · {fillOf(selectedCategory)}/24
          {selectedCategory.description && <span className="shelf-crumb__desc"> — {selectedCategory.description}</span>}
        </div>
      )}

      {isIndividual ? (
        individualMovies.length === 0 ? (
          <div className="empty-state"><p>개별 보관으로 등록된 영화가 아직 없어요.</p></div>
        ) : isGallery ? (
          <div className="poster-gallery">
            {individualMovies.map(m => <PosterMovieTile key={m.id} movie={m} onEdit={onOpenDetail || onEdit} />)}
          </div>
        ) : (
          <div className="grid">
            {individualMovies.map(m => (
              <MovieCard key={m.id} movie={m} onOpenDetail={onOpenDetail} onEdit={onEdit} onFilter={onFilter} onMoveToOwned={onMoveToOwned} onAddSequel={onAddSequel} />
            ))}
          </div>
        )
      ) : selectedCategory ? (
        isGallery ? (
          <div className="poster-gallery">
            {slotNumbers.map(n => (
              slotMovies[n]
                ? <PosterMovieTile key={n} movie={slotMovies[n][0].m} focusLoc={slotMovies[n][0].loc} sharedCount={slotMovies[n].length} onEdit={slotMovies[n].length > 1 ? (() => setGroupItems(slotMovies[n])) : (onOpenDetail || onEdit)} />
                : <ShelfSlotEmpty key={n} n={n} gallery onClick={() => onAddAtSlot({ section: shelfSection, categoryName: selectedCategory.name, categoryNumber: selectedCategory.number, itemNumber: n })} />
            ))}
          </div>
        ) : (
          <div className="grid">
            {slotNumbers.map(n => (
              slotMovies[n]
                ? <div key={n} style={{ display: 'contents' }}>{slotMovies[n].map(({ m: cm, loc: cl }) => <MovieCard key={`${n}-${cm.id}`} movie={cm} focusLoc={cl} sharedCount={slotMovies[n].length} onOpenDetail={onOpenDetail} onEdit={onEdit} onFilter={onFilter} onMoveToOwned={onMoveToOwned} onAddSequel={onAddSequel} />)}</div>
                : <ShelfSlotEmpty key={n} n={n} onClick={() => onAddAtSlot({ section: shelfSection, categoryName: selectedCategory.name, categoryNumber: selectedCategory.number, itemNumber: n })} />
            ))}
          </div>
        )
      ) : (
        <div className="empty-state"><p>{sections.length === 0 ? `${shelfRegion}에는 아직 섹션이 없어요. 영화 등록 화면이나 설정에서 섹션을 추가해주세요.` : '카테고리를 선택해주세요.'}</p></div>
      )}
    </div>
  );
}

  function beginSaving() { setSavingCount(v => v + 1); }
  function endSaving() { setSavingCount(v => Math.max(0, v - 1)); }

  async function refreshBackups() {
    setBackupBusy(true);
    try { setBackups(await listAutomaticBackups()); }
    catch (e) { console.error(e); window.alert('⚠️ 백업 목록을 불러오지 못했어요.'); }
    finally { setBackupBusy(false); }
  }

  async function makeBackupAfterSave(nextMovies, reason, snapshot = {}) {
    try {
      const nextBackups = await createAutomaticBackup({ movies: nextMovies, customFormats: snapshot.customFormats ?? customFormats, settings: snapshot.settings ?? settings, reason });
      if (!nextBackups) return; // 최근에 이미 백업해서 이번엔 건너뜀
      setBackups(prev => [{ ...nextBackups }, ...prev.filter(b => b.id !== nextBackups.id)].slice(0, BACKUP_LIMIT));
    } catch (e) {
      console.error('자동 백업 실패', e);
      // 원본 저장은 이미 성공했으므로 백업 실패 때문에 사용자의 저장을 되돌리지 않는다.
      window.alert('⚠️ 영화 저장은 완료됐지만 자동 백업을 만들지 못했어요. 다음 저장 때 다시 시도합니다.');
    }
  }

  async function handleRestoreBackup(backup) {
    const ok = window.confirm(`${new Date(backup.createdAt).toLocaleString('ko-KR')} 시점의 ${backup.count}편 데이터를 복구할까요?\n\n현재 영화 목록은 백업 시점의 목록으로 교체됩니다.`);
    if (!ok) return;
    beginSaving();
    try {
      const restored = await restoreAutomaticBackup(backup);
      setMovies(restored.sort((a, b) => String(b.addedAt || '').localeCompare(String(a.addedAt || ''))));
      setCustomFormats(backup.customFormats || []);
      setSettings(backup.settings || DEFAULT_SETTINGS);
      await refreshBackups();
      window.alert('백업 복구가 완료됐어요.');
    } catch (e) {
      console.error(e);
      window.alert('⚠️ 백업을 복구하지 못했어요. 현재 데이터는 그대로일 수 있습니다.');
    } finally { endSaving(); }
  }

  useEffect(() => {
    (async () => {
      setLoadError('');

      // 캐시가 있으면 클라우드 응답을 기다리지 않고 일단 이걸로 화면을 먼저 채운다.
      // 아래에서 클라우드 최신 데이터를 받아오면 다시 한번 조용히 덮어써서 갱신한다.
      const cached = loadLocalCache();
      if (cached) {
        setMovies(cached.movies || []);
        setCustomFormats(cached.customFormats || []);
        setSettings(cached.settings || DEFAULT_SETTINGS);
        setLoaded(true);
      }

      let finalMovies = cached?.movies || null;
      let finalCustomFormats = cached?.customFormats || null;
      let finalSettings = cached?.settings || null;
      let moviesLoadedOk = false;

      try {
        await migrateFromJsonbinIfNeeded();
      } catch (e) {
        console.warn('JSONBin 이전 중 문제가 있었어요:', e);
      }

      const normalizeLoadedMovie = (movie) => {
        const needsFormatFix = movie.formats?.some(f => f.startsWith('VOD-'));
        const needsGenreFix = !movie.genres && movie.genre;
        const needsCountryFix = !movie.countries && movie.country;
        return {
          ...movie,
          formats: needsFormatFix ? movie.formats.map(stripVodPrefix) : (movie.formats || []),
          genres: needsGenreFix ? [movie.genre] : (movie.genres || []),
          countries: needsCountryFix ? [movie.country] : (movie.countries || []),
        };
      };

      try {
        // 영화 한 편씩 따로 요청하지 않고, 한 번의 요청으로 전체를 통째로 받아온다.
        const { rows } = await window.storage.getAllByPrefix('movie:');
        finalMovies = rows
          .map(r => { try { return JSON.parse(r.value); } catch (e) { return null; } })
          .filter(Boolean)
          .map(normalizeLoadedMovie);
        setMovies(finalMovies);
        moviesLoadedOk = true;
      } catch (e) {
        console.error('클라우드 영화 목록 불러오기 실패:', e);
        setLoadError(
          '영화 전체 목록을 불러오지 못했습니다. 데이터는 삭제되지 않았습니다. 다시 불러오기를 눌러 주세요.'
        );
      }

      // 매체 목록은 읽기만 하고, 로딩 중 자동 수정 저장은 하지 않는다.
      try {
        const res2 = await window.storage.get('custom-formats', false);
        const raw = res2?.value ? JSON.parse(res2.value) : [];
        finalCustomFormats = raw.map(stripVodPrefix);
        setCustomFormats(finalCustomFormats);
      } catch (e) {
        console.warn('매체 목록 불러오기 실패:', e);
        if (!cached) { finalCustomFormats = []; setCustomFormats([]); }
      }

      try {
        const res3 = await window.storage.get('settings', false);
        finalSettings = res3?.value ? migrateSettings(JSON.parse(res3.value)) : DEFAULT_SETTINGS;
        setSettings(finalSettings);
      } catch (e) {
        console.warn('설정 불러오기 실패:', e);
        if (!cached) { finalSettings = DEFAULT_SETTINGS; setSettings(DEFAULT_SETTINGS); }
      }

      setLoaded(true);

      // 영화 목록까지 온전히 새로 받아왔을 때만 캐시를 갱신한다 (부분 실패한 상태를 캐시로 남기지 않기 위함).
      if (moviesLoadedOk) {
        saveLocalCache({
          movies: finalMovies || [],
          customFormats: finalCustomFormats || [],
          settings: finalSettings || DEFAULT_SETTINGS,
        });
      }

      // 백업 목록은 화면 로딩 이후에만 읽는다.
      // 영화 로딩과 JSONBin 요청이 겹치지 않게 한다.
      if (!loadError) {
        try {
          setBackups(await listAutomaticBackups());
        } catch (e) {
          console.error('백업 목록 불러오기 실패', e);
        }
      }
    })();
  }, []);

  function handleAddCustomFormat(value) {

  function handleChangeTheme(themeId) { persistSettings({ ...settings, themeId }); }

  function handleAddSection(name, region = DEFAULT_REGION) {
    const dup = settings.sections.find(s => s.name === name);
    if (dup) {
      if (sectionRegion(dup) !== region) {
        window.alert(`「${name}」 섹션은 이미 ${sectionRegion(dup)}에 있어요. 섹션 이름은 외화/한국에 걸쳐 겹치지 않아야 해서, 다른 이름을 사용해주세요.`);
        return false;
      }
      return true;
    }
    const used = new Set(settings.sections.filter(s => sectionRegion(s) === region).map(s => s.number));
    let suggested = 1;
    while (used.has(suggested) && suggested <= 50) suggested++;
    persistSettings({ ...settings, sections: [...settings.sections, { id: uid(), number: suggested, name, region }] });
    return true;
  }

  function handleUpdateSection(id, patch) {
    const target = settings.sections.find(s => s.id === id);
    if (!target) return true;
    const renamed = patch.name !== undefined && patch.name !== target.name;
    if (renamed && settings.sections.some(s => s.id !== id && s.name === patch.name)) {
      window.alert(`「${patch.name}」 섹션이 이미 있어요. 다른 이름을 사용해주세요.`);
      return false;
    }
    const nextSections = settings.sections.map(s => s.id === id ? { ...s, ...patch } : s);
    const nextCategories = renamed
      ? settings.categories.map(c => c.section === target.name ? { ...c, section: patch.name } : c)
      : settings.categories;
    const nextSettings = { ...settings, sections: nextSections, categories: nextCategories };
    if (!renamed) { persistSettings(nextSettings); return true; }
    const updated = remapMoviesLocations(l => l.section === target.name, l => ({ ...l, section: patch.name }));
    if (updated.length === 0) { persistSettings(nextSettings); return true; }
    persistSettingsWithMovies(nextSettings, updated, '섹션 이름 변경');
    return true;
  }

  function handleRemoveSection(id) {
    const target = settings.sections.find(s => s.id === id);
    if (!target) return;
    persistSettings({
      ...settings,
      sections: settings.sections.filter(s => s.id !== id),
      categories: settings.categories.filter(c => c.section !== target.name),
    });
  }

  function handleAddCategory(section, number, name, description = '') {
    if (settings.categories.some(c => c.section === section && Number(c.number) === Number(number))) {
      window.alert(`${number}번은 이 섹션에서 이미 쓰고 있어요. 다른 번호를 입력해주세요.`);
      return;
    }
    persistSettings({ ...settings, categories: [...settings.categories, { id: uid(), section, number, name, description }] });
  }

  async function persistSettingsWithMovies(nextSettings, updatedMovies, label) {
    beginSaving();
    try {
      for (const mv of updatedMovies) {
        await window.storage.set(`movie:${mv.id}`, JSON.stringify(mv), false);
      }
      await window.storage.set('settings', JSON.stringify(nextSettings), false);
      const byId = new Map(updatedMovies.map(mv => [mv.id, mv]));
      const nextMovies = movies.map(mv => byId.get(mv.id) || mv);
      setMovies(nextMovies);
      setSettings(nextSettings);
      saveLocalCache({ movies: nextMovies, customFormats, settings: nextSettings });
      makeBackupAfterSave(nextMovies, label, { customFormats, settings: nextSettings });
    } catch (e) {
      console.error(e);
      window.alert('⚠️ 이름 변경을 끝까지 저장하지 못했어요. 새로고침해서 영화 위치가 맞는지 확인해 주세요.');
    } finally {
      endSaving();
    }
  }

  function remapMoviesLocations(matchFn, remapFn) {
    const result = [];
    movies.forEach(mv => {
      const hasPhys = mv.physicalLocation && matchFn(mv.physicalLocation);
      const hasLocs = Array.isArray(mv.locations) && mv.locations.some(matchFn);
      if (!hasPhys && !hasLocs) return;
      result.push({
        ...mv,
        physicalLocation: hasPhys ? remapFn(mv.physicalLocation) : mv.physicalLocation,
        locations: hasLocs ? mv.locations.map(l => (matchFn(l) ? remapFn(l) : l)) : mv.locations,
      });
    });
    return result;
  }

  async function handleApplyRepair(assignments) {
    if (loadError) {
      window.alert('⚠️ 영화 전체 목록을 정상적으로 불러온 뒤 복구해 주세요.');
      return;
    }
    const byKey = new Map(assignments.map(a => [a.from.key, a.to]));
    const remapLoc = l => {
      if (!l || l.individual) return l;
      const to = byKey.get(catKey(l));
      return to ? { ...l, section: to.section, categoryName: to.name, categoryNumber: to.number } : l;
    };
    const updated = [];
    movies.forEach(mv => {
      const newPhys = mv.physicalLocation ? remapLoc(mv.physicalLocation) : mv.physicalLocation;
      const newLocs = Array.isArray(mv.locations) ? mv.locations.map(remapLoc) : mv.locations;
      if (JSON.stringify(newPhys) !== JSON.stringify(mv.physicalLocation) || JSON.stringify(newLocs) !== JSON.stringify(mv.locations)) {
        updated.push({ ...mv, physicalLocation: newPhys, locations: newLocs });
      }
    });
    if (updated.length === 0) { setRepairOpen(false); return; }
    beginSaving();
    try {
      for (const mv of updated) {
        await window.storage.set(`movie:${mv.id}`, JSON.stringify(mv), false);
      }
      const byId = new Map(updated.map(mv => [mv.id, mv]));
      const nextMovies = movies.map(mv => byId.get(mv.id) || mv);
      setMovies(nextMovies);
      saveLocalCache({ movies: nextMovies, customFormats, settings });
      makeBackupAfterSave(nextMovies, '영화 위치 복구');
      setRepairOpen(false);
      window.alert(`${updated.length}편의 위치를 복구했어요.`);
    } catch (e) {
      console.error(e);
      window.alert('⚠️ 위치 복구를 끝까지 저장하지 못했어요. 새로고침 후 다시 시도해 주세요.');
    } finally {
      endSaving();
    }
  }

  function handleUpdateCategory(id, patch) {
    const target = settings.categories.find(c => c.id === id);
    if (!target) return;
    const nextSettings = { ...settings, categories: settings.categories.map(c => c.id === id ? { ...c, ...patch } : c) };
    const newName = patch.name !== undefined ? patch.name : target.name;
    const newNumber = patch.number !== undefined ? patch.number : target.number;
    const changed = newName !== target.name || String(newNumber) !== String(target.number);
    if (!changed) { persistSettings(nextSettings); return; }
    const match = l => l.section === target.section && l.categoryName === target.name &&
      String(l.categoryNumber ?? '') === String(target.number ?? '');
    const updated = remapMoviesLocations(match, l => ({ ...l, categoryName: newName, categoryNumber: newNumber }));
    if (updated.length === 0) { persistSettings(nextSettings); return; }
    persistSettingsWithMovies(nextSettings, updated, '카테고리 변경');
  }

  function handleRemoveCategory(id) {
    persistSettings({ ...settings, categories: settings.categories.filter(c => c.id !== id) });
  }

  function handleResetSettings() {
    persistSettings(DEFAULT_SETTINGS);
  }

  async function handleSaveMovie(movieData, opts = {}) {
    if (loadError) {
      window.alert('⚠️ 영화 전체 목록을 정상적으로 불러온 뒤 저장해 주세요.');
      return;
    }
    beginSaving();
    try {
      await window.storage.set(`movie:${movieData.id}`, JSON.stringify(movieData), false);
      const nextMovies = movies.some(m => m.id === movieData.id)
        ? movies.map(m => m.id === movieData.id ? movieData : m)
        : [movieData, ...movies];
      setMovies(nextMovies);
      const firstLoc = (movieData.locations || [])[0];
      if (opts && opts.addNext && firstLoc && !firstLoc.individual) {
        setEditingMovie(null);
        setFormSeed({
          formats: ['DVD'],
          sharedDisc: true,
          nonce: Date.now(),
          physicalLocation: {
            section: firstLoc.section,
            categoryName: firstLoc.categoryName,
            categoryNumber: firstLoc.categoryNumber,
            itemNumber: firstLoc.itemNumber,
          },
        });
        setFormOpen(true);
      } else {
        setFormOpen(false);
        setEditingMovie(null);
      }
      saveLocalCache({ movies: nextMovies, customFormats, settings });
      // 백업은 완료를 기다리지 않고 배경에서 진행한다 (저장 체감 속도 개선).
      makeBackupAfterSave(nextMovies, movies.some(m => m.id === movieData.id) ? '영화 수정' : '영화 추가');
    } catch (e) {
      console.error(e);
      window.alert('⚠️ 영화를 저장하지 못했어요. 입력창은 그대로 두었습니다. 잠시 후 다시 저장해 주세요.');
    } finally {
      endSaving();
    }
  }

  async function handleDeleteMovie(id) {

      const nextMovies = movies.filter(m => m.id !== id);
      setMovies(nextMovies);
      setFormOpen(false);
      setEditingMovie(null);
      saveLocalCache({ movies: nextMovies, customFormats, settings });
      makeBackupAfterSave(nextMovies, '영화 삭제');

      window.alert('⚠️ 삭제를 완료하지 못했어요. 화면의 영화 정보는 그대로 유지했습니다.');
    } finally {
      endSaving();
    }
  }

  async function handleToggleFavorite(movie) {

  function openEditForm(mv) {

  function handleEditRequest(mv) {
    const co = [];
    getLocations(mv).filter(l => !l.individual).forEach(l => {
      movies.forEach(o => {
        if (o.id === mv.id || co.some(x => x.m.id === o.id)) return;
        const together = getLocations(o).some(ol => !ol.individual &&
          ol.section === l.section && ol.categoryName === l.categoryName &&
          String(ol.categoryNumber ?? '') === String(l.categoryNumber ?? '') &&
          Number(ol.itemNumber) === Number(l.itemNumber));
        if (together) co.push({ m: o });
      });
    });
    if (co.length === 0) { openEditForm(mv); return; }
    setEditPick([{ m: mv }, ...co]);
  }

  async function handleAddToDisc(slot) {
    if (loadError) {
      window.alert('⚠️ 영화 전체 목록을 정상적으로 불러온 뒤 추가해 주세요.');
      return;
    }
    const sameSlot = l => !l.individual && l.section === slot.section && l.categoryName === slot.categoryName &&
      String(l.categoryNumber ?? '') === String(slot.categoryNumber ?? '') && Number(l.itemNumber) === Number(slot.itemNumber);
    const toMark = movies.filter(m => getLocations(m).some(l => sameSlot(l) && !l.shared));
    if (toMark.length > 0) {
      beginSaving();
      try {
        const updated = toMark.map(m => ({ ...m, locations: getLocations(m).map(l => (sameSlot(l) ? { ...l, shared: true } : l)) }));
        for (const mv of updated) {
          await window.storage.set(`movie:${mv.id}`, JSON.stringify(mv), false);
        }
        const byId = new Map(updated.map(mv => [mv.id, mv]));
        const nextMovies = movies.map(mv => byId.get(mv.id) || mv);
        setMovies(nextMovies);
        saveLocalCache({ movies: nextMovies, customFormats, settings });
        makeBackupAfterSave(nextMovies, '한 디스크 수록 표시');
      } catch (e) {
        console.error(e);
        window.alert('⚠️ 기존 영화에 함께 수록 표시를 저장하지 못했어요. 다시 시도해 주세요.');
        return;
      } finally {
        endSaving();
      }
    }
    setEditingMovie(null);
    setFormSeed({
      formats: ['DVD'],
      sharedDisc: true,
      nonce: Date.now(),
      physicalLocation: {
        section: slot.section,
        categoryName: slot.categoryName,
        categoryNumber: slot.categoryNumber,
        itemNumber: slot.itemNumber,
      },
    });
    setFormOpen(true);
  }

  async function handleMoveToOwned(movie) {
    const updated = { ...movie, status: 'owned' };
    beginSaving();
    try {
      await window.storage.set(`movie:${updated.id}`, JSON.stringify(updated), false);
      const nextMovies = movies.map(m => m.id === updated.id ? updated : m);
      setMovies(nextMovies);
      saveLocalCache({ movies: nextMovies, customFormats, settings });
      makeBackupAfterSave(nextMovies, '보유 상태 변경');
    } catch (e) {
      console.error(e);
      window.alert('⚠️ 보유 상태 변경을 저장하지 못했어요.');
    } finally {
      endSaving();
    }
  }

  function handleAddSequel(baseMovie) {
    const sameSeries = movies.filter(m => m.seriesId === baseMovie.seriesId);
    const maxOrder = Math.max(0, ...sameSeries.map(m => Number(m.seriesOrder) || 0));
    setEditingMovie(null);
    setFormSeed({ seriesId: baseMovie.seriesId, seriesName: baseMovie.seriesName, seriesOrder: maxOrder + 1, seriesUnofficial: false, seriesRemake: false });
    setFormOpen(true);
  }

  function handleChooseSingleAtSlot() {
    const slot = slotAddContext;
    setSlotAddContext(null);
    setEditingMovie(null);
    setFormSeed({
      formats: ['DVD'],
      physicalLocation: {
        section: slot.section,
        categoryName: slot.categoryName,
        categoryNumber: slot.categoryNumber,
        itemNumber: slot.itemNumber,
      },
    });
    setFormOpen(true);
  }

  function handleChooseBulkAtSlot() {
    const slot = slotAddContext;
    setSlotAddContext(null);
    setBulkLocationSeed(slot);
    setBulkOpen(true);
  }

  async function handleBulkConfirm(newOnes) {
    if (loadError) {
      window.alert('⚠️ 목록 전체를 정상적으로 불러온 뒤 일괄 등록해 주세요.');
      return;
    }
    beginSaving();
    const saved = [];
    try {
      for (const m of newOnes) {
        try {
          await window.storage.set(`movie:${m.id}`, JSON.stringify(m), false);
          saved.push(m);
        } catch (e) {
          console.error(e);
          break;
        }
      }
      if (saved.length) {
        const nextMovies = [...saved, ...movies];
        setMovies(nextMovies);
        saveLocalCache({ movies: nextMovies, customFormats, settings });
        makeBackupAfterSave(nextMovies, '목록 일괄 등록');
      }
      if (saved.length === newOnes.length) {
        setBulkOpen(false);
        setBulkLocationSeed(null);
      } else {
        window.alert(`⚠️ ${newOnes.length}편 중 ${saved.length}편만 저장됐어요. 저장되지 않은 항목은 다시 시도해 주세요.`);
      }
    } finally {
      endSaving();
    }
  }

  function openFilter(type, value, label) {
    setActiveFilter({ type, value, label: label ?? value });
    setSearch('');
  }

  const allFormatOptions = useMemo(() => {
    const extra = customFormats.filter(f => !DEFAULT_FORMATS.includes(f) && f !== UNCLASSIFIED_FORMAT);
    return [...DEFAULT_FORMATS, ...extra];
  }, [customFormats]);

  const filterFormatOptions = useMemo(
    () => [...allFormatOptions, UNCLASSIFIED_FORMAT],
    [allFormatOptions]
  );

  const formatCounts = useMemo(() => {
    const counts = {};
    for (const f of filterFormatOptions) counts[f] = 0;

    for (const m of movies) {
      if (statusFilter !== 'all' && m.status !== statusFilter) continue;
      const formats = Array.isArray(m.formats) ? m.formats : [];
      if (formats.length === 0) {
        counts[UNCLASSIFIED_FORMAT] = (counts[UNCLASSIFIED_FORMAT] || 0) + 1;
      } else {
        for (const f of formats) counts[f] = (counts[f] || 0) + 1;
      }
    }
    return counts;
  }, [movies, filterFormatOptions, statusFilter]);

  const filteredMovies = useMemo(() => {
    let list = movies.filter(m => {
      if (statusFilter !== 'all' && m.status !== statusFilter) return false;
      if (favoriteOnly && !m.favorite) return false;
      if (seriesOnly && !m.seriesId) return false;
      if (formatFilter.length > 0) {
        const formats = Array.isArray(m.formats) ? m.formats : [];
        const matchesFormat = formatFilter.some(f =>
          f === UNCLASSIFIED_FORMAT
            ? formats.length === 0
            : formats.includes(f)
        );
        if (!matchesFormat) return false;
      }
      if (activeFilter) {
        const { type, value } = activeFilter;
        if (type === 'person') { if (!(m.director === value || (m.actors || []).includes(value))) return false; }
        else if (type === 'genre' && !(m.genres || (m.genre ? [m.genre] : [])).includes(value)) return false;
        else if (type === 'country' && !(m.countries || (m.country ? [m.country] : [])).includes(value)) return false;
        else if (type === 'tag' && !(m.hashtags || []).includes(value)) return false;
        else if (type === 'series' && m.seriesId !== value) return false;
      }
      if (search.trim()) {
        const q = search.trim().toLowerCase();
        const haystack = [m.titleKr, m.titleOriginal, m.director, ...(m.countries || (m.country ? [m.country] : [])), ...(m.genres || (m.genre ? [m.genre] : [])), ...(m.actors || []), ...(m.hashtags || [])].join(' ').toLowerCase();
        if (!haystack.includes(q)) return false;
      }
      return true;
    });
    list = [...list].sort((a, b) => {
      if (activeFilter?.type === 'series') return (Number(a.seriesOrder) || 0) - (Number(b.seriesOrder) || 0);
      if (seriesOnly) {
        const sn = String(a.seriesName || '').localeCompare(String(b.seriesName || ''), 'ko');
        if (sn) return sn;
        return (Number(a.seriesOrder) || 0) - (Number(b.seriesOrder) || 0);
      }
      if (sortBy === 'rating-desc' || sortBy === 'rating-asc') {
        const ra = typeof a.rating === 'number' ? a.rating : null;
        const rb = typeof b.rating === 'number' ? b.rating : null;
        if (ra == null && rb == null) return (b.createdAt || 0) - (a.createdAt || 0);
        if (ra == null) return 1;
        if (rb == null) return -1;
        if (ra !== rb) return sortBy === 'rating-desc' ? rb - ra : ra - rb;
        return (b.createdAt || 0) - (a.createdAt || 0);
      }
      if (sortBy === 'year-asc') return (a.year || '').localeCompare(b.year || '');
      if (sortBy === 'year-desc') return (b.year || '').localeCompare(a.year || '');
      if (sortBy === 'title') return a.titleKr.localeCompare(b.titleKr, 'ko');
      return (b.createdAt || 0) - (a.createdAt || 0);
    });
    return list;
  }, [movies, statusFilter, favoriteOnly, seriesOnly, formatFilter, activeFilter, search, sortBy]);

  const effectiveExpanded = useMemo(
    () => (seriesOnly ? new Set(filteredMovies.filter(m => m.seriesId).map(m => m.seriesId)) : expandedSeries),
    [seriesOnly, filteredMovies, expandedSeries]
  );
  const displayEntries = useMemo(() => buildDisplayEntries(filteredMovies, effectiveExpanded), [filteredMovies, effectiveExpanded]);
  const totalPages = Math.max(1, Math.ceil(displayEntries.length / pageSize));
  const pageEntries = useMemo(() => {
    const start = (page - 1) * pageSize;
    return displayEntries.slice(start, start + pageSize);
  }, [displayEntries, page, pageSize]);

  useEffect(() => {
    setPage(1);
  }, [statusFilter, favoriteOnly, seriesOnly, formatFilter, activeFilter, search, sortBy, viewMode, pageSize]);

  useEffect(() => {
    if (page > totalPages) setPage(totalPages);
  }, [page, totalPages]);

  function handleToggleSeries(seriesId) {
    setExpandedSeries(prev => {
      const next = new Set(prev);
      if (next.has(seriesId)) next.delete(seriesId);
      else next.add(seriesId);
      return next;
    });
  }

  const ownedCount = movies.filter(m => m.status === 'owned').length;
  const wishlistCount = movies.filter(m => m.status === 'wishlist').length;
  const themeVars = THEMES[settings.themeId]?.vars || THEMES.filmCatalog.vars;

  if (!loaded) {
    return (
      <div style={{
        minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center',
        fontFamily: '-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif',
        color: '#8C8064', background: '#FAF8F4', fontSize: '14px',
      }}>
        불러오는 중이에요...
      </div>
    );
  }

  if (loadError) {
    return (
      <div style={{
        minHeight: '100vh',
        display: 'flex',
        alignItems: 'center',
        justifyContent: 'center',
        padding: '24px',
        fontFamily: '-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif',
        background: '#FAF8F4'
      }}>
        <div style={{
          maxWidth: '560px',
          background: '#fff',
          border: '1px solid #D7C8A8',
          borderRadius: '14px',
          padding: '24px',
          color: '#4A4032',
          lineHeight: 1.6
        }}>
          <h2 style={{ marginTop: 0, fontSize: '18px' }}>영화 데이터를 불러오지 못했어요</h2>
          <p>{loadError}</p>
          <p style={{ fontSize: '13px', color: '#7A6F60' }}>
            이 상태에서는 새 영화 저장·수정·삭제를 하지 않습니다.
          </p>
          <button
            type="button"
            onClick={() => window.location.reload()}
            style={{
              marginTop: '8px',
              border: '1px solid #B4914F',
              background: '#fff',
              borderRadius: '9px',
              padding: '9px 14px',
              cursor: 'pointer'
            }}
          >
            다시 불러오기
          </button>
        </div>
      </div>
    );
  }

  return (
    <div className={`mc-app${shelfModeOn ? ' mc-app--shelf' : ''}`} style={themeVars}>
      <style>{APP_CSS}</style>

      <aside className="sidebar">
        <div className="sidebar-top">
          <div>
            <h1 className="brand-title">영화 컬렉션</h1>
            <div className="brand-stats">보유 {ownedCount}편 · 미보유 {wishlistCount}편</div>
          </div>
          <button type="button" className="icon-only-btn" onClick={() => setSettingsOpen(true)} title="설정">
            <SettingsIcon size={16} />
          </button>
        </div>
        <hr />
        <div className="sidebar-section">
          <div className="status-row">
          <div className="segmented">
            <button type="button" className={statusFilter === 'all' ? 'is-active' : ''} onClick={() => setStatusFilter('all')}>전체</button>
            <button type="button" className={statusFilter === 'owned' ? 'is-active' : ''} onClick={() => setStatusFilter('owned')}>보유</button>
            <button type="button" className={statusFilter === 'wishlist' ? 'is-active' : ''} onClick={() => setStatusFilter('wishlist')}>미보유</button>
          </div>
          <button
            type="button"
            className={`heart-filter-btn${favoriteOnly ? ' is-on' : ''}`}
            title={favoriteOnly ? '하트 표시한 영화만 보는 중 (누르면 전체)' : '하트 표시한 영화만 보기'}
            aria-pressed={favoriteOnly}
            onClick={() => setFavoriteOnly(v => !v)}
          >
            <HeartIcon size={16} style={favoriteOnly ? { fill: 'currentColor' } : undefined} />
          </button>
          <button
            type="button"
            className={`series-filter-btn${seriesOnly ? ' is-on' : ''}`}
            title={seriesOnly ? '시리즈만 묶어 보는 중 (누르면 전체)' : '시리즈 영화만 묶어서 보기'}
            aria-pressed={seriesOnly}
            onClick={() => setSeriesOnly(v => !v)}
          >
            시리즈만
          </button>
          </div>
        </div>
        <hr />
        <div className="sidebar-section">
          <h3>매체 / 플랫폼</h3>
          <div className="format-filter-list">
            {filterFormatOptions.map(f => (
              <div key={f} className={`format-filter-item${formatFilter.includes(f) ? ' is-active' : ''}`}>
                <label>
                  <input type="checkbox" checked={formatFilter.includes(f)} onChange={() => setFormatFilter(prev => prev.includes(f) ? prev.filter(x => x !== f) : [...prev, f])} />
                  {f}
                </label>
                <span className="count">{formatCounts[f] || 0}</span>
              </div>
            ))}
          </div>
        </div>
      </aside>

      <main className="main">
        <div className="topbar">
          <div className="search-box">
            <Search size={16} />
            <input placeholder="제목, 감독, 배우, 태그로 검색" value={search} onChange={e => { setSearch(e.target.value); setActiveFilter(null); }} />
          </div>
          <SaveStatus saving={saving} />
          <button type="button" className="icon-only-btn" onClick={() => setExportOpen(true)} title="문서로 내보내기">
            <DownloadIcon size={16} />
          </button>
          {shelfModeOn && (
            <button type="button" className="icon-only-btn" onClick={() => setSettingsOpen(true)} title="설정">
              <SettingsIcon size={16} />
            </button>
          )}
          <div className="segmented segmented--view">
            <button type="button" className={viewMode === 'card' ? 'is-active' : ''} onClick={() => setViewMode('card')}>카드</button>
            <button type="button" className={viewMode === 'gallery' ? 'is-active' : ''} onClick={() => setViewMode('gallery')}>포스터</button>
          </div>
          <button
            type="button"
            className={`btn btn--ghost shelf-toggle-btn${shelfModeOn ? ' is-active' : ''}`}
            onClick={() => setShelfModeOn(v => !v)}
          >
            DVD
          </button>
          <select className="sort-select" value={sortBy} onChange={e => setSortBy(e.target.value)}>
            <option value="recent">최근 추가순</option>
            <option value="year-desc">연도 최신순</option>
            <option value="year-asc">연도 오래된순</option>
            <option value="title">제목 가나다순</option>
            <option value="rating-desc">별점 높은순</option>
            <option value="rating-asc">별점 낮은순</option>
          </select>
          <button type="button" className="btn btn--ghost" onClick={() => setBulkOpen(true)} title="목록 붙여넣기"><Upload size={15} /> 목록</button>
          <button type="button" className="btn btn--primary" onClick={() => { setEditingMovie(null); setFormSeed(null); setFormOpen(true); }}><Plus size={16} /> 새 영화</button>
        </div>

        {activeFilter && (
          <div className="filter-banner">
            <Film size={15} />
            <span>
              {activeFilter.type === 'person' && <>필모그래피: <b>{activeFilter.value}</b></>}
              {activeFilter.type === 'genre' && <>장르: <b>{activeFilter.value}</b></>}
              {activeFilter.type === 'country' && <>제작국가: <b>{activeFilter.value}</b></>}
              {activeFilter.type === 'tag' && <>태그: <b>#{activeFilter.value}</b></>}
              {activeFilter.type === 'series' && <>시리즈: <b>{activeFilter.label}</b></>}
              {' '}({filteredMovies.length}편)
            </span>
            <button type="button" onClick={() => setActiveFilter(null)}>필터 해제</button>
          </div>
        )}

        {!loaded ? (
          <div className="empty-state">불러오는 중이에요...</div>
        ) : shelfModeOn ? (
          <ShelfView
            movies={movies}
            settings={settings}
            viewMode={viewMode}
            shelfRegion={shelfRegion}
            setShelfRegion={setShelfRegion}
            shelfSection={shelfSection}
            orphanCount={orphanCount}
            onOpenRepair={() => setRepairOpen(true)}
            setShelfSection={setShelfSection}
            shelfCategoryId={shelfCategoryId}
            setShelfCategoryId={setShelfCategoryId}
            onEdit={handleEditRequest}
            onOpenDetail={mv => setDetailId(mv.id)}
            onAddToDisc={handleAddToDisc}
            onFilter={openFilter}
            onMoveToOwned={handleMoveToOwned}
            onAddSequel={handleAddSequel}
            onAddAtSlot={setSlotAddContext}
          />
        ) : filteredMovies.length === 0 ? (
          <div className="empty-state">
            <h3>{movies.length === 0 ? '아직 등록된 영화가 없어요' : '조건에 맞는 영화가 없어요'}</h3>
            <p>{movies.length === 0 ? '새 영화를 추가하거나 기존 목록을 붙여넣어 시작해보세요.' : '필터나 검색어를 바꿔보세요.'}</p>
          </div>
        ) : viewMode === 'gallery' ? (
          <PosterGallery
            entries={pageEntries}
            onEdit={mv => setDetailId(mv.id)}
            onToggleSeries={handleToggleSeries}
          />
        ) : (
          <div className="grid">
            {pageEntries.map(entry => {
              if (entry.type === 'series-bundle') {
                return <SeriesBundleCard key={entry.seriesId} entry={entry} onToggle={handleToggleSeries} />;
              }
              if (entry.type === 'series-expanded') {
                return (
                  <SeriesExpandedCardBlock
                    key={`expanded-${entry.seriesId}`}
                    entry={entry}
                    onToggle={handleToggleSeries}
                    onEdit={mv => { setEditingMovie(mv); setFormSeed(null); setFormOpen(true); }}
                    onFilter={openFilter}
                    onMoveToOwned={handleMoveToOwned}
                    onAddSequel={handleAddSequel}
                  />
                );
              }
              const m = entry.movie;
              return <MovieCard key={m.id} movie={m} onEdit={mv => { setEditingMovie(mv); setFormSeed(null); setFormOpen(true); }} onFilter={openFilter} onMoveToOwned={handleMoveToOwned} onAddSequel={handleAddSequel} />;
            })}
          </div>
        )}

        {loaded && !shelfModeOn && filteredMovies.length > 0 && totalPages > 1 && (
          <div className="pagination">
            <button type="button" className="btn btn--ghost btn--sm" onClick={() => setPage(p => Math.max(1, p - 1))} disabled={page === 1}>이전</button>
            <span className="pagination__info">{page} / {totalPages} 페이지</span>
            <button type="button" className="btn btn--ghost btn--sm" onClick={() => setPage(p => Math.min(totalPages, p + 1))} disabled={page === totalPages}>다음</button>
            <select className="sort-select pagination__size" value={pageSize} onChange={e => setPageSize(Number(e.target.value))}>
              <option value={24}>24개씩</option>
              <option value={48}>48개씩</option>
              <option value={96}>96개씩</option>
              <option value={200}>200개씩</option>
            </select>
          </div>
        )}
      </main>

      {exportOpen && (
        <ExportModal movies={movies} settings={settings} onClose={() => setExportOpen(false)} />
      )}

      {repairOpen && (
        <LocationRepairModal
          groups={orphanGroups}
          categories={settings.categories}
          saving={saving}
          onClose={() => setRepairOpen(false)}
          onApply={handleApplyRepair}
        />
      )}

      {editPick && (
        <DiscContentsModal
          items={editPick}
          title="편집할 영화를 선택하세요"
          onClose={() => setEditPick(null)}
          onPick={mv => { setEditPick(null); openEditForm(mv); }}
        />
      )}

      {detailMovie && (
        <MovieDetailModal
          movie={detailMovie}
          onClose={() => setDetailId(null)}
          onFilter={openFilter}
          onAddToDisc={slot => { setDetailId(null); handleAddToDisc(slot); }}
          onEdit={mv => { setDetailId(null); handleEditRequest(mv); }}
        />
      )}

      {formOpen && (
        <MovieForm
          key={formSeed && formSeed.nonce ? `seed-${formSeed.nonce}` : (editingMovie ? editingMovie.id : 'new')}
          initial={editingMovie}
          seed={formSeed}
          formatOptions={allFormatOptions}
          settings={settings}
          movies={movies}
          onSave={handleSaveMovie}
          onCancel={() => { setFormOpen(false); setEditingMovie(null); setFormSeed(null); }}
          onDelete={handleDeleteMovie}
          onAddCustomFormat={handleAddCustomFormat}
          onAddSection={handleAddSection}
          onAddCategory={handleAddCategory}
          onManageSection={openSettingsForSection}
          saving={saving}
        />
      )}

      {bulkOpen && (
        <BulkImportModal
          onCancel={() => { setBulkOpen(false); setBulkLocationSeed(null); }}
          onConfirm={handleBulkConfirm}
          saving={saving}
          locationSeed={bulkLocationSeed}
        />
      )}

      {slotAddContext && (
        <SlotAddChoiceModal
          slot={slotAddContext}
          onCancel={() => setSlotAddContext(null)}
          onChooseSingle={handleChooseSingleAtSlot}
          onChooseBulk={handleChooseBulkAtSlot}
        />
      )}

      {settingsOpen && (
        <SettingsModal
          settings={settings}
          initialSection={settingsInitialSection}
          onCancel={() => setSettingsOpen(false)}
          onChangeTheme={handleChangeTheme}
          onAddSection={handleAddSection}
          onUpdateSection={handleUpdateSection}
          onRemoveSection={handleRemoveSection}
          onAddCategory={handleAddCategory}
          onUpdateCategory={handleUpdateCategory}
          onRemoveCategory={handleRemoveCategory}
          onResetSettings={handleResetSettings}
          backups={backups}
          onRefreshBackups={refreshBackups}
          onRestoreBackup={handleRestoreBackup}
          backupBusy={backupBusy}
        />
      )}
    </div>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(<MovieCollectionApp />);
</script>
</body>
</html>
