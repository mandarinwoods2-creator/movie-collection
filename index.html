const { useState, useEffect, useMemo } = React;

// ---------------------------------------------------------------
// JSONBin.io 기반 storage shim (v2: 키마다 개별 bin + 작은 인덱스 bin)
// Claude 아티팩트의 window.storage와 동일한 인터페이스를 흉내내되,
// 실제로는 클라우드(JSONBin)에 저장해서 아이패드/맥미니/맥북에어 등
// 어느 기기에서 이 페이지를 열어도 같은 데이터를 보게 한다.
//
// 예전엔 모든 영화를 하나의 큰 bin에 몰아넣었는데, JSONBin 무료 플랜은
// bin 하나당 100KB까지만 허용해서 컬렉션이 커지면 저장이 조용히(또는
// 에러와 함께) 실패했다. 이제는 영화 한 편당 자기만의 작은 bin을 따로
// 갖고, 'key → binId' 매핑만 담은 작은 인덱스 bin 하나로 찾아간다.
// 이러면 저장할 때마다 오가는 데이터가 항상 작아서 100KB에 걸릴 일이
// 거의 없다.
//
// 저장/조회는 Cloudflare Worker를 통해 처리합니다.
// Master Key는 Worker 내부에서만 사용하므로 이 페이지에는 넣지 않습니다.
// ---------------------------------------------------------------
const JSONBIN_INDEX_ID = '6aa9a8e5ac6210605ad1f72d';
const JSONBIN_BASE = 'https://shrill-moon-5ad5.mandarinwoods2.workers.dev/v3/b';

let _index = null; // { [key]: binId }
let _indexLoadPromise = null;
let _indexMutationQueue = Promise.resolve();

// ---------------------------------------------------------------
// 자동 백업
// 최근 10개의 백업을 JSONBin에 별도로 보관한다. 백업은 현재 영화 bin을
// 재사용하지 않고 각 영화의 내용을 별도 bin으로 복제하므로, 이후 영화가
// 수정/삭제되어도 과거 백업이 영향을 받지 않는다.
// ---------------------------------------------------------------
const BACKUP_PREFIX = 'backup:';
const BACKUP_LIMIT = 10;
let _backupQueue = Promise.resolve();

function makeBackupId() {
  return `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
}

function jsonbinHeaders(extra) {
  return { 'Content-Type': 'application/json', ...(extra || {}) };
}

// JSONBin 무료 플랜의 429(rate limit)에 대응한다.
// 여러 영화의 요청이 한꺼번에 몰려도 잠시 기다렸다가 자동 재시도하고,
// 일반적인 오류는 그대로 반환한다. 최대 5회, 점점 간격을 늘린다.
async function jsonbinFetch(url, options = {}) {
  let lastResponse = null;
  let lastError = null;

  for (let attempt = 0; attempt < 7; attempt++) {
    try {
      const res = await fetch(url, options);
      lastResponse = res;

      // 정상 응답은 즉시 반환.
      // 429 / 408 / 5xx만 일시 오류로 보고 재시도한다.
      const transient =
        res.status === 429 ||
        res.status === 408 ||
        (res.status >= 500 && res.status <= 599);

      if (!transient) return res;

      const retryAfter = Number(res.headers.get('Retry-After'));
      const waitMs = Number.isFinite(retryAfter) && retryAfter > 0
        ? Math.min(retryAfter * 1000, 12000)
        : Math.min(900 * Math.pow(1.7, attempt), 12000);

      await new Promise(resolve => setTimeout(resolve, waitMs));
    } catch (e) {
      lastError = e;

      if (attempt >= 6) break;

      const waitMs = Math.min(650 * Math.pow(1.65, attempt), 9000);
      await new Promise(resolve => setTimeout(resolve, waitMs));
    }
  }

  if (lastResponse) return lastResponse;
  throw lastError || new Error('네트워크 요청 실패');
}

function reportSaveFailure(status, body) {
  let msg = `클라우드 저장 실패 (${status})`;
  if (body && body.message) msg += `: ${body.message}`;
  window.alert('⚠️ ' + msg + '\n변경사항을 저장하지 못했어요. 기존 데이터는 그대로 유지됩니다.');
}

async function createBin(value, options = {}) {
  const res = await jsonbinFetch(JSONBIN_BASE, {
    method: 'POST',
    headers: jsonbinHeaders({ 'X-Bin-Private': 'true' }),
    body: JSON.stringify({ value }),
  });
  const data = await res.json().catch(() => null);
  if (!res.ok || !data?.metadata?.id) {
    if (options.report !== false) reportSaveFailure(res.status, data);
    throw new Error('bin 생성 실패');
  }
  return data.metadata.id;
}

async function updateBin(binId, value) {
  const res = await jsonbinFetch(`${JSONBIN_BASE}/${binId}`, {
    method: 'PUT',
    headers: jsonbinHeaders(),
    body: JSON.stringify({ value }),
  });
  if (!res.ok) {
    const body = await res.json().catch(() => null);
    reportSaveFailure(res.status, body);
    throw new Error('bin 갱신 실패');
  }
}

async function readBin(binId) {
  const res = await jsonbinFetch(`${JSONBIN_BASE}/${binId}/latest`, { headers: jsonbinHeaders() });
  if (!res.ok) throw new Error(`bin 읽기 실패 (${res.status})`);
  const data = await res.json();
  return data?.record?.value;
}

async function fetchIndexFromCloud() {
  const res = await jsonbinFetch(`${JSONBIN_BASE}/${JSONBIN_INDEX_ID}/latest`, {
    headers: jsonbinHeaders(),
    cache: 'no-store',
  });
  if (!res.ok) throw new Error(`인덱스 읽기 실패 (${res.status})`);
  const data = await res.json();
  const record = (data && data.record && typeof data.record === 'object') ? data.record : {};
  if (record.index && typeof record.index === 'object') return { ...record.index };
  return null;
}

async function saveIndex(indexToSave) {
  const res = await jsonbinFetch(`${JSONBIN_BASE}/${JSONBIN_INDEX_ID}`, {
    method: 'PUT',
    headers: jsonbinHeaders(),
    body: JSON.stringify({ index: indexToSave }),
  });
  if (!res.ok) {
    const body = await res.json().catch(() => null);
    reportSaveFailure(res.status, body);
    throw new Error('인덱스 저장 실패');
  }
}

// 동시 요청이 너무 많으면 요율 제한에 걸릴 수 있어 일정 개수씩 나눠 처리한다.
async function runInBatches(items, worker, batchSize = 2) {
  const results = [];
  for (let i = 0; i < items.length; i += batchSize) {
    const batch = items.slice(i, i + batchSize);
    const done = await Promise.all(batch.map(worker));
    results.push(...done);
  }
  return results;
}

async function loadIndex() {
  if (_index) return _index;
  if (_indexLoadPromise) return _indexLoadPromise;

  _indexLoadPromise = (async () => {
    const res = await jsonbinFetch(`${JSONBIN_BASE}/${JSONBIN_INDEX_ID}/latest`, {
      headers: jsonbinHeaders(),
      cache: 'no-store',
    });
    if (!res.ok) throw new Error(`인덱스 읽기 실패 (${res.status})`);
    const data = await res.json();
    const record = (data && data.record && typeof data.record === 'object') ? data.record : {};

    if (record.index && typeof record.index === 'object') {
      _index = { ...record.index };
    } else if (record.kv && typeof record.kv === 'object') {
      // 구버전(통짜 bin) 데이터 마이그레이션: 각 항목을 개별 bin으로 분리
      const entries = Object.entries(record.kv);
      const newIndex = {};
      await runInBatches(entries, async ([k, v]) => {
        const binId = await createBin(v);
        newIndex[k] = binId;
      });
      await saveIndex(newIndex);
      _index = newIndex;
    } else {
      // 정상적으로 읽었고 실제로 비어 있는 경우에만 빈 인덱스로 시작한다.
      _index = {};
    }
    return _index;
  })();

  try {
    return await _indexLoadPromise;
  } catch (e) {
    // 핵심: 네트워크/서버 오류를 절대로 '빈 데이터'로 바꾸지 않는다.
    _indexLoadPromise = null;
    throw e;
  }
}

// 인덱스 변경은 한 탭 안에서는 반드시 직렬화하고, 저장 뒤 다시 읽어서
// 이번 변경이 실제 클라우드 인덱스에 남아 있는지 확인한다.
// 다른 기기/탭이 거의 동시에 저장해 덮어쓴 경우 최신 인덱스 위에 다시 적용한다.
function queueIndexMutation(mutator, verify) {
  const job = _indexMutationQueue.then(async () => {
    let lastError = null;
    for (let attempt = 0; attempt < 5; attempt++) {
      try {
        const fresh = await fetchIndexFromCloud();
        if (fresh === null) throw new Error('클라우드 인덱스 형식이 올바르지 않음');
        mutator(fresh);
        await saveIndex(fresh);

        const confirmed = await fetchIndexFromCloud();
        if (confirmed !== null && verify(confirmed)) {
          _index = confirmed;
          return confirmed;
        }
        lastError = new Error('동시 저장 충돌 감지');
      } catch (e) {
        lastError = e;
      }
      await new Promise(resolve => setTimeout(resolve, 120 * (attempt + 1)));
    }
    throw lastError || new Error('인덱스 저장 실패');
  });
  _indexMutationQueue = job.catch(() => {});
  return job;
}

// ---------------------------------------------------------------
// Supabase 기반 storage (새 원본)
// JSONBin은 "평생 10,000회"라는 요청 한도 때문에 컬렉션이 커지면
// 근본적으로 한계에 부딪힌다. Supabase는 진짜 데이터베이스라
// 정상적인(재충전되는) 무료 요금제를 쓰고, 무엇보다 영화 전체를
// 한 번의 요청으로 통째로 불러올 수 있어 로딩이 훨씬 빠르다.
//
// 주의: 아래 anon 키도 페이지 소스에 그대로 노출돼요.
// 개인 컬렉션처럼 민감하지 않은 용도로만 쓰시고,
// 이 URL을 공개적으로 퍼뜨리지 않는 걸 권장해요.
// ---------------------------------------------------------------
const SUPABASE_URL = 'https://eswxnvwrxragcodmbbxc.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVzd3hudndyeHJhZ2NvZG1iYnhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0MTYzODcsImV4cCI6MjEwNTk5MjM4N30.zt2Alz_ggUKcLEFv4BszyJgS88RT2qLrLIYIRMBBeGI';
const SUPABASE_REST = `${SUPABASE_URL}/rest/v1/kv_store`;

function supabaseHeaders(extra) {
  return {
    'apikey': SUPABASE_ANON_KEY,
    'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
    'Content-Type': 'application/json',

function reportSupabaseFailure(status, body) {

  if (body && body.message) msg += `: ${body.message}`;
  window.alert('⚠️ ' + msg + '\n방금 한 변경사항이 다른 기기에는 반영되지 않았을 수 있어요.');

async function supabaseGetOne(key) {
  const res = await fetch(`${SUPABASE_REST}?key=eq.${encodeURIComponent(key)}&select=value`, {
    headers: supabaseHeaders(),
  });
  if (!res.ok) throw new Error(`Supabase 읽기 실패 (${res.status})`);
  const rows = await res.json();
  if (!rows.length) throw new Error('not found');
  return rows[0].value;
}

async function supabaseSetOne(key, value) {
  const res = await fetch(SUPABASE_REST, {
    method: 'POST',
    headers: supabaseHeaders({ 'Prefer': 'resolution=merge-duplicates,return=minimal' }),
    body: JSON.stringify({ key, value, updated_at: new Date().toISOString() }),
  });
  if (!res.ok) {
    const body = await res.json().catch(() => null);
    reportSupabaseFailure(res.status, body);
    throw new Error('Supabase 저장 실패');
  }
}

async function supabaseDeleteOne(key) {
  const res = await fetch(`${SUPABASE_REST}?key=eq.${encodeURIComponent(key)}`, {
    method: 'DELETE',
    headers: supabaseHeaders(),
  });
  if (!res.ok) {
    const body = await res.json().catch(() => null);
    reportSupabaseFailure(res.status, body);
    throw new Error('Supabase 삭제 실패');
  }
}

// Supabase(PostgREST)는 한 번에 최대 1000행까지만 돌려준다. 컬렉션이 커져도
// 잘리지 않도록 페이지 단위로 끝까지 읽는다. 첫 요청에서 전체 개수를 알 수
// 있으면 나머지 페이지는 동시에 받아와서 더 빠르게 끝낸다.
const SUPABASE_PAGE_SIZE = 1000;

async function supabaseSelectAll(filterQuery, select) {
  const url = offset =>
    `${SUPABASE_REST}?${filterQuery}&select=${select}&order=key.asc&limit=${SUPABASE_PAGE_SIZE}&offset=${offset}`;

  const first = await fetch(url(0), { headers: supabaseHeaders({ 'Prefer': 'count=exact' }) });
  if (!first.ok) throw new Error(`Supabase 조회 실패 (${first.status})`);
  const firstRows = await first.json();
  if (firstRows.length < SUPABASE_PAGE_SIZE) return firstRows;

  let total = NaN;
  const range = first.headers.get('content-range'); // 예: 0-999/2345
  if (range && range.includes('/')) total = parseInt(range.split('/')[1], 10);

  const all = [...firstRows];
  if (Number.isFinite(total) && total > SUPABASE_PAGE_SIZE) {
    const offsets = [];
    for (let o = SUPABASE_PAGE_SIZE; o < total; o += SUPABASE_PAGE_SIZE) offsets.push(o);
    const pages = await Promise.all(offsets.map(async o => {
      const res = await fetch(url(o), { headers: supabaseHeaders() });
      if (!res.ok) throw new Error(`Supabase 조회 실패 (${res.status})`);
      return res.json();
    }));
    pages.forEach(rows => all.push(...rows));
    return all;
  }

  // 전체 개수를 알 수 없으면 한 페이지씩 이어서 읽는다.
  let offset = SUPABASE_PAGE_SIZE;
  while (true) {
    const res = await fetch(url(offset), { headers: supabaseHeaders() });
    if (!res.ok) throw new Error(`Supabase 조회 실패 (${res.status})`);
    const rows = await res.json();
    all.push(...rows);
    if (rows.length < SUPABASE_PAGE_SIZE) break;
    offset += SUPABASE_PAGE_SIZE;
  }
  return all;
}

async function supabaseListKeys(prefix) {
  const rows = await supabaseSelectAll(`key=like.${encodeURIComponent(`${prefix}*`)}`, 'key');
  return rows.map(r => r.key);
}

// 목록 조회 후 하나씩 또 불러오는 대신, 한 번에 prefix에 맞는 key/value를 통째로 받아온다.
// 영화 전체를 불러올 때 요청 수를 극적으로 줄이는 핵심 지점이다.
async function supabaseGetAllByPrefix(prefix) {
  return supabaseSelectAll(`key=like.${encodeURIComponent(`${prefix}*`)}`, 'key,value');
}

// 여러 행을 한 번에 저장(upsert)한다. 너무 커지지 않도록 나눠서 보낸다.
async function supabaseSetMany(rows, chunkSize = 100) {
  for (let i = 0; i < rows.length; i += chunkSize) {
    const chunk = rows.slice(i, i + chunkSize).map(r => ({ key: r.key, value: r.value, updated_at: new Date().toISOString() }));
    const res = await fetch(SUPABASE_REST, {
      method: 'POST',
      headers: supabaseHeaders({ 'Prefer': 'resolution=merge-duplicates,return=minimal' }),
      body: JSON.stringify(chunk),
    });
    if (!res.ok) {
      const body = await res.json().catch(() => null);
      reportSupabaseFailure(res.status, body);
      throw new Error('Supabase 일괄 저장 실패');
    }
  }
}

async function supabaseDeleteByPrefix(prefix) {
  const res = await fetch(`${SUPABASE_REST}?key=like.${encodeURIComponent(`${prefix}*`)}`, {
    method: 'DELETE',
    headers: supabaseHeaders(),
  });
  if (!res.ok) throw new Error(`Supabase 삭제 실패 (${res.status})`);
}

window.storage = {
  async get(key) {
    const value = await supabaseGetOne(key);
    return { key, value, shared: false };
  },
  async set(key, value) {
    await supabaseSetOne(key, value);
    return { key, value, shared: false };
  },
  async delete(key) {
    await supabaseDeleteOne(key);
    return { key, deleted: true, shared: false };
  },
  async list(prefix = '') {
    const keys = await supabaseListKeys(prefix);
    return { keys, prefix, shared: false };
  },
  // 대량 조회 전용 확장 메서드 (표준 인터페이스는 아니지만, 로딩 속도를
  // 위해 이 파일 안에서만 특별히 사용한다).
  async getAllByPrefix(prefix) {
    const rows = await supabaseGetAllByPrefix(prefix);
    return { rows, shared: false };
  },
};

// ---------------------------------------------------------------
// JSONBin → Supabase 1회성 이전
// 예전에 JSONBin에 저장해둔 데이터를 Supabase로 옮긴다. 이전이 끝나면
// 표시(마커)를 남겨서 이후에는 JSONBin을 다시 건드리지 않는다.
// 이미 옮겨진 항목은 건너뛰므로 중간에 끊겨도 이어서 진행되고,
// JSONBin의 남은 요청 수도 최소한으로만 쓴다.
// ---------------------------------------------------------------
const MIGRATION_MARKER_KEY = '__migrated_from_jsonbin__';
const MIGRATION_LOCAL_FLAG = 'mc-migrated-v1';

function shouldMigrateKey(key) {
  return key.startsWith('movie:') || key === 'settings' || key === 'custom-formats';
}

async function migrateFromJsonbinIfNeeded() {
  try { if (localStorage.getItem(MIGRATION_LOCAL_FLAG) === '1') return; } catch (e) {}

  const marker = await supabaseGetOne(MIGRATION_MARKER_KEY).catch(() => null);
  if (marker) {
    try { localStorage.setItem(MIGRATION_LOCAL_FLAG, '1'); } catch (e) {}
    return;
  }

  const legacyIndex = await loadIndex(); // 실패하면 예외 → 이전 없이 넘어가고 다음 로딩 때 다시 시도
  const legacyKeys = Object.keys(legacyIndex || {}).filter(shouldMigrateKey);

  if (legacyKeys.length > 0) {
    const existing = new Set(await supabaseListKeys(''));
    const todo = legacyKeys.filter(k => !existing.has(k));
    const total = legacyKeys.length;
    let done = total - todo.length;
    const emit = () => window.dispatchEvent(new CustomEvent('mc-migration-progress', { detail: { total, done } }));
    emit();

    let failed = 0;
    const buffer = [];
    const flush = async () => {
      if (!buffer.length) return;
      const rows = buffer.splice(0, buffer.length);
      await supabaseSetMany(rows);
    };

    await runInBatches(todo, async key => {
      try {
        let value = await readBin(legacyIndex[key]);
        if (typeof value !== 'string') value = JSON.stringify(value);
        buffer.push({ key, value });
        if (buffer.length >= 50) await flush();
      } catch (e) {
        failed += 1;
        console.warn('이전 실패:', key, e);
      }
      done += 1;
      emit();
    }, 4);
    await flush();

    if (failed > 0) {
      // 일부가 실패했으면 마커를 남기지 않는다. 다음 로딩 때 실패한 것만 이어서 시도한다.
      throw new Error(`이전 중 ${failed}건 실패`);
    }
  }

  try { localStorage.setItem(MIGRATION_LOCAL_FLAG, '1'); } catch (e) {}
}

// ---------------------------------------------------------------
// Supabase 기반 자동 백업
// 가벼운 메타 정보(`backupmeta:`)와 무거운 본문(`backup:{id}:{n}`)을 나눠 저장한다.
// 목록을 볼 때는 메타만 읽고, 복구할 때만 본문을 읽는다.
// 저장할 때마다 만들면 낭비라서, 마지막 백업 후 일정 시간 안에는 새로 만들지 않는다.
// ---------------------------------------------------------------
const BACKUP_META_PREFIX = 'backupmeta:';
const BACKUP_CHUNK_SIZE = 300;
const BACKUP_MIN_INTERVAL_MS = 5 * 60 * 1000;
let _lastBackupAt = 0;

async function createAutomaticBackup({ movies, customFormats, settings, reason = '저장' }) {
  const now = Date.now();
  if (now - _lastBackupAt < BACKUP_MIN_INTERVAL_MS) return null;
  _lastBackupAt = now;

  const job = _backupQueue.then(async () => {
    try {
      const id = makeBackupId();
      const createdAt = new Date().toISOString();
      const meta = {
        id, createdAt, reason,
        count: movies.length,
        customFormats: Array.isArray(customFormats) ? customFormats : [],
        settings: settings || DEFAULT_SETTINGS,
      };

      // 본문(영화 목록)을 먼저 저장하고, 메타는 맨 마지막에 저장한다 (본문 없는 메타가 생기지 않도록).
      const chunkRows = [];
      for (let i = 0; i < movies.length; i += BACKUP_CHUNK_SIZE) {
        chunkRows.push({
          key: `${BACKUP_PREFIX}${id}:${String(i / BACKUP_CHUNK_SIZE).padStart(4, '0')}`,
          value: JSON.stringify(movies.slice(i, i + BACKUP_CHUNK_SIZE)),
        });
      }
      if (chunkRows.length) await supabaseSetMany(chunkRows, 5);
      await supabaseSetOne(`${BACKUP_META_PREFIX}${id}`, JSON.stringify(meta));

      // 오래된 백업 정리 (실패해도 무시)
      try {
        const metaKeys = (await supabaseListKeys(BACKUP_META_PREFIX)).sort();
        const old = metaKeys.slice(0, Math.max(0, metaKeys.length - BACKUP_LIMIT));
        for (const mk of old) {
          const oldId = mk.slice(BACKUP_META_PREFIX.length);
          await supabaseDeleteByPrefix(`${BACKUP_PREFIX}${oldId}:`).catch(() => {});
          await supabaseDeleteOne(mk).catch(() => {});
        }
      } catch (_) {}

      return { id, createdAt, reason, count: meta.count, customFormats: meta.customFormats, settings: meta.settings };
    } catch (e) {
      _lastBackupAt = 0; // 실패했으면 다음 저장 때 바로 다시 시도할 수 있게 한다.
      throw e;
    }
  });
  _backupQueue = job.catch(() => {});
  return job;
}

async function listAutomaticBackups() {
  const rows = await supabaseGetAllByPrefix(BACKUP_META_PREFIX);
  const result = rows
    .map(r => { try { return JSON.parse(r.value); } catch (_) { return null; } })
    .filter(meta => meta && meta.id);
  return result.sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt))).slice(0, BACKUP_LIMIT);
}

async function restoreAutomaticBackup(backup) {
  const chunkRows = await supabaseGetAllByPrefix(`${BACKUP_PREFIX}${backup.id}:`);
  const restored = [];
  chunkRows.sort((a, b) => a.key.localeCompare(b.key)).forEach(r => {
    const list = JSON.parse(r.value);
    if (Array.isArray(list)) restored.push(...list);
  });
  if (restored.length === 0 && backup.count > 0) {
    throw new Error('백업 본문을 찾지 못했어요');
  }

  // 안전한 순서: 백업 내용을 먼저 저장(덮어쓰기)하고, 그 뒤에 백업에 없는 현재 영화만 지운다.
  await supabaseSetMany(restored.map(m => ({ key: `movie:${m.id}`, value: JSON.stringify(m) })));
  const restoredKeys = new Set(restored.map(m => `movie:${m.id}`));
  const currentKeys = await supabaseListKeys('movie:');
  const extra = currentKeys.filter(k => !restoredKeys.has(k));
  for (let i = 0; i < extra.length; i += 20) {
    await Promise.all(extra.slice(i, i + 20).map(k => supabaseDeleteOne(k)));
  }
  await window.storage.set('custom-formats', JSON.stringify(backup.customFormats || []));
  await window.storage.set('settings', JSON.stringify(backup.settings || DEFAULT_SETTINGS));
  return restored;
}

const DISC_CONTENT_TYPES = [
  { key: 'main', label: '본편', short: '본편' },
  { key: 'special', label: 'Special Features', short: '스페셜' },
  { key: 'ost', label: 'OST', short: 'OST' },
  { key: 'music', label: '음악', short: '음악' },
];
const contentLabel = k => (DISC_CONTENT_TYPES.find(t => t.key === k) || {}).label || k;
const contentShort = k => (DISC_CONTENT_TYPES.find(t => t.key === k) || {}).short || k;
const hasLoc = l => !!l && (!!l.individual || !!l.categoryName);
function getLocations(m) {
  if (Array.isArray(m.locations) && m.locations.length) return m.locations.filter(hasLoc);
  return hasLoc(m.physicalLocation) ? [{ ...m.physicalLocation, disc: 1, contents: ['main'], note: '' }] : [];
}
function discBadgeInfo(l, total) {
  const c = l.contents || [];
  if (!c.length) return null;
  if (total <= 1 && c.length === 1 && c[0] === 'main') return null;
  return {
    text: `Disc ${l.disc || 1} · ${c.map(contentShort).join('·')}`,
    title: `Disc ${l.disc || 1} · ${c.map(contentLabel).join(', ')}${l.note ? ` (${l.note})` : ''}`,
  };
}
function DiscBadge({ loc, total, tile }) {
  const info = discBadgeInfo(loc, total);
  if (!info) return null;
  return (
    <span className={`disc-badge${tile ? ' disc-badge--tile' : ''}`} title={info.title}>
      <DiscIcon size={tile ? 10 : 11} />{info.text}
    </span>
  );
}
function locationText(l) {
  return l.individual
    ? '개별 보관'
    : `${l.section} · (${l.categoryNumber}) ${l.categoryName}${l.itemNumber ? ` · ${l.itemNumber}번` : ''}`;
}

const catKey = l => `${l.section}|${l.categoryName}|${String(l.categoryNumber ?? '')}`;
function findOrphanGroups(movies, settings) {
  const valid = new Set(settings.categories.map(c => `${c.section}|${c.name}|${String(c.number ?? '')}`));
  const groups = new Map();
  movies.forEach(m => {
    const seen = new Set();
    getLocations(m).forEach(l => {
      if (l.individual) return;
      const key = catKey(l);
      if (valid.has(key)) return;
      if (!groups.has(key)) {
        groups.set(key, { key, section: l.section, categoryName: l.categoryName, categoryNumber: l.categoryNumber ?? '', titles: [], ids: [] });
      }
      if (seen.has(key)) return;
      seen.add(key);
      const g = groups.get(key);
      g.titles.push(m.titleKr || '제목 없음');
      g.ids.push(m.id);
    });
  });
  return Array.from(groups.values());
}
function suggestCategory(g, categories) {
  const num = String(g.categoryNumber ?? '');
  const pick = arr => (arr.length === 1 ? arr[0] : null);
  return pick(categories.filter(c => c.name === g.categoryName && String(c.number) === num))
    || pick(categories.filter(c => c.section === g.section && String(c.number) === num))
    || pick(categories.filter(c => c.section === g.section && c.name === g.categoryName))
    || null;
}
function LocationRepairModal({ groups, categories, onClose, onApply, saving }) {
  const [choice, setChoice] = useState(() => {
    const init = {};
    groups.forEach(g => { const sug = suggestCategory(g, categories); init[g.key] = sug ? sug.id : ''; });
    return init;
  });
  const sortedCats = categories.slice().sort((a, b) => String(a.section).localeCompare(String(b.section), 'ko') || a.number - b.number);
  const selectedCount = groups.filter(g => choice[g.key]).length;
  return (
    <div className="drawer-backdrop" onClick={onClose}>
      <div className="drawer" onClick={e => e.stopPropagation()}>
        <div className="drawer__head">
          <h2>영화 위치 복구</h2>
          <button type="button" className="icon-btn" onClick={onClose}><X size={18} /></button>
        </div>
        <div className="drawer__body">
          <p className="hint-text-small">카테고리 이름이나 번호를 바꾸기 전에 등록된 영화들이에요. 옛 위치별로 묶어서 보여드려요. 오른쪽에서 지금 쓰는 카테고리를 고르면 그 카테고리 칸으로 한꺼번에 옮겨져요. 칸 번호는 그대로 유지돼요.</p>
          {groups.length === 0 && <p className="hint-text-small">복구할 영화가 없어요.</p>}
          {groups.map(g => (
            <div key={g.key} className="repair-row">
              <div className="repair-from">
                <b>{g.section} › ({String(g.categoryNumber)}) {g.categoryName}</b>
                <span>{g.ids.length}편 · {g.titles.slice(0, 3).join(', ')}{g.titles.length > 3 ? ' 외' : ''}</span>
              </div>
              <select value={choice[g.key] || ''} onChange={e => setChoice(prev => ({ ...prev, [g.key]: e.target.value }))}>
                <option value="">복구할 카테고리 선택 (선택 안 하면 그대로 둠)</option>
                {sortedCats.map(c => (
                  <option key={c.id} value={c.id}>{c.section} › ({c.number}) {c.name}</option>
                ))}
              </select>
            </div>
          ))}
        </div>
        <div className="drawer__foot">
          <div className="drawer__foot-actions">
            <button type="button" className="btn btn--ghost" onClick={onClose}>닫기</button>
            <button
              type="button"
              className="btn btn--primary"
              disabled={saving || selectedCount === 0}
              onClick={() => onApply(groups.filter(g => choice[g.key]).map(g => ({ from: g, to: categories.find(c => c.id === choice[g.key]) })))}
            >
              {selectedCount}개 위치 복구하기
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

function migrateSettings(raw) {
  if (!raw) return DEFAULT_SETTINGS;

  // 이미 최신 구조 (섹션이 {id, number, name} 객체 배열)
  if (raw.sections && Array.isArray(raw.categories) && raw.sections.length && typeof raw.sections[0] === 'object' && 'number' in raw.sections[0]) {
    return raw;
  }

  let sectionNames = [];
  let categories = [];

  if (raw.sections && Array.isArray(raw.categories)) {
    // 섹션에 번호가 붙기 전 버전 (섹션이 문자열 배열)
    sectionNames = raw.sections;
    categories = raw.categories;
  } else if (raw.sections && raw.categoriesBySection) {
    // 그 이전 버전: categoriesBySection 중첩 객체 구조
    sectionNames = raw.sections;
    for (const section of raw.sections) {
      for (const c of raw.categoriesBySection[section] || []) {
        categories.push({ id: c.id || uid(), section, number: c.number, name: c.name });
      }
    }
  } else if (raw.zoneName) {
    // 가장 이전 버전: zoneName + 문자열 배열 categories
    sectionNames = [raw.zoneName];
    categories = (raw.categories || []).map((name, i) => ({ id: uid(), section: raw.zoneName, number: i + 1, name }));
  } else {
    return DEFAULT_SETTINGS;
  }

  const sections = sectionNames.map((name, i) => ({ id: uid(), number: i + 1, name }));
  return { themeId: raw.themeId || 'filmCatalog', sections, categories };
  return DEFAULT_SETTINGS;
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function stripVodPrefix(f) {
  return f.startsWith('VOD-') ? f.slice(4) : f;
}

// 시리즈 표시는 시리즈마다 다른 색을 쓰지 않고, 테마의 포인트 컬러(gold)로 통일한다.
// 랜덤 색상은 가끔 테마와 안 어울리는 탁한 색이 나올 수 있어서, 항상 조화로운 테마색을 쓴다.
function seriesColor() {
  return 'var(--gold)';
}

// 같은 이름을 쓰는 다른 영화가 있으면 그 시리즈 id를 재사용하고, 없으면 기존 id를 유지하거나 새로 발급한다.
function resolveSeriesId(existingId, name, ownId, movies) {
  const trimmed = name.trim();
  if (!trimmed) return null;
  const match = movies.find(m => m.id !== ownId && m.seriesName === trimmed && m.seriesId);
  if (match) return match.seriesId;
  return existingId || uid();
}

// 카드형/진열장 공용: 현재 필터/정렬을 거친 목록의 순서는 최대한 유지하되,
// 같은 시리즈에 속한 영화는 항상 한데 묶어서 배치한다.
// expandedSeries에 없는 시리즈는 'series-bundle' 항목 하나로 접혀서 표시되고,
// expandedSeries에 있는 시리즈는 'series-header' + 개별 'movie' 항목들로 펼쳐진다.
function buildDisplayEntries(list, expandedSeries) {
  const seen = new Set();
  const entries = [];
  for (const m of list) {
    if (seen.has(m.id)) continue;
    if (m.seriesId) {
      const group = list
        .filter(x => x.seriesId === m.seriesId)
        .sort((a, b) => (Number(a.seriesOrder) || 0) - (Number(b.seriesOrder) || 0));
      group.forEach(g => seen.add(g.id));
      if (expandedSeries.has(m.seriesId)) {
        // 펼친 시리즈는 하나의 독립 블록으로 묶는다.
        // 뒤의 일반 영화가 같은 줄에 끼어들지 않게 하기 위함이다.
        entries.push({
          type: 'series-expanded',
          seriesId: m.seriesId,
          seriesName: m.seriesName,
          count: group.length,
          movies: group,
        });
      } else {
        entries.push({ type: 'series-bundle', seriesId: m.seriesId, seriesName: m.seriesName, movies: group });
      }
    } else {
      seen.add(m.id);
      entries.push({ type: 'movie', movie: m });
    }
  }
  return entries;
}

function clampDec(n, min, max) {
  const v = parseFloat(n);
  if (isNaN(v)) return '';
  return Math.round(Math.min(max, Math.max(min, v)) * 100) / 100;
}

function clamp(n, min, max) {
  const v = parseInt(n, 10);
  if (isNaN(v)) return '';
  return Math.min(max, Math.max(min, v));
}

function parseBulkLine(raw) {
  const line = raw.trim();
  if (!line) return null;
  const re = /^(?:\d+\.\s*)?(.+?)\(([^)]+)\)_([^_]+)_([^_]+)_(\d{4})_([^_]+)_([^#]+?)\s*(#.*)?$/;
  const m = line.match(re);
  if (!m) return { error: line };
  const [, titleKr, titleOriginal, country, genre, year, director, actorsRaw, tagsRaw] = m;
  const actors = actorsRaw.split(',').map(s => s.trim()).filter(Boolean);
  const hashtags = tagsRaw ? Array.from(tagsRaw.matchAll(/#(\S+)/g)).map(x => x[1]) : [];
  return {
    ok: true,
    data: {
      id: uid(),
      titleKr: titleKr.trim(),
      titleOriginal: titleOriginal.trim(),
      countries: country.trim() ? [country.trim()] : [],
      genres: genre.trim() ? [genre.trim()] : [],
      year: year.trim(),
      runtime: '',
      ageRating: '',
      synopsis: '',
      director: director.trim(),
      actors,
      hashtags,
      status: 'owned',
      formats: [],
      physicalLocation: null,
      posterUrl: '',
      rating: null,
      seriesId: null,
      seriesName: '',
      seriesOrder: '',
      seriesUnofficial: false,
      seriesRemake: false,
      notes: '',
      createdAt: Date.now(),
    },
  };
}

function parseListInput(raw, splitOnHash) {
  if (!raw) return [];
  const parts = splitOnHash ? raw.split(/[,#]+/) : raw.split(',');
  return parts.map(s => s.trim()).filter(Boolean);
}

const IMGBB_API_KEY = 'c5dd68399246ec0708ba5b531e9b5078';

// 이미지를 imgbb에 실제로 업로드해서 영구 호스팅 URL을 받아온다.
// source가 문자열(URL)이면 imgbb 서버가 직접 그 주소에서 가져가 호스팅하고,
// File/Blob이면 그대로 업로드한다. 반환되는 건 imgbb의 짧고 영구적인 이미지 주소라서
// JSONBin에는 이 짧은 URL만 저장되고, 원본 출처 사이트가 나중에 사라져도 안전하다.
async function uploadToImgbb(source) {
  const formData = new FormData();
  formData.append('image', source);
  const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
    method: 'POST',
    body: formData,
  });
  const data = await res.json();
  if (!data || !data.success) {
    throw new Error(data?.error?.message || '이미지 업로드에 실패했어요');
  }
  return data.data.url || data.data.display_url;
}

function Poster({ url, size = 'card' }) {
  const [broken, setBroken] = useState(false);
  useEffect(() => { setBroken(false); }, [url]);
  if (!url || broken) {
    return (
      <div className={`poster poster--${size} poster--empty`}>
        <Film size={size === 'card' ? 18 : 22} />
      </div>
    );
  }
  return (
    <div className={`poster poster--${size}`}>
      <img src={url} alt="" onError={() => setBroken(true)} />
    </div>
  );
}

// 반개 단위 별점. value가 null/undefined면 미감상 상태로 다섯 개가 전부 빈 별(테두리)로만 보인다.
// readOnly=false면 별을 반쪽씩 클릭해 0.5 단위로 평점을 매길 수 있다.
function StarRating({ value, onChange, size = 15, readOnly = false }) {
  const [hover, setHover] = useState(null);
  const display = hover != null ? hover : (value || 0);
  const pct = Math.max(0, Math.min(100, (display / 5) * 100));

  if (readOnly) {
    const v = Number(value);
    if (!(v > 0)) return null;
    const shown = Math.min(5, v);
    return (
      <span className="star-rating" style={{ fontSize: size }} title={`${shown} / 5`}>
        {[0, 1, 2, 3, 4].map(i => {
          const frac = Math.max(0, Math.min(1, shown - i));
          return (
            <span key={i} className="star-ro">
              <span className="star-ro__bg">☆</span>
              <span className="star-ro__fill" style={{ width: `${frac * 100}%` }}>★</span>
            </span>
          );
        })}
      </span>
    );
  }

  return (
    <span className="star-rating star-rating--editable" style={{ fontSize: size }} onMouseLeave={() => setHover(null)}>
      <span className="star-rating__bg">☆☆☆☆☆</span>
      <span className="star-rating__fill" style={{ width: `${pct}%` }}>★★★★★</span>
      <span className="star-rating__hits">
        {[0, 1, 2, 3, 4].map(i => (
          <span key={i} className="star-rating__hit-star">
            <button type="button" onMouseEnter={() => setHover(i + 0.5)} onClick={() => onChange(i + 0.5)} />
            <button type="button" onMouseEnter={() => setHover(i + 1)} onClick={() => onChange(i + 1)} />
          </span>
        ))}
      </span>
    </span>
  );
}

  }

  function handleSave(arg) {
    const addNext = arg === true;
    if (!titleKr.trim()) return;
    let formats = [...selectedFormats];
    const custom = customText.trim();
    if (custom) {
      formats.push(custom);
      onAddCustomFormat(custom);
    }
    const sectionMode = locMode === 'section' && locSection && locCategoryName;
    if (hasPhysical && sectionMode) {
      const problemLines = slotProblems
        .map((p, i) => p ? `Disc ${i + 1} (${plannedSlots[i]}번): ${p}` : '')
        .filter(Boolean);
      if (problemLines.length > 0) {
        const detail = `${locRegion} / ${locSection} / (${locCategoryNumber}) ${locCategoryName}`;
        if (!window.confirm(`⚠️ 칸 번호 확인\n${detail}\n\n${problemLines.join('\n')}\n\n그래도 저장할까요?`)) return;
      }
    }
    const finalLocations = !hasPhysical ? []
      : locMode === 'individual' ? [{ individual: true, disc: 1, contents: ['main'], note: '' }]
      : sectionMode ? discPlan.map((d, i) => ({
          section: locSection, categoryName: locCategoryName, categoryNumber: locCategoryNumber,
          itemNumber: plannedSlots[i], disc: i + 1, contents: d.contents, note: d.note.trim(),
          ...(d.shared ? { shared: true } : {}),
        }))
      : [];
    const physicalLocation = finalLocations[0]
      ? (({ disc, contents, note, shared, ...rest }) => rest)(finalLocations[0])
      : null;
    const trimmedSeriesName = seriesName.trim();
    const seriesId = resolveSeriesId(initial?.seriesId || seed?.seriesId || null, trimmedSeriesName, initial?.id, movies);
    onSave({
      id: initial?.id || uid(),
      titleKr: titleKr.trim(),
      titleOriginal: titleOriginal.trim(),
      countries: parseListInput(countryRaw, false),
      genres: parseListInput(genresRaw, false),
      year: year.trim(),
      runtime: runtime,
      ageRating: ageRating.trim(),
      synopsis: synopsis.trim(),
      director: director.trim(),
      actors: parseListInput(actorsRaw, false),
      status,
      formats,
      physicalLocation,
      locations: finalLocations,
      favorite: !!initial?.favorite,
      posterUrl,
      rating,
      seriesId,
      seriesName: trimmedSeriesName,
      seriesOrder: trimmedSeriesName ? seriesOrder : '',
      seriesUnofficial: trimmedSeriesName ? seriesUnofficial : false,
      seriesRemake: trimmedSeriesName ? seriesRemake : false,
      hashtags: parseListInput(hashtagsRaw, true),
      notes: notes.trim(),
      createdAt: initial?.createdAt || Date.now(),
    }, { addNext });
  }

  return (
    <div className="drawer-backdrop" onClick={onCancel}>
      <div className="drawer" onClick={e => e.stopPropagation()}>
        <div className="drawer__head">
          <h2>{isEdit ? '영화 정보 수정' : '새 영화 추가'}</h2>
          <button type="button" className="icon-btn" onClick={onCancel}><X size={18} /></button>
        </div>

        <div className="drawer__body">
          <div className="field">
            <span>포스터 이미지</span>
            <div className="poster-editor">
              <Poster url={posterUrl} size="lg" />
              {posterUrl && (
                <button type="button" className="btn btn--ghost btn--sm" onClick={() => setPosterUrl('')}>이미지 제거</button>
              )}
            </div>

            <span className="sub-label">1) URL로 불러오기</span>
            <div className="field-row">
              <input value={manualUrlDraft} onChange={e => setManualUrlDraft(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleApplyManualUrl()} placeholder="이미지 URL 붙여넣기" />
              <button type="button" className="btn btn--primary btn--sm" onClick={handleApplyManualUrl} disabled={!manualUrlDraft.trim() || posterBusy}>
                {posterBusy ? <Loader2 size={14} className="spin" /> : null}
                {posterBusy ? '적용 중...' : '적용'}
              </button>
            </div>

            <span className="sub-label">2) 파일로 직접 업로드</span>
            <label className="file-upload-btn">
              {posterBusy ? '처리 중...' : '이미지 파일 선택'}
              <input type="file" accept="image/*" onChange={handleFileUpload} disabled={posterBusy} />
            </label>

            {posterError && <p className="field-error">{posterError}</p>}
          </div>

          <label className="field">
            <span>제목 (한글) *</span>
            <input value={titleKr} onChange={e => setTitleKr(e.target.value)} placeholder="예: 투어리스트" />
          </label>
          <label className="field">
            <span>원제</span>
            <input value={titleOriginal} onChange={e => setTitleOriginal(e.target.value)} placeholder="예: The Tourist" />
          </label>
          <div className="field-row">
            <label className="field">
              <span>제작국가 (쉼표로 구분, 여러 개 가능)</span>
              <input value={countryRaw} onChange={e => setCountryRaw(e.target.value)} placeholder="예: 미국, 영국" />
            </label>
            <label className="field field--small">
              <span>개봉년도</span>
              <input value={year} onChange={e => setYear(e.target.value)} placeholder="2010" />
            </label>
          </div>
          <div className="field-row">
            <label className="field field--small">
              <span>러닝타임 (분)</span>
              <input type="number" value={runtime} onChange={e => setRuntime(e.target.value)} placeholder="120" />
            </label>
            <label className="field">
              <span>연령등급</span>
              <input list="age-rating-options" value={ageRating} onChange={e => setAgeRating(e.target.value)} placeholder="예: 15세 이상 관람가" />
              <datalist id="age-rating-options">
                <option value="전체 관람가" />
                <option value="12세 이상 관람가" />
                <option value="15세 이상 관람가" />
                <option value="청소년 관람불가" />
              </datalist>
            </label>
          </div>
          <label className="field">
            <span>감독</span>
            <input value={director} onChange={e => setDirector(e.target.value)} placeholder="예: 플로리안 헨켈 폰 도너스마르크" />
          </label>
          <label className="field">
            <span>장르 (쉼표로 구분, 여러 개 가능)</span>
            <input value={genresRaw} onChange={e => setGenresRaw(e.target.value)} placeholder="예: 액션, 스릴러" />
          </label>
          <label className="field">
            <span>배우 (쉼표로 구분)</span>
            <input value={actorsRaw} onChange={e => setActorsRaw(e.target.value)} placeholder="안젤리나 졸리, 조니 뎁" />
          </label>
          <label className="field">
            <span>줄거리</span>
            <textarea value={synopsis} onChange={e => setSynopsis(e.target.value)} rows={4} placeholder="영화 줄거리를 적어두세요" />
          </label>

          <div className="field">
            <span>보유 상태</span>
            <div className="segmented">
              <button type="button" className={status === 'owned' ? 'is-active' : ''} onClick={() => setStatus('owned')}>보유</button>
              <button type="button" className={status === 'wishlist' ? 'is-active' : ''} onClick={() => setStatus('wishlist')}>미보유</button>
            </div>
          </div>

          <div className="field">
            <span>내 평점</span>
            <div className="rating-row">
              <StarRating value={rating} onChange={setRating} size={22} />
              {rating != null && <button type="button" className="rating-row__clear" onClick={() => setRating(null)}>취소</button>}
            </div>
          </div>

          <div className="field">
            <span>시리즈 (비워두면 시리즈 없음)</span>
            <div className="field-row">
              <input
                list="series-name-options"
                value={seriesName}
                onChange={e => setSeriesName(e.target.value)}
                placeholder="예: 금발이 너무해"
              />
              <input
                className="field--small"
                type="number"
                value={seriesOrder}
                onChange={e => setSeriesOrder(e.target.value)}
                placeholder="순번"
              />
            </div>
            <datalist id="series-name-options">
              {existingSeriesNames.map(n => <option key={n} value={n} />)}
            </datalist>
            {seriesName.trim() && (
              <>
                <label className="checkbox-row">
                  <input type="checkbox" checked={seriesUnofficial} onChange={e => setSeriesUnofficial(e.target.checked)} />
                  비공식 시리즈 (국내 마케팅용 등으로 이름만 붙은 별개 작품)
                </label>
                <label className="checkbox-row">
                  <input type="checkbox" checked={seriesRemake} onChange={e => setSeriesRemake(e.target.checked)} />
                  리메이크 (정식 시리즈는 아니지만 리메이크작이라 함께 묶어두기)
                </label>
              </>
            )}
          </div>

          <div className="field">
            <span>매체 / 구매 플랫폼</span>
            <div className="format-grid">
              {formatOptions.map(f => (
                <label key={f} className={`format-check${selectedFormats.includes(f) ? ' is-checked' : ''}`}>
                  <input type="checkbox" checked={selectedFormats.includes(f)} onChange={() => toggleFormat(f)} />
                  {f}
                </label>
              ))}
            </div>
            <input
              className="custom-format-input"
              value={customText}
              onChange={e => setCustomText(e.target.value)}
              placeholder="목록에 없는 매체는 여기에 직접 입력 (예: 4K UHD)"
            />
          </div>

          {hasPhysical && (
            <div className="field">
              <div className="field-row-between">
                <span>보관 위치</span>
                {locMode === 'section' && <button type="button" className="link-btn" onClick={() => onManageSection(locSection)}>편집</button>}
              </div>

              <div className="segmented">
                <button type="button" className={locMode === 'section' ? 'is-active' : ''} onClick={() => setLocMode('section')}>섹션에 정리</button>
                <button type="button" className={locMode === 'individual' ? 'is-active' : ''} onClick={() => setLocMode('individual')}>개별 보관</button>
              </div>

              {locMode === 'individual' && (
                <p className="hint-text-small">섹션·카테고리로 묶지 않고 따로 보관 중인 매체로 표시돼요.</p>
              )}

              {locMode === 'section' && (
                <>
                  <span className="sub-label">구분</span>
                  <div className="segmented">
                    {REGIONS.map(r => (
                      <button key={r} type="button" className={locRegion === r ? 'is-active' : ''} onClick={() => changeRegion(r)}>{r}</button>
                    ))}
                  </div>

                  <span className="sub-label">섹션</span>
                  {newSectionMode ? (
                    <input
                      autoFocus
                      value={newSectionText}
                      onChange={e => setNewSectionText(e.target.value)}
                      onKeyDown={e => e.key === 'Enter' && confirmNewSection()}
                      onBlur={confirmNewSection}
                      placeholder="새 섹션 이름 (예: 판타지, 로맨틱 코미디)"
                    />
                  ) : (
                    <select value={locSection} onChange={e => {
                      if (e.target.value === '__new__') setNewSectionMode(true);
                      else { setLocSection(e.target.value); setLocCategoryName(''); setLocCategoryNumber(''); }
                    }}>
                      {!regionSecs.some(s => s.name === locSection) && <option value="">섹션 선택</option>}
                      {regionSecs.map(s => (
                        <option key={s.id} value={s.name}>({s.number}) {s.name}</option>
                      ))}
                      <option value="__new__">+ 새 섹션 추가</option>
                    </select>
                  )}

                  <span className="sub-label">카테고리</span>
                  {newCategoryMode ? (
                    <div className="field-row">
                      <input
                        className="field--small"
                        type="number"
                        min={0.1}
                        max={99}
                        step="any"
                        value={newCategoryNumber}
                        onChange={e => setNewCategoryNumber(e.target.value)}
                        placeholder={String(suggestedCategoryNumber || '')}
                      />
                      <input
                        autoFocus
                        value={newCategoryName}
                        onChange={e => setNewCategoryName(e.target.value)}
                        onKeyDown={e => e.key === 'Enter' && confirmNewCategory()}
                        placeholder="새 카테고리 이름 (예: 80년대 영화)"
                      />
                      <button type="button" className="btn btn--ghost btn--sm" onClick={confirmNewCategory}>추가</button>
                    </div>
                  ) : (
                    <select
                      value={categoriesForSection.find(c => c.name === locCategoryName && String(c.number) === String(locCategoryNumber))?.id || ''}
                      onChange={e => {
                        if (e.target.value === '__new__') { setNewCategoryMode(true); return; }
                        const cat = categoriesForSection.find(c => c.id === e.target.value);
                        setLocCategoryName(cat ? cat.name : '');
                        setLocCategoryNumber(cat ? cat.number : '');
                      }}
                    >
                      <option value="">카테고리 선택</option>
                      {categoriesForSection.sort((a, b) => a.number - b.number).map(c => (
                        <option key={c.id} value={c.id}>({c.number}) {c.name}</option>
                      ))}
                      <option value="__new__">+ 새 카테고리 추가</option>
                    </select>
                  )}
                  {selectedCatDesc && <p className="hint-text-small">{selectedCatDesc}</p>}

                  <span className="sub-label">번호 (최대 24)</span>
                  <input
                    className="field--small"
                    type="number"
                    min={1}
                    max={24}
                    value={locItemNumber}
                    onChange={e => setLocItemNumber(e.target.value)}
                    onBlur={e => e.target.value && setLocItemNumber(clamp(e.target.value, 1, 24))}
                    placeholder={suggestedItemNumber ? `추천 ${suggestedItemNumber}번` : '번호'}
                  />
                  <span className="sub-label">디스크 연속 등록 (위 번호가 Disc 1, 이후 칸이 순서대로 이어져요)</span>
                  {discPlan.map((d, i) => (
                    <div key={i} className="disc-row">
                      <div className="field-row-between">
                        <span>Disc {i + 1} → <b>{plannedSlots[i]}번</b>{slotProblems[i] && <b style={{ color: '#a33' }}> ({slotProblems[i]})</b>}</span>
                        <span className="field-row">
                          {i > 0 && (
                            <input className="field--small" type="number" min={1} max={24} value={d.slot}
                              onChange={e => updatePlanSlot(i, e.target.value)}
                              placeholder={`자동 ${plannedSlots[i]}`} title="비워두면 앞 디스크 다음 번호로 자동 지정" />
                          )}
                          {discPlan.length > 1 && <button type="button" className="link-btn" onClick={() => removePlanDisc(i)}>삭제</button>}
                        </span>
                      </div>
                      <div className="segmented">
                        {DISC_CONTENT_TYPES.map(t => (
                          <button key={t.key} type="button" className={d.contents.includes(t.key) ? 'is-active' : ''} onClick={() => togglePlanContent(i, t.key)}>{t.label}</button>
                        ))}
                      </div>
                      {d.contents.includes('special') && (
                        <input value={d.note} onChange={e => updatePlanNote(i, e.target.value)} placeholder="Special Features 상세 (메이킹, 코멘터리 등, 선택)" />
                      )}
                      <label className="checkbox-row">
                        <input type="checkbox" checked={!!d.shared} onChange={e => updatePlanShared(i, e.target.checked)} />
                        한 디스크에 다른 영화도 함께 수록
                      </label>
                      {d.shared && (
                        <p className="hint-text-small">같은 칸을 다른 영화도 함께 쓸 수 있어요. 아래 「저장하고 다음 영화 추가」를 누르면 이 칸이 이미 채워진 새 등록 창이 바로 열려서, 같은 디스크의 다음 영화를 이어서 넣을 수 있어요.</p>
                      )}
                    </div>
                  ))}
                  <button type="button" className="btn btn--ghost btn--sm" onClick={addPlanDisc}>+ 디스크 추가</button>
                  <p className="hint-text-small">섹션·카테고리·번호는 한 번 등록해두면 다음부터 목록에서 선택할 수 있어요. 이름을 고치거나 삭제하려면 위의 "편집" 버튼을 눌러주세요.</p>
                </>
              )}
            </div>
          )}

          <label className="field">
            <span>비고 해시태그 (쉼표로 구분, # 생략 가능)</span>
            <input value={hashtagsRaw} onChange={e => setHashtagsRaw(e.target.value)} placeholder="2010년대이탈리아베네치아, 인터폴추격, 신분위장" />
          </label>

          <label className="field">
            <span>메모</span>
            <textarea value={notes} onChange={e => setNotes(e.target.value)} rows={3} placeholder="추가로 남기고 싶은 내용" />
          </label>
        </div>

        <div className="drawer__foot">
          {isEdit && (
            confirmDelete ? (
              <div className="confirm-delete">
                <span>정말 삭제할까요?</span>
                <button type="button" className="btn btn--danger" onClick={() => onDelete(initial.id)} disabled={saving}>삭제</button>
                <button type="button" className="btn btn--ghost" onClick={() => setConfirmDelete(false)}>취소</button>
              </div>
            ) : (
              <button type="button" className="btn btn--ghost btn--danger-text" onClick={() => setConfirmDelete(true)}>
                <Trash2 size={15} /> 삭제
              </button>
            )
          )}
          <div className="drawer__foot-actions">
            <button type="button" className="btn btn--ghost" onClick={onCancel} disabled={saving}>취소</button>
            {locMode === 'section' && locSection && locCategoryName && discPlan.some(d => d.shared) && (
              <button type="button" className="btn btn--ghost" onClick={() => handleSave(true)} disabled={!titleKr.trim() || saving}>저장하고 다음 영화 추가</button>
            )}
            <button type="button" className="btn btn--primary" onClick={handleSave} disabled={!titleKr.trim() || saving}>{saving ? <><Loader2 size={14} className="spin" /> 저장 중...</> : '저장'}</button>
          </div>
        </div>
      </div>
    </div>
  );
}

// 보관함 빈 칸을 눌렀을 때, 영화 하나를 바로 추가할지 여러 개를 붙여넣을지 고르는 작은 선택창.
function SlotAddChoiceModal({ slot, onCancel, onChooseSingle, onChooseBulk }) {
  return (
    <div className="drawer-backdrop" onClick={onCancel}>
      <div className="slot-choice" onClick={e => e.stopPropagation()}>
        <div className="drawer__head">
          <h2>{slot.section} ({slot.categoryNumber}) {slot.categoryName} · {slot.itemNumber}번에 추가</h2>
          <button type="button" className="icon-btn" onClick={onCancel}><X size={18} /></button>
        </div>
        <div className="slot-choice__body">
          <button type="button" className="slot-choice__option" onClick={onChooseSingle}>
            <Plus size={18} />
            <div>
              <b>영화 한 편 추가</b>
              <p>이 칸에 영화 정보를 직접 입력해요.</p>
            </div>
          </button>
          <button type="button" className="slot-choice__option" onClick={onChooseBulk}>
            <Upload size={18} />
            <div>
              <b>목록 붙여넣기</b>
              <p>이 번호부터 이어서 여러 편을 한 번에 등록해요.</p>
            </div>
          </button>
        </div>
      </div>
    </div>
  );
}

function BulkImportModal({ onCancel, onConfirm, saving, locationSeed }) {
  const [text, setText] = useState('');
  const [sameDisc, setSameDisc] = useState(false);
  const [parsed, setParsed] = useState(null);

  function handlePreview() {
    const lines = text.split('\n');
    const ok = [];
    const errors = [];
    for (const line of lines) {
      const result = parseBulkLine(line);
      if (!result) continue;
      if (result.ok) ok.push(result.data);
      else errors.push(result.error);
    }
    if (locationSeed) {
      let n = Number(locationSeed.itemNumber);
      ok.forEach(m => {
        if (n <= 24) {
          m.physicalLocation = {
            section: locationSeed.section,
            categoryName: locationSeed.categoryName,
            categoryNumber: locationSeed.categoryNumber,
            itemNumber: n,
            ...(sameDisc ? { shared: true } : {}),
          };
          m.formats = ['DVD'];
          if (!sameDisc) n += 1;
        }
      });
    }
    setParsed({ ok, errors });
  }

  return (
    <div className="drawer-backdrop" onClick={onCancel}>
      <div className="drawer" onClick={e => e.stopPropagation()}>
        <div className="drawer__head">
          <h2>목록 붙여넣기로 추가</h2>
          <button type="button" className="icon-btn" onClick={onCancel}><X size={18} /></button>
        </div>
        <div className="drawer__body">
          {locationSeed && (
            <p className="hint-text">
              <b>{locationSeed.section} ({locationSeed.categoryNumber}) {locationSeed.categoryName}</b>의 <b>{locationSeed.itemNumber}번</b>
              {sameDisc ? '에 붙여넣은 영화를 전부 한 디스크로 묶어요.' : '부터 순서대로 번호가 매겨져요 (최대 24번까지).'}
            </p>
          )}
          {locationSeed && (
            <label className="checkbox-row">
              <input type="checkbox" checked={sameDisc} onChange={e => { setSameDisc(e.target.checked); setParsed(null); }} />
              한 디스크에 모두 수록 (체크 해제하면 한 칸에 한 편씩 뒤 칸까지 채워요)
            </label>
          )}
          <p className="hint-text">
            기존에 쓰던 형식 그대로 붙여넣으세요.<br />
            제목(원제)_국가_장르_년도_감독_배우1, 배우2 #태그1 #태그2
          </p>
          <textarea
            className="bulk-textarea"
            rows={10}
            value={text}
            onChange={e => { setText(e.target.value); setParsed(null); }}
            placeholder={'1. 투어리스트(The Tourist)_미국_액션 스릴러_2010_플로리안 헨켈 폰 도너스마르크_안젤리나 졸리, 조니 뎁 #2010년대이탈리아베네치아 #인터폴추격'}
          />
          <button type="button" className="btn btn--ghost" onClick={handlePreview} disabled={!text.trim()}>미리보기</button>

          {parsed && (
            <div className="preview-box">
              <p className="preview-summary">인식됨 {parsed.ok.length}건{parsed.errors.length > 0 ? ` · 인식 실패 ${parsed.errors.length}건` : ''}</p>
              {locationSeed && parsed.ok.some(m => !m.physicalLocation) && (
                <p className="field-error">24번을 넘어가는 항목은 보관 위치 없이 등록돼요. 등록 후 개별적으로 위치를 지정해주세요.</p>
              )}
              {parsed.ok.length > 0 && (
                <ul className="preview-list">
                  {parsed.ok.map(m => (
                    <li key={m.id}>
                      {m.titleKr} <span className="preview-meta">({m.year} · {m.director})</span>
                      {m.physicalLocation && <span className="preview-meta"> · {m.physicalLocation.itemNumber}번</span>}
                    </li>
                  ))}
                </ul>
              )}
              {parsed.errors.length > 0 && (
                <div className="preview-errors">
                  <p>형식을 인식하지 못한 줄이에요. 직접 추가하거나 형식을 맞춰 다시 붙여넣어 주세요.</p>
                  <ul>
                    {parsed.errors.map((e, i) => <li key={i}>{e}</li>)}
                  </ul>
                </div>
              )}
            </div>
          )}
        </div>
        <div className="drawer__foot">
          <div />
          <div className="drawer__foot-actions">
            <button type="button" className="btn btn--ghost" onClick={onCancel} disabled={saving}>취소</button>
            <button
              type="button"
              className="btn btn--primary"
              disabled={!parsed || parsed.ok.length === 0 || saving}
              onClick={() => onConfirm(parsed.ok)}
            >
              {saving ? <><Loader2 size={14} className="spin" /> 저장 중...</> : (parsed ? `${parsed.ok.length}건 추가하기` : '추가하기')}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

function SettingsModal({ settings, initialSection, onCancel, onChangeTheme, onAddSection, onUpdateSection, onRemoveSection, onAddCategory, onUpdateCategory, onRemoveCategory, onResetSettings, backups, onRefreshBackups, onRestoreBackup, backupBusy }) {
  const [settingsRegion, setSettingsRegion] = useState(() => {
    const sec = settings.sections.find(x => x.name === initialSection);
    return sec ? sectionRegion(sec) : DEFAULT_REGION;
  });
  const regionSections = sectionsOfRegion(settings, settingsRegion);
  const [activeSection, setActiveSection] = useState(
    initialSection || (sectionsOfRegion(settings, DEFAULT_REGION)[0] || {}).name || ''
  );
  const [newSection, setNewSection] = useState('');
  const [newCatName, setNewCatName] = useState('');
  const [newCatNumber, setNewCatNumber] = useState('');
  const [newCatDesc, setNewCatDesc] = useState('');
  const [resetConfirm, setResetConfirm] = useState(false);

  const categories = settings.categories.filter(c => c.section === activeSection).sort((a, b) => a.number - b.number);

  function handleAddSectionClick() {
    const v = newSection.trim();
    if (!v) return;
    const addedOk = onAddSection(v, settingsRegion);
    if (addedOk === false) return;
    setActiveSection(v);
    setNewSection('');
  }

  function handleAddCategoryClick() {
    const name = newCatName.trim();
    const usedNumbers = new Set(categories.map(c => c.number));
    let suggested = 1;
    while (usedNumbers.has(suggested) && suggested <= 20) suggested++;
    const number = clampDec(newCatNumber || suggested, 0.1, 99);
    if (!name || !number) return;
    onAddCategory(activeSection, number, name, newCatDesc.trim());
    setNewCatDesc('');
    setNewCatName('');
    setNewCatNumber('');
  }

  return (
    <div className="drawer-backdrop" onClick={onCancel}>
      <div className="drawer" onClick={e => e.stopPropagation()}>
        <div className="drawer__head">
          <h2>설정</h2>
          <button type="button" className="icon-btn" onClick={onCancel}><X size={18} /></button>
        </div>
        <div className="drawer__body">
          <div className="field">
            <span>색감 테마</span>
            <div className="theme-grid">
              {Object.entries(THEMES).map(([id, t]) => (
                <button
                  type="button"
                  key={id}
                  className={`theme-swatch${settings.themeId === id ? ' is-active' : ''}`}
                  onClick={() => onChangeTheme(id)}
                >
                  <span className="theme-swatch__dots">
                    <i style={{ background: t.vars['--bg-panel'] }} />
                    <i style={{ background: t.vars['--paper'] }} />
                    <i style={{ background: t.vars['--accent'] }} />
                  </span>
                  {t.name}
                </button>
              ))}
            </div>
          </div>

          <div className="field">
            <span>섹션 (예: 판타지, 시대별, 고전, 로맨틱 코미디) — 번호 1~50</span>
            <div className="segmented">
              {REGIONS.map(r => (
                <button
                  key={r}
                  type="button"
                  className={settingsRegion === r ? 'is-active' : ''}
                  onClick={() => {
                    setSettingsRegion(r);
                    const first = sectionsOfRegion(settings, r)[0];
                    setActiveSection(first ? first.name : '');
                  }}
                >
                  {r}
                </button>
              ))}
            </div>
            <div className="category-edit-list">
              {regionSections.length === 0 && <p className="hint-text-small">{settingsRegion}에는 아직 섹션이 없어요.</p>}
              {regionSections.map(s => (
                <div key={s.id} className={`category-edit-row${s.name === activeSection ? ' is-active-row' : ''}`}>
                  <button
                    type="button"
                    className="section-select-btn"
                    title="이 섹션의 카테고리 관리하기"
                    onClick={() => setActiveSection(s.name)}
                  >
                    {s.name === activeSection ? '●' : '○'}
                  </button>
                  <input
                    type="number" min={1} max={50}
                    className="field--small"
                    value={s.number}
                    onChange={e => {
                      const raw = e.target.value;
                      onUpdateSection(s.id, { number: raw === '' ? '' : clamp(raw, 1, 50) });
                    }}
                  />
                  <input
                    key={`sn-${s.id}-${s.name}`}
                    defaultValue={s.name}
                    onBlur={e => {
                      const v = e.target.value.trim();
                      if (!v) { e.target.value = s.name; return; }
                      if (v === s.name) return;
                      const ok = onUpdateSection(s.id, { name: v });
                      if (ok === false) { e.target.value = s.name; return; }
                      if (activeSection === s.name) setActiveSection(v);
                    }}
                    onKeyDown={e => { if (e.key === 'Enter') e.target.blur(); }}
                  />
                  <select
                    className="section-region-select"
                    value={sectionRegion(s)}
                    title="이 섹션이 속한 구분 (바꾸면 반대쪽으로 이동해요)"
                    onChange={e => {
                      onUpdateSection(s.id, { region: e.target.value });
                      if (activeSection === s.name) setActiveSection('');
                    }}
                  >
                    {REGIONS.map(r => <option key={r} value={r}>{r}</option>)}
                  </select>
                  <button
                    type="button"
                    className="icon-btn"
                    onClick={() => {
                      onRemoveSection(s.id);
                      if (activeSection === s.name) {
                        const next = regionSections.find(x => x.id !== s.id);
                        setActiveSection(next ? next.name : '');
                      }
                    }}
                  >
                    <Trash2 size={14} />
                  </button>
                </div>
              ))}
            </div>
            <p className="hint-text-small">번호와 이름을 바로 고쳐 쓸 수 있어요. 동그라미를 누르면 아래에서 그 섹션의 카테고리를 관리할 수 있어요.</p>
            <div className="field-row">
              <input value={newSection} onChange={e => setNewSection(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleAddSectionClick()} placeholder="새 섹션 이름" />
              <button type="button" className="btn btn--ghost btn--sm" onClick={handleAddSectionClick}>추가</button>
            </div>
          </div>

          {activeSection && (
            <div className="field">
              <span>「{activeSection}」의 카테고리 (번호 1~20)</span>
              <div className="category-edit-list">
                {categories.length === 0 && <p className="hint-text-small">아직 카테고리가 없어요.</p>}
                {categories.map(c => (
                  <div key={c.id} className="category-edit-row">
                    <input
                      key={`cn-${c.id}-${c.number}`}
                      type="number" min={0.1} max={99} step="any"
                      defaultValue={c.number}
                      title="소수점 가능 (예: 1.5는 1번과 2번 사이)"
                      onBlur={e => {
                        const raw = e.target.value;
                        if (raw === '') { e.target.value = c.number; return; }
                        const v = clampDec(raw, 0.1, 99);
                        if (v === '' || v === c.number) { e.target.value = c.number; return; }
                        if (categories.some(x => x.id !== c.id && Number(x.number) === v)) {
                          window.alert(`${v}번은 이 섹션에서 이미 쓰고 있어요. 다른 번호를 입력해주세요.`);
                          e.target.value = c.number;
                          return;
                        }
                        onUpdateCategory(c.id, { number: v });
                      }}
                      onKeyDown={e => { if (e.key === 'Enter') e.target.blur(); }}
                    />
                    <input
                      key={`cm-${c.id}-${c.name}`}
                      defaultValue={c.name}
                      onBlur={e => {
                        const v = e.target.value.trim();
                        if (!v) { e.target.value = c.name; return; }
                        if (v !== c.name) onUpdateCategory(c.id, { name: v });
                      }}
                      onKeyDown={e => { if (e.key === 'Enter') e.target.blur(); }}
                    />
                    <input
                      key={`cd-${c.id}-${c.description || ''}`}
                      defaultValue={c.description || ''}
                      onBlur={e => {
                        const v = e.target.value.trim();
                        if (v !== (c.description || '')) onUpdateCategory(c.id, { description: v });
                      }}
                      onKeyDown={e => { if (e.key === 'Enter') e.target.blur(); }}
                      placeholder="설명 (마우스를 올리면 표시)"
                    />
                    <button type="button" className="icon-btn" onClick={() => onRemoveCategory(c.id)}><Trash2 size={14} /></button>
                  </div>
                ))}
              </div>
              <div className="field-row">
                <input className="field--small" type="number" min={0.1} max={99} step="any" value={newCatNumber} onChange={e => setNewCatNumber(e.target.value)} placeholder="번호" />
                <input value={newCatName} onChange={e => setNewCatName(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleAddCategoryClick()} placeholder="새 카테고리 이름 (예: 80년대 영화, 뮤지컬)" />
                <input value={newCatDesc} onChange={e => setNewCatDesc(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleAddCategoryClick()} placeholder="설명 (선택)" />
                <button type="button" className="btn btn--ghost btn--sm" onClick={handleAddCategoryClick}>추가</button>
              </div>
            </div>
          )}
        </div>
        <div className="drawer__foot">
          {resetConfirm ? (
            <div className="confirm-delete">
              <span>섹션·카테고리·테마를 모두 초기 상태로 되돌릴까요?</span>
              <button type="button" className="btn btn--danger" onClick={() => { onResetSettings(); setResetConfirm(false); }}>초기화</button>
              <button type="button" className="btn btn--ghost" onClick={() => setResetConfirm(false)}>취소</button>
            </div>
          ) : (
            <button type="button" className="btn btn--ghost btn--danger-text" onClick={() => setResetConfirm(true)}>설정 초기화</button>
          )}
          <div className="drawer__foot-actions">
            <button type="button" className="btn btn--primary" onClick={onCancel}>완료</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function reportEsc(v) {
  return String(v == null ? '' : v).split('&').join('&amp;').split('<').join('&lt;').split('>').join('&gt;').split('"').join('&quot;');
}
function reportList(arr, single) {
  return Array.isArray(arr) && arr.length ? arr : (single ? [single] : []);
}
function reportLocText(l, secMap) {
  if (l.individual) return '개별 보관';
  const sec = secMap.get(l.section);
  const region = sec ? sectionRegion(sec) : '';
  const cs = l.contents || [];
  const hasDisc = (l.disc || 1) > 1 || l.note || cs.some(c => c !== 'main');
  return [region, l.section, '(' + l.categoryNumber + ') ' + l.categoryName].filter(Boolean).join(' ') +
    (l.itemNumber ? ' ' + l.itemNumber + '번 칸' : '') +
    (hasDisc ? ' Disc ' + (l.disc || 1) + (cs.length ? ' (' + cs.map(contentLabel).join(', ') + ')' : '') + (l.note ? ' ' + l.note : '') : '') +
    (l.shared ? ' 함께 수록' : '');
}
function reportLocShort(l, secMap) {
  if (l.individual) return '<span class="lt">개별 보관</span>';
  const sec = secMap.get(l.section);
  const region = sec ? sectionRegion(sec) : '';
  const cs = l.contents || [];
  const hasDisc = (l.disc || 1) > 1 || l.note || cs.some(c => c !== 'main');
  const text = (sec && sec.number != null ? sec.number + '. ' : '') + l.section + ' (' + l.categoryNumber + ') ' + l.categoryName +
    (l.itemNumber ? ' · ' + l.itemNumber + '번' : '') +
    (hasDisc ? ' · Disc ' + (l.disc || 1) + (cs.length ? ' (' + cs.map(contentLabel).join(', ') + ')' : '') + (l.note ? ' ' + l.note : '') : '') +
    (l.shared ? ' · 함께 수록' : '');
  return (region ? '<b class="rg">' + reportEsc(region) + '</b> ' : '') + '<span class="lt">' + reportEsc(text) + '</span>';
}
function reportPoster(m, opts, cls) {
  return opts.withPoster && m.posterUrl
    ? '<img class="' + cls + '" loading="lazy" alt="" src="' + reportEsc(m.posterUrl) + '">'
    : '<div class="' + cls + ' ph"></div>';
}
function reportQuery(m, extra) {
  return [m.titleKr, m.titleOriginal, m.year, reportList(m.countries, m.country).join(' '), reportList(m.genres, m.genre).join(' '),
    m.director, (m.actors || []).join(' '), m.seriesName, (m.hashtags || []).join(' '), m.notes, m.synopsis,
    (m.formats || []).join(' '), extra].join(' ').toLowerCase();
}
function reportShelfEntry(m, l, secMap, opts) {
  const cs = l.contents || [];
  const hasDisc = (l.disc || 1) > 1 || l.note || cs.some(c => c !== 'main');
  const disc = hasDisc ? 'Disc ' + (l.disc || 1) + (cs.length ? ' · ' + cs.map(contentLabel).join(', ') : '') + (l.note ? ' (' + l.note + ')' : '') : '';
  const sub = [m.year, m.director].filter(Boolean).join(' · ');
  const rate = Number(m.rating) > 0 ? '<span class="rate">★ ' + Number(m.rating) + '</span>' : '';
  const series = m.seriesName ? '시리즈: ' + m.seriesName + (m.seriesOrder !== '' && m.seriesOrder != null ? ' #' + m.seriesOrder : '') : '';
  return '<div class="entry" data-q="' + reportEsc(reportQuery(m, reportLocText(l, secMap))) + '">' + reportPoster(m, opts, 'sp') +
    '<div class="si"><div class="st">' + reportEsc(m.titleKr || '제목 없음') +
    (m.titleOriginal ? ' <span class="orig">' + reportEsc(m.titleOriginal) + '</span>' : '') + ' ' + rate +
    (m.favorite ? ' <span class="heart">♥</span>' : '') + (m.status === 'wishlist' ? ' <span class="pill">미보유</span>' : '') + '</div>' +
    ([sub, series, disc].filter(Boolean).length ? '<div class="ss">' + reportEsc([sub, series, disc].filter(Boolean).join('  |  ')) + '</div>' : '') + '</div></div>';
}
function reportRow(m, secMap, opts) {
  const countries = reportList(m.countries, m.country);
  const genres = reportList(m.genres, m.genre);
  const ls = getLocations(m);
  const grp = new Set();
  const locTexts = [];
  const locShorts = [];
  const hasPhys = ls.length > 0;
  if (!hasPhys) {
    const plats = (m.formats && m.formats.length) ? m.formats : [];
    grp.add('플랫폼');
    locTexts.push(plats.length ? plats.join(', ') + ' (플랫폼)' : '플랫폼 미등록');
    locShorts.push(plats.length
      ? '<span class="lt">' + reportEsc(plats.join(', ')) + '</span>'
      : '<span class="lt">플랫폼 미등록</span>');
  }
  ls.forEach(l => {
    locTexts.push(reportLocText(l, secMap));
    locShorts.push(reportLocShort(l, secMap));
    if (l.individual) { grp.add('개별'); return; }
    const sec = secMap.get(l.section);
    grp.add(sec ? sectionRegion(sec) : '없음');
  });
  const fm = (m.formats && m.formats.length) ? m.formats : ['미분류'];
  const yearNum = parseInt(m.year, 10) || 0;
  const rateNum = Number(m.rating) > 0 ? Number(m.rating) : 0;
  const sub = [m.year, m.director].filter(Boolean).join(' · ');
  const seriesBits = [];
  if (m.seriesName) {
    seriesBits.push(m.seriesName + (m.seriesOrder !== '' && m.seriesOrder != null ? ' #' + m.seriesOrder : '') +
      (m.seriesUnofficial ? ' (비공식)' : '') + (m.seriesRemake ? ' (리메이크)' : ''));
  }
  const seriesLine = seriesBits.join(' · ');
  const sOrder = Number(m.seriesOrder) || 0;
  const rows = [];
  const add = (k, v) => { if (v) rows.push('<dt>' + k + '</dt><dd>' + v + '</dd>'); };
  add('국가·장르', reportEsc([countries.join(', '), genres.join(', ')].filter(Boolean).join(' · ')));
  add('상영·등급', reportEsc([m.runtime ? m.runtime + '분' : '', m.ageRating].filter(Boolean).join(' · ')));
  add('출연', reportEsc((m.actors || []).join(', ')));
  if (m.seriesName) {
    add('시리즈', reportEsc(seriesLine));
  }
  add('줄거리', m.synopsis ? '<span class="pre">' + reportEsc(m.synopsis) + '</span>' : '');
  add('태그', reportEsc((m.hashtags || []).map(t => '#' + t).join(' ')));
  add('메모', m.notes ? '<span class="pre">' + reportEsc(m.notes) + '</span>' : '');
  const locHtml = locShorts.join('<br>');
  return '<details class="mv" data-title="' + reportEsc(m.titleKr || '') + '" data-year="' + yearNum + '" data-rate="' + rateNum +

function buildReportHtml(movies, settings, opts) {

    const ls = getLocations(m);

    if (ls.length === 0) g.add('플랫폼');

      if (l.individual) { g.add('개별'); if (!indiv.includes(m)) indiv.push(m); return; }

      const key = catKey(l);
      if (!byKey.has(key)) byKey.set(key, []);
      byKey.get(key).push({ m, l });

    '<main><section id="p-all" class="panel">' + sum + fbar +
    '<div class="rc"><b id="cnt">' + movies.length + '편</b><button type="button" class="link" id="reset">필터 초기화</button></div>' +
    '<div id="list">' + listHtml + '</div></section>' +
    '<section id="p-dvd" class="panel off"><div class="toc">' + tocHtml + '</div>' + shelf + indivHtml + '</section></main>' +
    '<scr' + 'ipt>' + js + '<' + '/script></body></html>';
}
function buildCsv(movies, settings) {
  const secMap = new Map(settings.sections.map(s => [s.name, s]));
  const header = ['구분', '섹션', '카테고리번호', '카테고리', '칸번호', '디스크', '디스크내용', '함께수록', '제목', '원제', '연도', '국가', '장르', '상영시간', '관람등급', '감독', '출연', '별점', '하트', '보유상태', '매체', '시리즈', '시리즈순서', '해시태그', '메모', '줄거리'];
  const rows = [];
  movies.forEach(m => {
    const ls = getLocations(m);
    const base = [m.titleKr, m.titleOriginal, m.year, reportList(m.countries, m.country).join(', '), reportList(m.genres, m.genre).join(', '),
      m.runtime, m.ageRating, m.director, (m.actors || []).join(', '), m.rating || '', m.favorite ? '♥' : '', m.status === 'wishlist' ? '미보유' : '보유',
      (m.formats || []).join(', '), m.seriesName || '', m.seriesName ? m.seriesOrder : '', (m.hashtags || []).map(t => '#' + t).join(' '), m.notes, m.synopsis];
    const mk = (loc, sortKey) => {
      let head;
      if (!loc) head = ['플랫폼', '', '', '', '', '', '', ''];
      else if (loc.individual) head = ['개별 보관', '', '', '', '', '', '', ''];
      else {
        const sec = secMap.get(loc.section);
        head = [sec ? sectionRegion(sec) : '', loc.section, loc.categoryNumber, loc.categoryName, loc.itemNumber, loc.disc || 1,
          (loc.contents || []).map(contentLabel).join(', ') + (loc.note ? ' (' + loc.note + ')' : ''), loc.shared ? '예' : ''];
      }
      rows.push({ sortKey, cells: head.concat(base) });
    };
    if (ls.length === 0) { mk(null, [97, 0, 0, 0, 0, m.titleKr || '']); return; }
    ls.forEach(l => {
      if (l.individual) { mk(l, [98, 0, 0, 0, 0, m.titleKr || '']); return; }
      const sec = secMap.get(l.section);
      const ri = sec ? Math.max(0, REGIONS.indexOf(sectionRegion(sec))) : 90;
      mk(l, [ri, sec ? Number(sec.number) || 0 : 0, Number(l.categoryNumber) || 0, Number(l.itemNumber) || 0, l.disc || 1, m.titleKr || '']);
    });
  });
  rows.sort((a, b) => {
    for (let i = 0; i < 5; i++) { if (a.sortKey[i] !== b.sortKey[i]) return a.sortKey[i] - b.sortKey[i]; }
    return String(a.sortKey[5]).localeCompare(String(b.sortKey[5]), 'ko');
  });
  const CR = String.fromCharCode(13);
  const LF = String.fromCharCode(10);
  const cell = v => '"' + String(v == null ? '' : v).split(CR).join('').split(LF).join(' ').split('"').join('""') + '"';
  const lines = [header.map(cell).join(',')].concat(rows.map(r => r.cells.map(cell).join(',')));
  return String.fromCharCode(0xFEFF) + lines.join(CR + LF);
}
function ExportModal({ movies, settings, onClose }) {
  const [format, setFormat] = useState('html');
  const [includeWishlist, setIncludeWishlist] = useState(true);
  const [withPoster, setWithPoster] = useState(true);
  const list = includeWishlist ? movies : movies.filter(m => m.status !== 'wishlist');
  function handleDownload() {
    const d = new Date();
    const stamp = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    let blob;
    let name;
    if (format === 'html') {
      blob = new Blob([buildReportHtml(list, settings, { withPoster })], { type: 'text/html;charset=utf-8' });
      name = '영화컬렉션_' + stamp + '.html';
    } else {
      blob = new Blob([buildCsv(list, settings)], { type: 'text/csv;charset=utf-8' });
      name = '영화컬렉션_' + stamp + '.csv';
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  }
  return (
    <div className="drawer-backdrop" onClick={onClose}>
      <div className="drawer" onClick={e => e.stopPropagation()}>
        <div className="drawer__head">
          <h2>문서로 내보내기</h2>
          <button type="button" className="icon-btn" onClick={onClose}><X size={18} /></button>
        </div>
        <div className="drawer__body">
          <div className="field">
            <span>형식</span>
            <div className="segmented">
              <button type="button" className={format === 'html' ? 'is-active' : ''} onClick={() => setFormat('html')}>보기용 문서 (HTML)</button>
              <button type="button" className={format === 'csv' ? 'is-active' : ''} onClick={() => setFormat('csv')}>표 (CSV)</button>
            </div>
            <p className="hint-text-small">
              {format === 'html'
                ? '「전체 목록」(매체·보관·상태 필터, 시리즈만 보기, 정렬)과 「DVD 보관함」(외화 / 한국 / 개별 보관 목차와 칸별 정리) 두 탭으로 구성돼요. DVD가 아닌 영화는 매체·구매 플랫폼을 보관 위치로 표시해요. 더블클릭하면 맥의 Safari·Chrome에서 바로 열리고, 상단 검색창이나 ⌘F로 검색할 수 있어요. 영화를 누르면 줄거리·출연 등 상세가 펼쳐져요. 인쇄 → PDF 저장도 가능해요.'
                : '영화·디스크 한 줄씩 정리한 표예요. 맥의 Numbers·엑셀에서 한글이 깨지지 않도록 저장돼요. 정렬·필터가 필요할 때 쓰세요.'}
            </p>
          </div>
          <label className="checkbox-row">
            <input type="checkbox" checked={includeWishlist} onChange={e => setIncludeWishlist(e.target.checked)} />
            미보유(위시리스트) 영화도 포함
          </label>
          {format === 'html' && (
            <label className="checkbox-row">
              <input type="checkbox" checked={withPoster} onChange={e => setWithPoster(e.target.checked)} />
              포스터 이미지 포함 (보려면 인터넷 연결이 필요해요)
            </label>
          )}
          <p className="hint-text-small">내보낼 영화: {list.length}편 (등록된 최종 정보 기준)</p>
        </div>
        <div className="drawer__foot">
          <div className="drawer__foot-actions">
            <button type="button" className="btn btn--ghost" onClick={onClose}>닫기</button>
            <button type="button" className="btn btn--primary" onClick={handleDownload} disabled={list.length === 0}><DownloadIcon size={14} /> 다운로드</button>
          </div>
        </div>
      </div>
    </div>
  );
}
